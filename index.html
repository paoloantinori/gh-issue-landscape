<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: Roboto Mono;
    color: #000000;
  }
  .container-box {
    margin: 8px 16px 8px 16px;
    padding: 12px;
    border-radius: 16px;
    line-height: 0.95;
    width: fit-content;
    height: fit-content;
    z-index: 2;
    backdrop-filter: blur(3px);
    background: #ffffffaa;
    box-shadow: 2px 3px 10px #aaaaaa44;
    position: relative;
    pointer-events: auto;
  }
  .more-opaque {
    backdrop-filter: blur(6px);
    background-color: #ffffffee;
  }
  #deck-container {
    width: 100vw;
    height: 100vh;  
  }
  #deck-container canvas {
    z-index: 1;
    background: #ffffff;
  }
  .deck-tooltip {
      
            font-size: 0.8em;
            font-family: Roboto Mono;
            font-weight: 300;
            color: #000000 !important;
            background-color: #ffffffee !important;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 2px 3px 10px #aaaaaa44;
            max-width: 25%;
  }
  input {
    margin: 2px;
    padding: 4px;
    border-radius: 8px;
    color: #000000;
    background: #ffffffdd;
    border: 2px inset #77777744;
    transition: 0.5s;
    outline: none;
    box-sizing: border-box;
  }
  input:focus {
    border: 2px inset #555;
  }
  

</style>

function debounce(func, timeout = 250) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => { func.apply(this, args); }, timeout);
  };
}

async function simpleArrowParser(arrow_bytes) {
  const table = await Arrow.tableFromIPC(arrow_bytes);
  const result = {};
  table.schema.fields.forEach((field) => {
    result[field.name] = table.getChild(field.name).toArray();
  });
  return result;
}

function mergeTypedArrays(arrays) {
  let totalLength = arrays.reduce((acc, arr) => acc + arr.length, 0);
  let result = new arrays[0].constructor(totalLength);
  let currentLength = 0;
  for (let arr of arrays) {
    result.set(arr, currentLength);
    currentLength += arr.length;
  }
  return result;
}



function updateProgressBar(id, progress) {
  const progressBar = document.querySelector(`#${id} .datamapplot-progress-bar-fill`);
  const progressText = document.querySelector(`#${id} .datamapplot-progress-bar-text`);
  if (progressBar && progressText) {
    progressBar.style.width = `${progress}%`;
    progressText.textContent = `${id.replace('-progress', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}: ${progress}%`;
  }
}

function checkAllDataLoaded() {
  const progressBars = document.querySelectorAll('.datamapplot-progress-bar-fill');
  const allLoaded = Array.from(progressBars).every(bar => bar.style.width === '100%');
  if (allLoaded) {
    const loadingEl = document.getElementById("loading");
    const progressEl = document.getElementById("progress-container");
    if (loadingEl) loadingEl.style.display = "none";
    if (progressEl) progressEl.style.display = "none";
    // Dispatch unified event for widgets to listen on
    document.dispatchEvent(new CustomEvent('datamapDataLoaded'));
  }
}

// Find a stack container or drawer by location name.
// Supports both corner locations ("top-left", "bottom-right", etc.)
// and drawer locations ("drawer-left", "drawer-right", "drawer-bottom").
function findStackContainer(location) {
  let stack = document.getElementsByClassName("stack " + location)[0];
  if (!stack && location.startsWith("drawer-")) {
    const drawerDirection = location.replace("drawer-", "");
    const drawer = document.querySelector(".drawer-container.drawer-" + drawerDirection);
    if (drawer) {
      stack = drawer;
    }
  }
  return stack;
}

  self.onmessage = async function(event) {

    // Function to parse base64 to Uint8Array
    async function DecompressBytes(bytes) {
      const blob = new Blob([bytes]);
      const decompressedStream = blob.stream().pipeThrough(
        new DecompressionStream("gzip")
      );
      const arr = await new Response(decompressedStream).arrayBuffer()
      return new Uint8Array(arr);
    }
    async function decodeBase64WithProgress(base64) {
      const totalLength = base64.length;
      const chunkSize = 1024 * 1024; // 1MB chunks
      let decodedArray = new Uint8Array(Math.ceil(totalLength * 3 / 4));
      let offset = 0;

      for (let i = 0; i < totalLength; i += chunkSize) {
        const chunk = base64.slice(i, i + chunkSize);
        const decodedChunk = Uint8Array.from(atob(chunk), c => c.charCodeAt(0));
        decodedArray.set(decodedChunk, offset);
        offset += decodedChunk.length;

        const progress = Math.min(100, Math.round((i + chunkSize) / totalLength * 100));
        self.postMessage({ type: 'progress', progress: progress });

        // Allow other operations to occur
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      return decodedArray.slice(0, offset);
    }
    const decodedData = await decodeBase64WithProgress(encodedData);
    const decompressedData = await DecompressBytes(decodedData);

// =============================================================================
// Density Tile Image Resolver
// =============================================================================

async function resolveDensityTileImages(tilePyramids) {
  // When running inside a Jupyter notebook with file-based data, image URLs
  // point at the Jupyter contents API which returns JSON with base64 content
  // instead of raw image bytes.  Detect this and convert to blob URLs so that
  // deck.gl BitmapLayer can consume them.
  const allTiles = [];
  for (const field of Object.keys(tilePyramids)) {
    for (const level of tilePyramids[field]) {
      for (const tile of level) {
        allTiles.push(tile);
      }
    }
  }
  if (allTiles.length === 0) return;

  // Only need special handling when the URL routes through /api/contents/
  const needsResolve = allTiles[0].image.includes('/api/contents/');
  if (!needsResolve) return;

  const headers = {};
  const densityApiToken = (typeof DENSITY_API_TOKEN !== 'undefined') ? DENSITY_API_TOKEN : null;
  if (densityApiToken) {
    headers['Authorization'] = 'Token ' + densityApiToken;
  }

  await Promise.all(allTiles.map(async (tile) => {
    try {
      const resp = await fetch(tile.image, { headers });
      if (!resp.ok) {
        console.error('Failed to fetch density tile:', tile.image, resp.status);
        return;
      }
      const json = await resp.json();
      const b64 = json.content;  // Jupyter contents API base64 field
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'image/png' });
      tile.image = URL.createObjectURL(blob);
    } catch (e) {
      console.error('Error resolving density tile image:', e);
    }
  }));
}

Schema / Type / Compatibility"}, {"number": 1368, "title": "JSON compatibility check for conditional schema", "body": "Hello,\r\n\r\nI am testing the JSON compatibility check for conditional schema. There are some cases that seem incorrect.\r\n\r\nLet me know what do you think!\r\n\r\nFor example:\r\nif added; and vice versa for if...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1368", "labels": ["type/bug"], "created_at": "2021-03-22T20:56:43Z", "topic": "Schema / Type / Compatibility"}, {"number": 1334, "title": "Protobuf backwards compatibility check issue?", "body": "Hello, thank you for sharing the Apicurio Registry, it's a great service. I have a question about whether the logic for protobuf backwards compatibility is conforming to what protobufs actually consid...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1334", "labels": ["type/question"], "created_at": "2021-03-11T20:32:28Z", "topic": "Uncategorized"}, {"number": 1196, "title": "V2 search API - exact or LIKE search by groupId", "body": "From PR #1189 . \nThis issue will be the follow up for the discussion about how the searchApi at the storage level should behave when searching by groupId.\r\n\r\nJust to move on we decided to make the sea...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1196", "labels": ["type/discussion"], "created_at": "2021-02-08T13:38:19Z", "topic": "Search / Query / Count"}, {"number": 1181, "title": "Add support for gRPC", "body": "We already have protobuf support, so adding support for grpc shouldn't be too hard!", "url": "https://github.com/Apicurio/apicurio-registry/issues/1181", "labels": ["type/enhancement"], "created_at": "2021-02-01T12:23:46Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 1144, "title": "Create annotation to exclude a method from liveness checking", "body": "We have annotations to enable liveness checking for certain CDI beans: `@PersistenceExceptionLivenessApply`\r\n\r\nThis is nice but sometimes we may have internal methods within a class annotated with thi...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1144", "labels": [], "created_at": "2021-01-14T18:19:52Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 1122, "title": "[Feature] Github/Git integration using post hooks", "body": "APIcurio registry gives developers a lot of features and benefits over schemas in the code, however, one can argue that keeping schemas in the repository and utilizing git versioning/PR building capab...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1122", "labels": ["type/enhancement"], "created_at": "2021-01-06T10:48:31Z", "topic": "Git / Registry / Reference"}, {"number": 974, "title": "REST API - return artifactId , version and globalId in headers ", "body": "It could be useful to return artifactId, artifact version and globalId in the response headers of all endpoints that return an artifact content. \n\r\nThis way the number of requests neede by clients cou...", "url": "https://github.com/Apicurio/apicurio-registry/issues/974", "labels": ["type/enhancement", "version/2.0.x"], "created_at": "2020-11-02T12:19:58Z", "topic": "Git / Registry / Reference"}, {"number": 956, "title": "Add support for FlatBuffers artifact type", "body": "https://google.github.io/flatbuffers/", "url": "https://github.com/Apicurio/apicurio-registry/issues/956", "labels": ["type/enhancement"], "created_at": "2020-10-26T14:29:56Z", "topic": "Uncategorized"}, {"number": 807, "title": "Add support for the Thrift format", "body": "Able to auto-detect and upload Thrift format schema\r\n\r\nThrift schema definition https://thrift.apache.org/docs/idl\r\nThrift tutorial https://thrift.apache.org/tutorial/\r\nExample file https://raw.github...", "url": "https://github.com/Apicurio/apicurio-registry/issues/807", "labels": ["type/enhancement", "priority/normal"], "created_at": "2020-09-07T09:49:05Z", "topic": "Uncategorized"}, {"number": 716, "title": "Support \"usages\" as a data-driven way to document how to consume an artifact for a user", "body": "A nice feature in the UI would be a section for \"Usage\" - similar to what API documentation generators and maven central provide:\r\n\r\n\r\n\r\n\r\n\r\nOriginally I was thinking we should do something similar ju...", "url": "https://github.com/Apicurio/apicurio-registry/issues/716", "labels": ["type/enhancement", "type/discussion"], "created_at": "2020-07-28T12:09:57Z", "topic": "Git / Registry / Reference"}, {"number": 656, "title": "Add UI support for \"testing\" potential artifact content update", "body": "There is a \"test\" operation in the REST api that allows a user to upload a new version of an artifact to check whether the new version passes all enabled/configured rules active for the artifact. It d...", "url": "https://github.com/Apicurio/apicurio-registry/issues/656", "labels": ["type/enhancement", "area/ui", "version/3.x"], "created_at": "2020-06-24T17:29:43Z", "topic": "Version / Ui / Api"}, {"number": 634, "title": "Add basic skinning/branding capability in UI", "body": "It would be useful if the UI could be configured with different logos and favicons so that deployers of the application can brand the UI without rebuilding it.", "url": "https://github.com/Apicurio/apicurio-registry/issues/634", "labels": ["type/enhancement", "priority/low", "area/ui"], "created_at": "2020-06-17T12:11:15Z", "topic": "Git / Registry / Reference"}, {"number": 633, "title": "Improve HTTP cache headers", "body": "## Summary\n\nCurrently we are very simplistic in our approach to the HTTP headers for caching. We basically disable caching for everything other than UI resources (css, js, etc). Instead, we should con...", "url": "https://github.com/Apicurio/apicurio-registry/issues/633", "labels": ["type/task"], "created_at": "2020-06-17T12:09:50Z", "topic": "Uncategorized"}, {"number": 365, "title": "Run quality inspection tools at build time", "body": "Use [code quality tools](https://github.com/gregswindle/maven-code-quality-pom/blob/master/README.md) and maven plugins, such as FindBugs or PMD\r\n\r\nSee also #359", "url": "https://github.com/Apicurio/apicurio-registry/issues/365", "labels": ["type/quality"], "created_at": "2020-04-08T15:50:05Z", "topic": "Graphql / Federation / Xml"}, {"number": 360, "title": "Improve rule configuration", "body": "Rule configuration should not be a single string - the options that rules require should be explicitly defined, multi-valued and possibly type-checked.\r\n\r\nSee also #359", "url": "https://github.com/Apicurio/apicurio-registry/issues/360", "labels": ["type/enhancement"], "created_at": "2020-04-08T15:36:37Z", "topic": "Schema / Type / Compatibility"}, {"number": 218, "title": "Compatibility Rule: Kafka Connect Schema", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/218", "labels": [], "created_at": "2020-01-14T16:51:32Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 217, "title": "Compatibility Rule: GraphQL", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/217", "labels": [], "created_at": "2020-01-14T16:51:14Z", "topic": "Uncategorized"}, {"number": 16, "title": "Compatibility Rule: AsyncAPI", "body": "Implement the compatibility rule for AsyncAPI schemas. We'll need to really analyze the avro version to implement similar logic for AsyncAPI.", "url": "https://github.com/Apicurio/apicurio-registry/issues/16", "labels": ["type/enhancement"], "created_at": "2019-07-30T17:25:26Z", "topic": "Uncategorized"}];
  var issueByIndex = {};
  ISSUE_DATA.forEach(function(d, i) { issueByIndex[i] = d; });

  var card = document.getElementById('issue-card');
  var backdrop = document.getElementById('issue-card-backdrop');
  var cardTitle = document.getElementById('card-title');
  var cardTopic = document.getElementById('card-topic');
  var cardBody = document.getElementById('card-body');
  var cardLabels = document.getElementById('card-labels');
  var cardDate = document.getElementById('card-date');
  var cardLink = document.getElementById('card-link');
  var cardClose = document.getElementById('card-close');

  function showCard(issue) {
    cardTitle.innerHTML = '<span id="card-number">#' + issue.number + '</span> ' +
      issue.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    cardTopic.textContent = issue.topic || '';
    cardBody.textContent = issue.body || '(no description)';
    cardLabels.innerHTML = '';
    (issue.labels || []).forEach(function(label) {
      var pill = document.createElement('span');
      pill.className = 'card-label-pill';
      pill.textContent = label;
      cardLabels.appendChild(pill);
    });
    cardDate.textContent = issue.created_at ? issue.created_at.substring(0, 10) : '';
    cardLink.href = issue.url || '#';
    backdrop.style.display = 'block';
    card.style.display = 'block';
  }

  function hideCard() {
    card.style.display = 'none';
    backdrop.style.display = 'none';
  }

  cardClose.addEventListener('click', hideCard);
  backdrop.addEventListener('click', hideCard);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideCard();
  });

  // Hook into deck.gl's onClick via the DataMap instance.
  // DataMapPlot creates a global `datamap` variable with a `.deckgl` DeckGL instance.
  function hookDeckClick() {
    if (window.datamap && window.datamap.deckgl) {
      window.datamap.deckgl.setProps({
        controller: {scrollZoom: {speed: 0.3, smooth: false}},
        onClick: function(info) {
          if (info && info.picked && info.index != null) {
            var issue = issueByIndex[info.index];
            if (issue) { showCard(issue); return true; }
          }
        }
      });
      // Remove CSS transition on canvas that causes sluggish repaints
      var canvas = document.querySelector('canvas');
      if (canvas) canvas.style.transition = 'none';
    }
  }

  // Retry until DataMap is initialized (data loads asynchronously)
  var attempts = 0;
  var timer = setInterval(function() {
    attempts++;
    if (window.datamap && window.datamap.deckgl) {
      clearInterval(timer);
      hookDeckClick();
    } else if (attempts > 30) {
      clearInterval(timer);
    }
  }, 500);
})();
</script>
