e `$details` Suffix Pattern\n\n### Routing Implementation\n\nOption A — JAX-RS ContainerRequestFilter (recommended):\n```java\n@Provider\n@Priority(Priorities.HEA...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7448", "labels": ["type/enhancement", "priority/high", "area/rest"], "created_at": "2026-02-27T09:15:31Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7447, "title": "xRegistry: Schema Registry REST API layer", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 2)\n\n## Summary\n\nImplement the xRegistry Schema Registry HTTP binding as a new REST API layer alongside the existing v3 API. This provides xRegistry-compliant endpoints for managing schema groups, schemas, and schema versions.\n\n## Endpoint Structure\n\n```\nBase path: /apis/xregistry/v1 (or configurable)\n\n/ — Registry root\n/schemagroups — List/create schema groups\n/schemagroups/{groupId} — Get/update/delete schema group\n/schemagroups/{groupId}/schemas — List/create schemas\n/schemagroups/{groupId}/schemas/{schemaId} — Get/...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7447", "labels": ["type/enhancement", "impacts/documentation", "priority/high", "area/rest"], "created_at": "2026-02-27T09:15:00Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7446, "title": "xRegistry: Core data model extensions (epoch, Meta entity, registry config)", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 1)\n\n## Summary\n\nExtend the Apicurio Registry storage layer and data model to support xRegistry semantics. This is the foundational work that all other xRegistry phases depend on.\n\n## Changes Required\n\n### 1. Add `epoch` Field to All Entities\n\nxRegistry uses an `epoch` counter (unsigned integer, starts at 0, incremented on every modification) for optimistic concurrency control.\n\n**Affected DTOs:**\n- `GroupMetaDataDto` — add `epoch` (long)\n- `ArtifactMetaDataDto` — add `epoch` (long)\n- `ArtifactVersionMetaDataDto` — add...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7446", "labels": ["type/enhancement", "impacts/documentation", "priority/high", "area/rest", "area/storage"], "created_at": "2026-02-27T09:07:26Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7445, "title": "EPIC: xRegistry Specification Support", "body": "## Summary\n\nAdd support for the [xRegistry specification](https://github.com/xregistry/spec) (v1.0-rc2) to Apicurio Registry. xRegistry is a CNCF project that provides a standardized, extensible model and REST API for managing metadata about resources such as schemas, message definitions, and endpoints.\n\n## Motivation\n\n- **Standardization**: xRegistry is becoming the industry standard for schema/API registries under CNCF governance\n- **Interoperability**: Supporting xRegistry enables Apicurio to interoperate with other xRegistry-compliant tools and ecosystems\n- **Extended scope**: xRegistry de...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7445", "labels": ["type/enhancement", "impacts/documentation", "priority/high", "area/rest", "area/storage", "type/epic"], "created_at": "2026-02-27T09:06:01Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7393, "title": "Apicurio registry operator deployment doesn't have `nodeSelector` causing it to to fail when being deployed to arm64 clusters.", "body": "There are two ways to solve this problem:\n* define `nodeSelector` with proper architecture in `Deployment` of the Operator\n* or build multi-arch images of the operator and distribute them, the same way as it is done for the Registry itself", "url": "https://github.com/Apicurio/apicurio-registry/issues/7393", "labels": ["type/bug", "priority/normal", "area/operator"], "created_at": "2026-02-13T09:03:11Z", "topic": "Uncategorized"}, {"number": 7374, "title": "[Data Contracts] ccompat Metadata and Tags API", "body": "## Parent Epic\nPart of #6192 (Phase 7: UI & ccompat)\n\n## Priority\nP3 (Low)\n\n## Phase\nPhase 6 - ccompat Integration\n\n## Blocked By\n- #7357 Tag REST API\n\n## Description\n\nImplement ccompat metadata and tags endpoints.\n\n## Requirements\n\n- [ ] `GET /subjects/{subject}/versions/{version}/metadata`\n ```json\n {\n \"properties\": {\n \"owner\": \"team-a\",\n \"application.major.version\": \"2\"\n },\n \"tags\": [\n { \"key\": \"sensitive\", \"value\": [\"ssn\", \"email\"] }\n ]\n }\n ```\n\n- [ ] `PUT /subjects/{subject}/versions/{version}/metadata`\n - Update metadata properties\n - Merge with existing\n\n- [ ] `DELETE /subjects/{subject...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7374", "labels": ["type/enhancement"], "created_at": "2026-02-11T10:36:00Z", "topic": "Schema / Type / Compatibility"}, {"number": 7373, "title": "[Data Contracts] ccompat Schema Registration with Rules", "body": "## Parent Epic\nPart of #6192 (Phase 7: UI & ccompat)\n\n## Priority\nP3 (Low)\n\n## Phase\nPhase 6 - ccompat Integration\n\n## Blocked By\n- #7350 Contract Rule REST API\n\n## Description\n\nSupport ruleSet in ccompat schema registration API.\n\n## Requirements\n\n- [ ] Extend `POST /subjects/{subject}/versions` to accept full data contract format:\n ```json\n {\n \"schema\": \"{\\\"type\\\":\\\"record\\\",...}\",\n \"schemaType\": \"AVRO\",\n \"metadata\": {\n \"properties\": {\n \"owner\": \"team-a\",\n \"application.major.version\": \"2\"\n }\n },\n \"ruleSet\": {\n \"domainRules\": [\n {\n \"name\": \"validateAge\",\n \"kind\": \"CONDITION\",\n \"type\": \"CEL\",\n ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7373", "labels": ["type/enhancement"], "created_at": "2026-02-11T10:35:50Z", "topic": "Schema / Type / Compatibility"}, {"number": 7362, "title": "[Data Contracts] Encryption/Decryption Rule Executors", "body": "## Parent Epic\nPart of #6192 (Phase 4: Runtime Rules)\n\n## Priority\nP2 (Medium)\n\n## Phase\nPhase 3 - Rules Engine\n\n## Blocked By\n- #7359 Rule Executor SPI\n\n## Description\n\nImplement ENCRYPT and DECRYPT transform rules for field-level encryption.\n\n## Requirements\n\n- [ ] Create Key Management Service SPI:\n ```java\n public interface KeyManagementService {\n /**\n * Get or derive a data encryption key\n */\n byte[] getDataEncryptionKey(String kekName, byte[] context);\n\n /**\n * Encrypt data using KEK\n */\n byte[] encrypt(String kekName, byte[] plaintext);\n\n /**\n * Decrypt data using KEK\n */\n byte[] decryp...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7362", "labels": ["type/enhancement"], "created_at": "2026-02-11T10:31:26Z", "topic": "Uncategorized"}, {"number": 7361, "title": "[Data Contracts] CEL_FIELD Rule Executor", "body": "## Parent Epic\nPart of #6192 (Phase 4: Runtime Rules)\n\n## Priority\nP1 (High)\n\n## Phase\nPhase 3 - Rules Engine\n\n## Blocked By\n- #7360 CEL Rule Executor\n\n## Description\n\nImplement per-field CEL rule executor that applies expressions to specific fields, optionally filtered by tags.\n\n## Requirements\n\n- [ ] Implement `CelFieldRuleExecutor`:\n ```java\n @ApplicationScoped\n public class CelFieldRuleExecutor implements ContractRuleExecutor {\n @Override\n public String getType() { return \"CEL_FIELD\"; }\n\n @Override\n public Set getSupportedKinds() {\n return Set.of(RuleKind.CONDITION, RuleKind.TRANSFORM);\n }...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7361", "labels": ["type/enhancement"], "created_at": "2026-02-11T10:31:09Z", "topic": "Schema / Type / Compatibility"}, {"number": 7338, "title": "[RFC] Evaluate Confluent Schema Registry compatibility API (ccompat) for deprecation", "body": "## Summary\n\nThis RFC seeks to evaluate whether the Confluent Schema Registry compatibility API (ccompat) should be deprecated in favor of the native Apicurio Registry v3 REST API.\n\n## Background\n\nThe ccompat API (`app/src/main/java/io/apicurio/registry/ccompat/`) provides compatibility with Confluent Schema Registry clients, allowing users to migrate from Confluent SR to Apicurio Registry without changing their client code.\n\n### Current State\n\n- **Location**: `app/src/main/java/io/apicurio/registry/ccompat/`\n- **API Version**: v7 (see #7295 for v8 support discussion)\n- **Scope**: REST endpoint...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7338", "labels": ["type/discussion", "area/rest/ccompat"], "created_at": "2026-02-10T12:29:48Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7337, "title": "Remove deprecated KafkaSQL message classes (v8, v9, v10)", "body": "## Summary\n\nThe KafkaSQL storage implementation contains deprecated message format classes that are maintained for backwards compatibility with older event journal entries. These should be scheduled for removal after an appropriate migration window.\n\n## Deprecated Classes\n\nLocated in `app/src/main/java/io/apicurio/registry/storage/impl/kafkasql/messages/`:\n\n| Class | Status | Replacement |\n|-------|--------|-------------|\n| `CreateArtifact9Message.java` | @Deprecated | Current message format |\n| `CreateArtifact10Message.java` | @Deprecated | Current message format |\n| `CreateArtifactVersion8Me...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7337", "labels": ["type/task", "area/storage/kafkasql"], "created_at": "2026-02-10T12:29:43Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7336, "title": "Remove Java SDK v2 module alongside REST API v2 deprecation", "body": "## Summary\n\nThe `java-sdk-v2/` module provides a client SDK for the deprecated REST API v2. When REST API v2 is deprecated (see #7330), the corresponding Java SDK v2 module should also be removed.\n\n## Current State\n\n- **Module location**: `java-sdk-v2/`\n- **Purpose**: Kiota-generated client SDK for REST API v2\n- **Files**: ~80+ generated Java files in `target/generated-sources/kiota/`\n- **Factory**: `io.apicurio.registry.client.RegistryV2ClientFactory`\n\n## Rationale\n\n1. The SDK is tightly coupled to REST API v2 - when the API is removed, the SDK becomes useless\n2. Maintaining two SDK versions ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7336", "labels": ["type/task", "area/sdk/java"], "created_at": "2026-02-10T12:29:36Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7330, "title": "[RFC] Plan REST API v2 deprecation timeline", "body": "## Summary\n\nThis RFC proposes establishing a deprecation timeline for REST API v2 to eventually consolidate on v3 as the single supported API version.\n\n## Background\n\nApicurio Registry currently maintains two active REST API versions:\n- **v2** - Legacy API, maintained for backwards compatibility\n- **v3** - Current API with full feature set\n\n### v2 is a Translation Layer\n\nv2 is implemented as a translation layer that converts requests/responses to v3 format internally:\n\\`\\`\\`\nV2 API Request → V2ResourceImpl → V2ApiUtil conversions → Shared Storage → V3 DTOs\n\\`\\`\\`\n\n### Maintenance Burden\n\n| Com...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7330", "labels": ["type/quality", "type/discussion", "area/rest"], "created_at": "2026-02-10T09:40:24Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7329, "title": "Remove deprecated custom date format configuration", "body": "## Summary\n\nCustom date format configuration properties were deprecated in v3.1.2 due to SDK incompatibility and should be removed.\n\n## Location\n\n\\`common/src/main/java/io/apicurio/registry/rest/config/JacksonDateTimeCustomizer.java\\`\n\n## Deprecated Properties\n\n| Property | Line | Issue |\n|----------|------|-------|\n| \\`apicurio.apis.date-format\\` | 32 | Breaks SDK compatibility |\n| \\`apicurio.apis.date-format-timezone\\` | 42 | Breaks SDK compatibility |\n\n## Problem\n\nFrom the code documentation:\n> \"Customizing the date format causes incompatibility with generated client SDKs\"\n\nThe code include...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7329", "labels": ["type/task", "type/quality", "area/rest"], "created_at": "2026-02-10T09:40:19Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7328, "title": "Evaluate GraphQL artifact type - deprecation candidate", "body": "## Summary\n\nThis issue proposes evaluating the GraphQL artifact type for potential deprecation due to lack of testing and unclear adoption.\n\n## Current State\n\n**Location:** \\`schema-util/graphql/\\`\n\n| Metric | Value |\n|--------|-------|\n| Code Size | 126 lines |\n| Java Files | 3 |\n| Unit Tests | **0** |\n| Integration Tests | **0** |\n| Serdes Support | **None** |\n\n## Problem\n\n1. **Zero test coverage** - Not validated in CI/CD\n2. **No message broker integration** - No serdes for event streaming\n3. **No recent functional changes** - Only version update commits\n4. **Unknown adoption** - No data on...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7328", "labels": ["type/quality", "type/discussion"], "created_at": "2026-02-10T09:40:06Z", "topic": "Graphql / Federation / Xml"}, {"number": 7327, "title": "Deprecate Kafka Connect (KConnect) artifact type", "body": "## Summary\n\nThis issue proposes deprecating the Kafka Connect (KConnect) artifact type due to minimal implementation, lack of testing, and unclear usage.\n\n## Current State\n\n**Location:** \\`schema-util/kconnect/\\`\n\n| Metric | Value |\n|--------|-------|\n| Code Size | **76 lines** (smallest schema module) |\n| Java Files | 2 |\n| Unit Tests | **0** |\n| Integration Tests | **0** |\n| Serdes Support | **None** |\n\n## Problem\n\n1. **Minimal implementation** - Only 76 lines of code, 2 files\n2. **Zero test coverage** - Not validated in CI/CD at all\n3. **No serdes** - Cannot be used with Kafka (ironic for \"...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7327", "labels": ["type/quality", "type/discussion"], "created_at": "2026-02-10T09:38:51Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7326, "title": "Deprecate WSDL artifact type", "body": "## Summary\n\nThis issue proposes deprecating the WSDL (Web Services Description Language) artifact type due to low usage, lack of testing, and declining industry relevance.\n\n## Current State\n\n**Location:** \\`schema-util/wsdl/\\`\n\n| Metric | Value |\n|--------|-------|\n| Code Size | 144 lines |\n| Java Files | 4 |\n| Unit Tests | **0** |\n| Integration Tests | **0** |\n| Serdes Support | **None** |\n\n## Problem\n\n1. **Zero test coverage** - Not validated in CI/CD\n2. **No message broker integration** - No Kafka/Pulsar/NATS serdes\n3. **Legacy technology** - SOAP/WSDL is declining (~10% of new APIs)\n4. **M...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7326", "labels": ["type/quality", "type/discussion"], "created_at": "2026-02-10T09:37:24Z", "topic": "Graphql / Federation / Xml"}, {"number": 7325, "title": "Remove deprecated KafkaSQL SSL configuration properties", "body": "## Summary\n\nFive KafkaSQL SSL configuration properties were deprecated in v3.1.0 with `forRemoval=true` and should be removed.\n\n## Location\n\n`app/src/main/java/io/apicurio/registry/storage/impl/kafkasql/KafkaSqlConfiguration.java`\n\n## Deprecated Properties\n\n| Old Property | New Property | Line |\n|--------------|--------------|------|\n| `apicurio.kafkasql.ssl.truststore.password` | `apicurio.kafkasql.security.ssl.truststore.password` | 306 |\n| `apicurio.kafkasql.ssl.keystore.location` | `apicurio.kafkasql.security.ssl.keystore.location` | 318 |\n| `apicurio.kafkasql.ssl.keystore.type` | `apicuri...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7325", "labels": ["type/task", "type/quality", "area/storage"], "created_at": "2026-02-10T09:36:29Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7321, "title": "Deprecate XSD and XML artifact types", "body": "## Summary\n\nThis issue proposes deprecating the XSD and XML artifact types in Apicurio Registry due to low usage, incomplete feature sets, and misalignment with the project's modern event-driven architecture focus.\n\n## Background\n\nA comprehensive codebase analysis revealed that XSD and XML support:\n- Has **no message broker integration** (no Kafka, Pulsar, or NATS serdes)\n- Has **zero integration tests** (not validated in CI/CD)\n- Is **misaligned with project direction** (event-driven architectures, Agent Registry, MCP)\n- Shows **no demand signals** (no GitHub issues requesting improvements)\n\n...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7321", "labels": ["type/quality", "type/discussion"], "created_at": "2026-02-10T08:59:00Z", "topic": "Graphql / Federation / Xml"}, {"number": 7320, "title": "Consolidate serdes constructor patterns with factory methods", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 4: Long-Term Architecture**\n\n## Problem\n\nEach Kafka serializer/deserializer has 5 identical constructor overloads:\n\n**Affected Files (6 classes × 5 constructors = 30 nearly-identical constructors):**\n- `serdes/kafka/avro-serde/src/main/java/io/apicurio/registry/serde/avro/AvroKafkaSerializer.java`\n- `serdes/kafka/avro-serde/src/main/java/io/apicurio/registry/serde/avro/AvroKafkaDeserializer.java`\n- `serdes/kafka/jsonschema-serde/src/main/java/io/apicurio/registry/serde/jsonschema/JsonSchemaKafkaSerializer.java`\n- `serde...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7320", "labels": ["type/task", "type/quality", "area/serdes"], "created_at": "2026-02-10T08:51:47Z", "topic": "Uncategorized"}, {"number": 7319, "title": "Create platform-agnostic serdes abstraction layer", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 4: Long-Term Architecture**\n\n## Problem\n\nCurrently:\n- Only Avro is implemented for Pulsar and NATS\n- Kafka serializers are tightly coupled to Kafka's Headers API\n- No common abstraction for platform-agnostic serialization\n- Each new platform requires duplicating core serialization logic\n\n**Current Structure:**\n```\nserdes/\n├── kafka/ # Full support: Avro, JSON Schema, Protobuf\n│ ├── avro-serde/\n│ ├── jsonschema-serde/\n│ └── protobuf-serde/\n├── pulsar/ # Only Avro\n│ └── avro-serde/\n└── nats/ # Only Avro\n └── avro-serde/\n`...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7319", "labels": ["type/task", "type/quality", "area/serdes"], "created_at": "2026-02-10T08:51:42Z", "topic": "Avro / Schema / Java"}, {"number": 7318, "title": "Implement configuration-driven ArtifactTypeUtilProviders", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 4: Long-Term Architecture**\n\n## Problem\n\n13+ ArtifactTypeUtilProvider classes each implement 7-8 identical factory methods with only constructors differing. This is the largest source of boilerplate in the codebase.\n\n**Affected Files (in schema-util/util-provider/):**\n- `AvroArtifactTypeUtilProvider.java`\n- `JsonArtifactTypeUtilProvider.java`\n- `ProtobufArtifactTypeUtilProvider.java`\n- `OpenApiArtifactTypeUtilProvider.java`\n- `AsyncApiArtifactTypeUtilProvider.java`\n- `XmlArtifactTypeUtilProvider.java`\n- `XsdArtifactType...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7318", "labels": ["type/task", "type/quality", "priority/high"], "created_at": "2026-02-10T08:51:34Z", "topic": "Graphql / Federation / Xml"}, {"number": 7317, "title": "Remove deprecated operator code from version 3.0.7", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 3: Structural Improvements**\n\n## Problem\n\nSeveral operator classes have been deprecated since version 3.0.7 and should be removed:\n\n**Deprecated Classes:**\n- `operator/model/src/main/java/io/apicurio/registry/operator/api/v1/spec/DeprecatedSqlSpec.java`\n - `@Deprecated(since = \"3.0.7\")` - Entire class\n\n- `operator/model/src/main/java/io/apicurio/registry/operator/api/v1/spec/DeprecatedKafkasqlSpec.java`\n - `@Deprecated(since = \"3.0.7\")` - Entire class\n\n- `operator/model/src/main/java/io/apicurio/registry/operator/api/v1...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7317", "labels": ["type/task", "type/quality"], "created_at": "2026-02-10T08:50:31Z", "topic": "Uncategorized"}, {"number": 7316, "title": "Create content canonicalizer base class with template method", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 3: Structural Improvements**\n\n## Problem\n\nMultiple content canonicalizers repeat the same try-catch-return-original pattern:\n\n**Affected Files:**\n- `schema-util/avro/src/main/java/io/apicurio/registry/avro/content/canon/AvroContentCanonicalizer.java`\n- `schema-util/json/src/main/java/io/apicurio/registry/json/content/canon/JsonContentCanonicalizer.java`\n- `schema-util/openapi/src/main/java/io/apicurio/registry/openapi/content/canon/OpenApiContentCanonicalizer.java`\n- `schema-util/asyncapi/src/main/java/io/apicurio/regis...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7316", "labels": ["type/task", "type/quality"], "created_at": "2026-02-10T08:50:24Z", "topic": "Uncategorized"}, {"number": 7314, "title": "Convert ArtifactType from String constants to Enum", "body": "## Parent Epic\nPart of #7305 - Codebase Refactoring Epic\n\n## Phase\n**Phase 3: Structural Improvements**\n\n## Problem\n\n`ArtifactType` currently uses String constants instead of a proper enum, as noted in the existing TODO comment:\n\n**Location:** `common/src/main/java/io/apicurio/registry/types/ArtifactType.java:9`\n```java\n// TODO: Turn into enum, which can contain both a string value and a numeric identifier.\n```\n\nCurrent implementation lacks type safety and IDE support.\n\n## Proposed Solution\n\nConvert to a proper enum with string and numeric identifiers:\n\n```java\npackage io.apicurio.registry.typ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7314", "labels": ["type/task", "type/quality", "priority/high"], "created_at": "2026-02-10T08:47:35Z", "topic": "Uncategorized"}, {"number": 7305, "title": "[EPIC] Codebase Refactoring: Reduce duplication and improve performance", "body": "## Overview\n\nThis epic tracks a comprehensive refactoring effort to reduce code duplication, improve performance, and enhance maintainability across the Apicurio Registry codebase.\n\n**Analysis Document:** `claudedocs/codebase-analysis-duplicities-inefficiencies.md`\n\n## Summary Metrics\n\n| Metric | Value |\n|--------|-------|\n| **Total duplicated lines identified** | ~1,500-2,000 |\n| **Files requiring cleanup** | 50+ |\n| **TODO comments outstanding** | 70+ |\n| **Performance-impacting patterns** | 3 critical |\n\n---\n\n## Phase 1: High Impact, Low Risk ✅ COMPLETED\n\n- [x] #7306 - Extract `ParameterVal...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7305", "labels": ["type/task", "type/quality"], "created_at": "2026-02-10T08:36:35Z", "topic": "Updates / Operator"}, {"number": 7268, "title": "[Discussion] MCP Server: Separation of registry prompts vs user-registered prompts", "body": "## Summary\n\nThe Apicurio Registry MCP Server currently serves two types of prompts:\n\n1. **Registry-specific prompts** (`MCPPrompts.java`) - e.g., `create_new_artifact_version`\n2. **User-registered prompts** (`PromptTemplateMCPServer.java`) - `PROMPT_TEMPLATE` artifacts with `mcp.enabled=true`\n\nThis raises an architectural question: **Should the Registry MCP Server expose user-registered prompts that are unrelated to registry operations?**\n\n## Current Behavior\n\nWhen an AI agent connects to the Registry MCP Server, it sees:\n- Registry management tools (create artifact, list groups, etc.)\n- Regis...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7268", "labels": ["area/ai-agents"], "created_at": "2026-02-05T11:55:05Z", "topic": "Agent / Mcp / Registry"}, {"number": 7262, "title": "Iceberg REST Catalog: Query engine compatibility testing", "body": "## Parent Epic\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nCreate comprehensive integration tests to verify compatibility with popular query engines that support the Iceberg REST Catalog specification.\n\n## Scope\n\n### Query Engines to Test\n\n#### 1. Apache Spark\n- Spark 3.x with Iceberg connector\n- Test: namespace creation, table CRUD, schema evolution\n- Configuration validation\n\n#### 2. Trino\n- Trino with Iceberg connector\n- Test: catalog registration, SQL operations\n- Performance baseline\n\n#### 3. DuckDB\n- DuckDB with Iceberg extension\n- Test: read operations, metadata que...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7262", "labels": ["type/enhancement"], "created_at": "2026-02-04T07:56:11Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7261, "title": "Iceberg REST Catalog: Advanced features (Phase 4)", "body": "## Parent Epic\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nImplement advanced Iceberg REST Catalog features for production-ready deployments.\n\n## Scope\n\n### 1. Scan Planning Endpoints\nEnable query engines to plan table scans efficiently.\n\n- `POST /v1/{prefix}/namespaces/{namespace}/tables/{table}/scan` - Plan a table scan\n- Returns file manifests and partition information for query optimization\n\n### 2. Credentials Vending\nProvide temporary credentials for accessing data files in object storage.\n\n- `GET /v1/{prefix}/credentials` - Get temporary credentials\n- Support AWS STS...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7261", "labels": ["type/enhancement"], "created_at": "2026-02-04T07:55:47Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7231, "title": "[Docs] AI Agent Registry Documentation and Examples", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Background\nThe AI Agent Registry features (A2A, MCP, Agent Cards) have been implemented but comprehensive documentation and examples are still needed for developer adoption.\n\n## Problem Statement\nCurrent documentation gaps:\n- No dedicated \"Agent Registry\" section in docs\n- Limited examples beyond the a2a-real-world-integration demo\n- No quick-start guide for AI agent developers\n- No architecture documentation explaining the agent ecosystem\n\n## Proposed Solution\n\n### 1. Documentation Structure\n\nAdd new documentation sections:\n\n```\ndocs/\n├── mo...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7231", "labels": ["area/ai-agents"], "created_at": "2026-01-30T15:37:38Z", "topic": "Agent / Mcp / Registry"}, {"number": 7230, "title": "[Feature] Semantic Search for Agent Discovery", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Priority: P3 — Requires Validation\n\n> **Prerequisite:** Before implementing, gather concrete evidence that label-based search is insufficient for real-world agent discovery. Run user research or collect feedback from early adopters. Embedding-based search adds significant infrastructure requirements (vector DB or pgvector, embedding model) that should be justified by demonstrated need.\n>\n> **Recommendation:** Start with Phase 1 (enhanced label search with fuzzy matching) which requires no new infrastructure. Only proceed to Phase 2 (embedding...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7230", "labels": ["priority/normal", "area/ai-agents"], "created_at": "2026-01-30T15:36:47Z", "topic": "Agent / Mcp / Registry"}, {"number": 7229, "title": "[Feature] Agent SDK and CLI Tools", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Background\nThe existing Python and Java SDKs (#6997) provide excellent support for LLM artifact types (prompts, models). However, there's no dedicated SDK or CLI support specifically for agent registration and management workflows.\n\n## Problem Statement\nCurrent developer experience gaps:\n- No dedicated CLI commands for agent operations\n- No SDK helpers for Agent Card creation/validation\n- Manual JSON construction required for Agent Cards\n- No client-side validation before registration\n\n## Proposed Solution\n\n### 1. CLI Commands for Agents\n\nExt...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7229", "labels": ["area/ai-agents"], "created_at": "2026-01-30T15:35:33Z", "topic": "Agent / Mcp / Registry"}, {"number": 7226, "title": "[Feature] Agent Lifecycle Management - Health Monitoring and Status Tracking", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Priority: P3 — Needs Scope Clarification\n\n> **Scope Boundary Warning:** Apicurio Registry is a **metadata store**, not a runtime. This issue risks blurring that boundary. Phase 1 (status field) is appropriate for a registry. Phase 2 (health checking) and Phase 3 (instance tracking) push the registry toward runtime management, which may belong in an orchestrator or service mesh instead.\n>\n> **Recommendation:** Implement Phase 1 only (status metadata + search filtering). Evaluate Phases 2-3 separately — they may be better addressed by external ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7226", "labels": ["priority/normal", "area/ai-agents"], "created_at": "2026-01-30T15:30:50Z", "topic": "Agent / Mcp / Registry"}, {"number": 7210, "title": "Support Apicurio Registry Terraform Provider", "body": "### Feature or Problem Description\n\n- Since the https://github.com/Apicurio/apicurio-registry-content-sync-operator is deprecated, we'd like to manage the schema data using Terraform\n\n### Proposed Solution\n\n- Create a custom provider like the Confluent one https://registry.terraform.io/providers/confluentinc/confluent/latest/docs/resources/confluent_schema\n\n### Additional Context", "url": "https://github.com/Apicurio/apicurio-registry/issues/7210", "labels": ["type/enhancement"], "created_at": "2026-01-28T06:47:20Z", "topic": "Updates / Operator"}, {"number": 7162, "title": "Epic: Apicurio Registry CLI Standard Features", "body": "This epic tracks the development of standard features for the Apicurio Registry CLI.\n\nSee the `cli/README.md` file for build and installation instructions, usage examples, and development guidelines.\n\n## Sub-Issues\n\n### Phase 1 - macOS Support\n- #7163 Add macOS support to Apicurio Registry CLI\n\n### Phase 1.5 - Quarkus Native Build\n- #7618 Quarkus-based CLI with native build\n- #7615 Split SDK HTTP adapters into separate modules for native image compatibility\n- #7640 CLI: Complete CDI conversion (Config singleton, Client static pattern)\n- #7641 CLI: Verbose mode does not affect Quarkus/JBoss log...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7162", "labels": ["priority/normal", "area/CLI"], "created_at": "2026-01-20T12:11:25Z", "topic": "Uncategorized"}, {"number": 7150, "title": "Improvements to OpenTelemetry implementation", "body": "## Summary\n\nFollowing the fix for OTEL build-time vs runtime configuration (#7147), there are several improvements that can be made to the OpenTelemetry implementation to enhance observability and align with best practices.\n\n## Findings\n\n### 🔴 Critical: OTelMetricsProvider is Dead Code\n\n`OTelMetricsProvider` defines 6 custom OTEL metrics but is **never used anywhere** in the codebase:\n\n- `recordArtifactCreated()`\n- `recordArtifactDeleted()`\n- `recordVersionCreated()`\n- `recordSchemaValidation()`\n- `recordRuleEvaluation()`\n- `recordSearchRequest()`\n\n**Recommendation**: Either remove the class i...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7150", "labels": [], "created_at": "2026-01-16T14:44:47Z", "topic": "Uncategorized"}, {"number": 7149, "title": "Update GH actions to send notifications to the other Slack", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/7149", "labels": ["area/CI"], "created_at": "2026-01-16T14:25:40Z", "topic": "Updates / Operator"}, {"number": 7135, "title": "[Feature] Auto-generate Agent Cards from OpenAPI x-agent-* Extensions", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Priority: P2 — Within Phase 2\n\n> **Rationale:** Good UX improvement that reduces adoption friction for existing API users. Quick win if scoped tightly — developers already have OpenAPI specs, so auto-generating Agent Cards from vendor extensions is a natural onramp.\n\n## Background\nAs suggested by @AleStranieri in #6991, many developers already have OpenAPI specifications for their services. Rather than requiring them to manually create separate Agent Card JSON files, we could support OpenAPI vendor extensions that allow Agent Card metadata to...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7135", "labels": ["priority/normal", "area/ai-agents"], "created_at": "2026-01-15T07:00:01Z", "topic": "Agent / Mcp / Registry"}, {"number": 7115, "title": "Upgrade kafka-oauth-client and wiremock versions to fix CVE-2024-57699", "body": "The following CVE was found when scanning 3.1.6:\n\n[CVE-2024-57699](https://www.mend.io/vulnerability-database/CVE-2024-57699)\nnet.minidev.json-smart-2.5.0.jar\n\nIt looks like the fix is available by upgrading to the following versions:\n\nUpgrade kafka-oauth-client to 0.16.2 or the latest 0.17.1 -> gets json-smart 2.5.2 \n\nUpgrade WireMock to 3.13.2 -> gets json-path 2.10.0 -> gets json-smart 2.6.0", "url": "https://github.com/Apicurio/apicurio-registry/issues/7115", "labels": ["type/task", "priority/normal"], "created_at": "2026-01-13T05:15:09Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7013, "title": "[Search Improvements] Phase 4: Performance & Scalability", "body": "## Parent Epic\nPart of #7009 - SQL Search Functionality Improvements\n\n## Overview\n\nImprove search performance and scalability through caching, optimized pagination, and async search capabilities for large datasets.\n\n## Goals\n\n1. **Implement search result caching**\n2. **Add cursor-based pagination** for efficient deep pagination\n3. **Implement async search** for large result sets\n4. **Performance testing and tuning**\n5. **Documentation and monitoring**\n\n## Tasks\n\n### 1. Search Result Caching\n\n- [ ] Add caching infrastructure for search queries:\n ```java\n @ConfigProperty(name = \"apicurio.search....", "url": "https://github.com/Apicurio/apicurio-registry/issues/7013", "labels": ["area/storage"], "created_at": "2025-12-10T19:29:03Z", "topic": "Search / Query / Count"}, {"number": 7012, "title": "[Search Improvements] Phase 3: Advanced Search Features", "body": "## Parent Epic\nPart of #7009 - SQL Search Functionality Improvements\n\n## Overview\n\nAdd advanced search features including new filter types, query expression parser, faceted search, and search suggestions/auto-complete.\n\n## Goals\n\n1. **Add new search filter types** (owner, date ranges, hasLabels, hasReferences)\n2. **Implement query expression parser** for advanced query syntax\n3. **Add faceted search support** for filter refinement\n4. **Implement search suggestions/auto-complete**\n5. **Add result highlighting**\n\n## Tasks\n\n### 1. New Search Filter Types\n\n- [ ] Add new types to `SearchFilterType`...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7012", "labels": ["priority/normal", "area/storage"], "created_at": "2025-12-10T19:27:34Z", "topic": "Search / Query / Count"}, {"number": 7010, "title": "[Search Improvements] Phase 1: Query Optimization", "body": "## Parent Epic\nPart of #7009 - SQL Search Functionality Improvements\n\n## Overview\n\nOptimize existing SQL search queries without breaking changes. This phase focuses on improving performance of current search implementation.\n\n## Goals\n\n1. **Add trigram indexes for PostgreSQL** to optimize substring searches\n2. **Implement unified count with window functions** to reduce query count\n3. **Optimize label search queries** using JOINs instead of correlated subqueries\n4. **Add database-specific query optimizations**\n\n## Tasks\n\n### 1. PostgreSQL Trigram Index Support\n- [x] Add detection for pg_trgm ext...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7010", "labels": ["priority/high", "area/storage"], "created_at": "2025-12-10T19:25:10Z", "topic": "Search / Query / Count"}, {"number": 7009, "title": "[EPIC] SQL Search Functionality Improvements", "body": "## Epic Overview\n\nThis epic tracks the comprehensive improvements to address existing limitations in the search functionality of Apicurio Registry's SQL storage implementation.\n\n## Problem Statement\n\nThe current search implementation uses basic SQL LIKE queries which have significant limitations:\n\n### Performance Limitations\n- **Full table scans**: `LIKE '%term%'` patterns cannot use B-tree indexes\n- **No index optimization**: Current indexes on name/description are B-tree, not optimized for substring search\n- **Correlated subqueries**: Label and content searches use EXISTS with correlated sub...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7009", "labels": ["type/enhancement", "priority/high", "area/storage"], "created_at": "2025-12-10T19:22:42Z", "topic": "Search / Query / Count"}, {"number": 7006, "title": "[Task] Create Iceberg schema import/export utility (Quick Win)", "body": "## Parent Feature\nPart of #7001 - Apache Iceberg Schema Integration\n\n## Description\n\nCreate a utility for converting between Avro/Protobuf schemas and Apache Iceberg schema format. This enables early experimentation with Iceberg integration.\n\n## Scope\n\n### Conversion Utility\n\n1. **Avro to Iceberg**\n - Convert Avro schema JSON to Iceberg schema JSON\n - Handle basic types (string, int, long, float, double, boolean, bytes)\n - Handle logical types (date, timestamp, decimal)\n - Handle nested records and arrays\n\n2. **Iceberg to Avro**\n - Convert Iceberg schema to Avro schema\n - Preserve field IDs in...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7006", "labels": ["type/task", "Beginner Friendly", "priority/normal", "area/lakehouse"], "created_at": "2025-12-10T11:40:57Z", "topic": "Iceberg / Catalog / Table"}, {"number": 6999, "title": "[Feature] GraphQL Federation Schema Registry", "body": "## Parent Epic\nPart of #6992 - Enhanced API Registry\n\n## Description\n\nAdd comprehensive support for GraphQL Federation schemas, enabling Apicurio to serve as a registry for federated GraphQL architectures.\n\n## Background\n\nGraphQL Federation allows organizations to build a unified graph from multiple independent services (subgraphs). Managing these subgraph schemas requires:\n- Version control for each subgraph\n- Composition validation before deployment\n- Entity relationship tracking across subgraphs\n\n## Requirements\n\n### Subgraph Schema Management\n\n1. **Storage & Versioning**\n - Store individua...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6999", "labels": ["type/enhancement", "priority/normal"], "created_at": "2025-12-10T11:34:16Z", "topic": "Graphql / Federation / Xml"}, {"number": 6998, "title": "[Feature] Full AsyncAPI 3.0 Specification Support", "body": "## Parent Epic\nPart of #6992 - Enhanced API Registry\n\n## Description\n\nUpgrade Apicurio Registry's AsyncAPI support to fully comply with the AsyncAPI 3.0 specification, including new features and breaking changes from 2.x.\n\n## Background\n\nAsyncAPI 3.0 was released with significant improvements:\n- Decoupling of channels and operations\n- Improved reusability\n- Better support for request-reply patterns\n- Enhanced server bindings\n\n## Requirements\n\n### Core AsyncAPI 3.0 Support\n\n1. **Parser Upgrade**\n - Update to AsyncAPI 3.0 parser library\n - Handle both 2.x and 3.0 specifications\n - Migration path...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6998", "labels": ["type/enhancement", "priority/normal", "area/rules"], "created_at": "2025-12-10T11:33:54Z", "topic": "Uncategorized"}, {"number": 6994, "title": "[EPIC] Enterprise Governance & Analytics", "body": "## Overview\n\nThis epic tracks enterprise governance features including analytics, lineage visualization, compliance reporting, and multi-tenancy capabilities.\n\n## Strategic Value\n\n- **Enterprise adoption**: Large organizations require governance visibility and compliance\n- **Data mesh**: Support for distributed data ownership models\n- **Observability**: Understanding schema usage patterns and impact of changes\n\n## Scope\n\n### Data Governance Dashboard\n- Schema usage analytics and metrics\n- Cross-system lineage visualization\n- Compliance and audit reporting\n- Breaking change impact analysis befo...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6994", "labels": ["priority/normal", "area/ui", "type/epic"], "created_at": "2025-12-10T11:27:25Z", "topic": "Agent / Mcp / Registry"}, {"number": 6993, "title": "[EPIC] Data Platform Integration: Apache Iceberg & Flink", "body": "## Overview\n\nThis epic tracks integration between Apicurio Registry and modern data platform technologies, bridging the gap between streaming schemas and lakehouse table formats.\n\n## Strategic Value\n\n- **Streaming-to-Lakehouse**: Kafka-to-Iceberg pipelines are becoming standard architecture\n- **Schema consistency**: Ensure schema compatibility across streaming and analytical workloads\n- **Flink integration**: Apache Flink is the de facto standard for stream processing\n- **Data lineage**: Track schema evolution from streaming sources to lakehouse destinations\n\n## Scope\n\n### Apache Iceberg Schem...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6993", "labels": ["priority/normal", "type/epic", "area/lakehouse"], "created_at": "2025-12-10T11:26:54Z", "topic": "Iceberg / Catalog / Table"}, {"number": 6992, "title": "[EPIC] Enhanced API Registry: AsyncAPI 3.0, GraphQL Federation & API Lifecycle", "body": "## Overview\n\nThis epic tracks enhancements to Apicurio's API registry capabilities, strengthening its position as a **multi-format API and schema registry** beyond just Kafka schemas.\n\n## Strategic Value\n\n- **Multi-format leadership**: Apicurio uniquely supports OpenAPI, AsyncAPI, GraphQL, WSDL, XML alongside Avro/Protobuf/JSON Schema\n- **Event-driven architecture**: AsyncAPI is now the industry standard for documenting event-driven APIs\n- **GraphQL ecosystem**: Federation is becoming standard for distributed GraphQL architectures\n- **Full lifecycle**: Move beyond schema storage to API lifecyc...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6992", "labels": ["priority/high", "type/epic"], "created_at": "2025-12-10T11:26:33Z", "topic": "Graphql / Federation / Xml"}, {"number": 6991, "title": "[EPIC] AI Agent Registry (MCP & A2A Support)", "body": "## Overview\n\nThis epic tracks the implementation of AI Agent ecosystem support in Apicurio Registry, enabling it to serve as a registry for agentic AI applications. The roadmap was revised in April 2026 after reviewing the [A2A community Agent Registry proposal](https://github.com/a2aproject/A2A/discussions/741) to focus on what aligns with Apicurio's identity as a **metadata store and governance tool**.\n\n## Strategic Value\n\n- **First-mover advantage**: No established, open, \"Agent Registry\" exists in the market yet\n- **Unique differentiation**: Positions Apicurio beyond traditional schema reg...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6991", "labels": ["priority/high", "area/auth", "area/operator", "type/epic", "area/AI", "area/converter", "area/ai-agents"], "created_at": "2025-12-10T11:26:03Z", "topic": "Agent / Mcp / Registry"}, {"number": 6948, "title": "Improved support for artifact references", "body": "Executive Summary\n\n The artifact references feature in Apicurio Registry provides essential support for schemas that reference other schemas. This analysis evaluates the current implementation, identifies gaps, and proposes a roadmap for\n improvements.\n\n ---\n 1. Current Architecture\n\n 1.1 Core Components\n\n | Layer | Component | Purpose |\n |--------------|-------------------------------|---------------------------------|\n | API | REST v3 endpoints | CRUD operations for references |\n | Storage | RegistryStorage interface | Reference persistence |\n | Schema Utils | ReferenceFinder | Extract refer...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6948", "labels": ["type/epic"], "created_at": "2025-12-02T11:47:34Z", "topic": "Git / Registry / Reference"}, {"number": 6809, "title": "Proof of Concept: Replace wire-schema library with grpc-zero", "body": "## Background\n\nApicurio Registry currently uses the `com.squareup.wire:wire-schema` library (version 5.3.3) for Protocol Buffers schema parsing and manipulation. This library is primarily used in:\n\n- `utils/protobuf-schema-utilities` module\n- `schema-util/protobuf` module \n- `serdes/generic/serde-common-protobuf` module\n- Various protobuf-related components for validation, canonicalization, compatibility checking, and reference handling\n\n## Proposal\n\nInvestigate replacing the wire-schema library with Quarkus gRPC Zero, a new experimental feature that provides a pure JVM-based approach to Proto...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6809", "labels": ["type/enhancement", "priority/low", "area/protobuf"], "created_at": "2025-10-31T10:30:10Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 6755, "title": "Implement OLM upgrade tests", "body": "Currently, we have to test that upgrade works manually. We need to automate this.", "url": "https://github.com/Apicurio/apicurio-registry/issues/6755", "labels": ["priority/high", "version/3.x", "area/QE", "area/operator"], "created_at": "2025-10-21T09:23:44Z", "topic": "Updates / Operator"}, {"number": 6712, "title": "Support for a cannonical URL that resolves relative $refs between artifacts", "body": "### Feature or Problem Description\n\nThe goal of this Feature Request is being able to use Apicurio registry as the cannonical source for API definitions, for tooling and referencing between APIs.\n\nThe goal is to provide a URL that serves **valid** API definitions, resolving relative `$ref` references within the same `groupId`\n\nFor example, consider this schemas: https://github.com/ivangsa/apicurio-registry-fork/tree/main/examples/asyncapi-avro-maven-with-references-auto\n\nThe structure is:\n\n```\nschemas/\n├── asyncapi-avro-refs.yml\n└── avro/\n ├── Address.avsc\n ├── CustomerDeletedEvent.avsc\n ├── C...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6712", "labels": [], "created_at": "2025-10-13T12:49:06Z", "topic": "Uncategorized"}, {"number": 6635, "title": "Validation Endpoint to Specify Target Schema for Validation", "body": "### Feature or Problem Description\nWhen multiple engineers make changes to the same schema (e.g., in feature branches) and test them with client applications, Apicurio validates these schemas against each other. However, the expected behavior is to validate each change only against a specific production version of the schema.\n\n### Proposed Solution\nIntroduce a new API endpoint that allows custom schema validation against any chosen version within the registry. For example:\n```https://apicurio.registry/apis/registry/v3/groups/{group_id}/artifacts/{artifact_id}/versions/{version}/test/{baseline_...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6635", "labels": ["type/enhancement", "priority/normal", "area/rest", "version/3.x", "area/sdk"], "created_at": "2025-09-25T04:40:51Z", "topic": "Uncategorized"}, {"number": 6634, "title": "Support git-cetric schema management", "body": "### Feature or Problem Description\n\nApicurio’s recommended deployment model of one instance per environment is challenging for large organizations with multiple teams, and multiple dev, ephemeral, RC, canary, and production environments. Having an Apicurio per env increases the risk of schema versions going out of sync.\nDoing a single-instance approach also has limitations:\n- In-development schemas cannot be locked, risking accidental use in production.\n- Concurrent changes in feature branches lack control, as validation cannot focus solely on production schemas.\nAlthough Apicurio supports bra...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6634", "labels": ["type/enhancement", "priority/normal"], "created_at": "2025-09-25T04:29:45Z", "topic": "Git / Registry / Reference"}, {"number": 6619, "title": "Support customization of operator-managed Service", "body": "Provide some way of adding annotations to the Service, e.g. by adding the annotations field to the CRD, and support disabling the managed service completely as a worst-case workaround.", "url": "https://github.com/Apicurio/apicurio-registry/issues/6619", "labels": ["priority/normal", "version/3.x", "area/operator"], "created_at": "2025-09-24T12:16:52Z", "topic": "Uncategorized"}, {"number": 6485, "title": "Support for Multiple Keycloak Realms", "body": "I’m setting up Apicurio Schema Registry in our environment with Keycloak-based authentication.\n\nWe have two types of clients for the registry:\n\n- Developers – use the Schema Registry UI to manage schemas.\n- Producer and Consumer services – fetch schemas for message serialization and deserialization.\n\nOur Keycloak setup has two realms:\n\n- `Employees` → for user authentication.\n- `Platform` → for service authentication.\n\nWhile reviewing the documentation, I couldn’t find any information on whether Apicurio supports authentication with multiple Keycloak realms.\n\nI’m considering the following opti...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6485", "labels": ["type/enhancement", "priority/normal", "area/auth", "version/3.x"], "created_at": "2025-08-12T13:33:53Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 6482, "title": "Feature Request:  Apicurio Registry as an Iceberg catalog service?", "body": "### Feature or Problem Description\n\nOverview[🔗](https://iceberg.apache.org/terms/#overview)\n\nYou may think of Iceberg as a format for managing data in a single table, but the Iceberg library needs a way to keep track of those tables by name. Tasks like creating, dropping, and renaming tables are the responsibility of a catalog. Catalogs manage a collection of tables that are usually grouped into namespaces. The most important responsibility of a catalog is tracking a table's current metadata, which is provided by the catalog when you load a table.\n\nThe first step when using an Iceberg client i...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6482", "labels": ["type/enhancement", "priority/normal", "area/rest", "version/3.x", "resolution/fixed"], "created_at": "2025-08-08T18:54:01Z", "topic": "Iceberg / Catalog / Table"}, {"number": 6419, "title": "Add multi-namespace operator test(s)", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/6419", "labels": ["priority/normal", "version/3.x", "area/operator"], "created_at": "2025-07-21T14:10:30Z", "topic": "Updates / Operator"}, {"number": 6366, "title": "Apicurio-operator: continuously patching deployment object (app)", "body": "## Description\n\nInstalled the latest k8s operator for apicurio-registry following [install/apicurio-registry-operator-3.0.9.yaml](https://github.com/Apicurio/apicurio-registry/blob/main/operator/install/apicurio-registry-operator-3.0.9.yaml).\n\n ApicurioRegistry3 CRO YAML\n\n```yaml\napiVersion: registry.apicur.io/v1\nkind: ApicurioRegistry3\nmetadata:\n name: apicurio-registry\n namespace: default\n labels:\n helm.sh/chart: apicurio-registry-0.1.1\n app.kubernetes.io/name: apicurio-registry\n app.kubernetes.io/instance: release-name\n app.kubernetes.io/version: \"3.0.9\"\n app.kubernetes.io/managed-by: Helm\n...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6366", "labels": ["type/bug", "priority/normal", "version/3.x", "area/operator"], "created_at": "2025-06-25T17:51:26Z", "topic": "Updates / Operator"}, {"number": 6300, "title": "QA improvements", "body": "Current tests need improvements:\n\n- [ ] Execute the operator testsuite concurrently. Takes too much time (~ 1h) at the moment.\n- [ ] Integration tests should run against a Kubernetes cluster, while ensuring good local testing experience (e.g. running from an IDE). We should stop using plain docker.\n- [ ] Move downstream testsuite into upstream.", "url": "https://github.com/Apicurio/apicurio-registry/issues/6300", "labels": ["priority/normal", "version/3.x", "area/QE"], "created_at": "2025-06-06T16:53:40Z", "topic": "Updates / Operator"}, {"number": 6192, "title": "Data contracts", "body": "### Overview\n\nApicurio Registry's Data Contracts framework provides comprehensive contract management using the **Open Data Contract Standard (ODCS v3.1)** as the native contract format. ODCS is the Linux Foundation standard for data contracts — adopting it natively positions Apicurio as the only schema registry that speaks the industry-standard contract format.\n\n**Key design decision:** ODCS contracts are the developer-facing input format. When submitted, their contents are **projected onto the referenced schema artifacts** — quality rules become CEL rules on the artifact, ownership becomes `...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6192", "labels": ["area/rules", "area/references", "area/converter", "area/rules/validity"], "created_at": "2025-05-05T08:39:36Z", "topic": "Uncategorized"}, {"number": 6142, "title": "Search for versions by content doesn't work for schema with references", "body": "I am using the Rest API to search a schema version by content. If I search for a schema that doesn't have any references, the API returns results. But If I search for a schema where the original schema references another schema, in that case the schema registry doesn't return any results. Can you please help me with this. Is this something which is not supported with protobuf schema or am I doing something wrong?\n\n### Scenario 1 (Successfull):\n\nExample schema without references:\n\n```// Proto schema formatted by Wire, do not edit.\n// Source: \n\nsyntax = \"proto3\";\npackage schema;\n\noption java_mul...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6142", "labels": ["type/bug", "priority/normal", "area/references"], "created_at": "2025-04-17T10:30:06Z", "topic": "Uncategorized"}, {"number": 6046, "title": "Error during dereference : StreamConstraintsException: Document nesting depth (1001) exceeds the maximum allowed (1000)", "body": "## Description\n\n**Registry\nVersion**:3.0.6\n**Persistence type**:in-memory\n\n \n### Environment\n\ndocker-compose.yml\n```yml\nversion: \"3.8\"\n\nservices:\n apicurio-registry:\n image: apicurio/apicurio-registry:3.0.6\n ports:\n - \"8080:8080\"\n restart: unless-stopped\n\n apicurio-registry-ui:\n image: apicurio/apicurio-registry-ui:3.0.6\n ports:\n - \"8888:8080\"\n restart: unless-stopped\n depends_on:\n - apicurio-registry\n```\n\n### Steps to Reproduce\nUpload below schema as an artifact\n\n```json\n{\n \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n \"$id\": \"TargetNodeSpec.schema.json\",\n \"title\": \"TargetNodeSp...", "url": "https://github.com/Apicurio/apicurio-registry/issues/6046", "labels": ["area/references", "version/3.x"], "created_at": "2025-03-18T07:16:11Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 6038, "title": "Check if \"Exceptions in KafkaSqlStore do not trigger liveness checking\" affects 3.x", "body": "[Exceptions in KafkaSqlStore do not trigger liveness checking #6021](https://github.com/Apicurio/apicurio-registry/issues/6021)", "url": "https://github.com/Apicurio/apicurio-registry/issues/6038", "labels": ["priority/normal", "version/3.x", "port/2.x-to-3.x", "area/storage/kafkasql"], "created_at": "2025-03-12T12:53:05Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 6033, "title": "Add UI support for creating references", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/6033", "labels": ["type/enhancement", "priority/normal", "area/ui", "version/3.x"], "created_at": "2025-03-10T11:47:05Z", "topic": "Git / Registry / Reference"}, {"number": 6021, "title": "Exceptions in KafkaSqlStore do not trigger liveness checking", "body": "Also check 3.x", "url": "https://github.com/Apicurio/apicurio-registry/issues/6021", "labels": ["version/2.6.x"], "created_at": "2025-03-06T14:03:42Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 5947, "title": "Dependency Dashboard", "body": "This issue lists Renovate updates and detected dependencies. Read the [Dependency Dashboard](https://docs.renovatebot.com/key-concepts/dashboard/) docs to learn more.[View this repository on the Mend.io Web Portal](https://developer.mend.io/github/Apicurio/apicurio-registry).\n\n## Config Migration Needed\n\n - [ ] Select this checkbox to let Renovate create an automated Config Migration PR.\n\n## Repository Problems\n\nThese problems occurred while renovating this repository. [View logs](https://developer.mend.io//github/Apicurio/apicurio-registry).\n\n - ⚠️ WARN: Found renovate config warnings\n\n## Dep...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5947", "labels": ["area/storage", "area/documentation", "area/sdk", "area/observability", "area/maven-plugin", "area/converter"], "created_at": "2025-01-30T16:35:25Z", "topic": "Updates / Operator"}, {"number": 5936, "title": "Operator should support Istio sidecars", "body": "Analyze whether the support for Istio sidecars requires any changes to the operator, and in either case document steps to set it up.\n\nSee\n- https://istio.io/latest/docs/setup/additional-setup/sidecar-injection\n- https://github.com/Apicurio/apicurio-registry-operator/issues/259\n\nCC @L040639", "url": "https://github.com/Apicurio/apicurio-registry/issues/5936", "labels": ["type/enhancement", "priority/normal", "version/3.x", "area/operator"], "created_at": "2025-01-29T12:13:41Z", "topic": "Updates / Operator"}, {"number": 5574, "title": "New example proposals", "body": "This issue tracks proposals for creating new examples. It would be nice if the examples were created by outside contributors with a fresh perspective, but not necessarily. Some of these issues might even be beginner friendly. Please turn the proposal into an issue when you start working on it.\r\n\r\nProposals:\r\n\r\n- [ ] Create an example of creating artifacts by fetching from an external URL. This might include setting up a server that will serve the artifact content (simple nginx?), and explore some edge cases, such as custom HTTPS certificates being used.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5574", "labels": ["type/quality", "Beginner Friendly", "priority/normal", "type/epic"], "created_at": "2024-11-22T08:16:59Z", "topic": "Git / Registry / Reference"}, {"number": 5573, "title": "How to push avro schemas/protocols such that it registry uses references and doesn't embed everything into definition", "body": "I want to build a custom registry image based on apicurio, this image would preload all my schemas enforcing them (since i will disable pushing artifacts by services). There is one big problem though.\r\n\r\nIf i simply loop over all my AVSC files (that i generate from AVDL) and upload them one by one then registry does no processing on top of them and does not recognise when 2 messages were imported reused, because the content of AVSC is literally inlined to be self contained.\r\n\r\nI started looking for api that would allow me to upload protocol files AVDL or AVPR, but i found no such thing.\r\n\r\nWhe...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5573", "labels": ["type/question", "type/discussion", "priority/normal", "area/rest", "area/storage", "area/references"], "created_at": "2024-11-22T03:02:08Z", "topic": "Avro / Schema / Java"}, {"number": 5523, "title": "Enable compression in the REST API", "body": "### Feature or Problem Description\r\nThe registry REST API does not currently support compression of the request/response payloads.\r\n\r\n### Proposed Solution\r\nEnable the Quarkus feature for http compression:\r\n\r\n* https://quarkus.io/guides/http-reference#http-compression\r\n\r\nNote that the typescript REST client could then also have compression enabled. See:\r\n\r\n* https://github.com/Apicurio/apicurio-registry/pull/5498", "url": "https://github.com/Apicurio/apicurio-registry/issues/5523", "labels": ["type/enhancement", "Beginner Friendly", "priority/normal", "area/rest"], "created_at": "2024-11-13T17:17:45Z", "topic": "Updates / Operator"}, {"number": 5459, "title": "make ArtifactReferenceResolverStrategy configurable", "body": "### Feature or Problem Description\r\n\r\nfor governance reasons, we need to access a remote API to determine if a given kafka topic has been associated with the intended schema artifact before allowing the producer to send messages.\r\n\r\nThe only place where we can access the kafka topic name to do this check is in the ArtifactResolverStrategy - but this doesn't read the configuration like the serdes and SchemaResolver do, and we need the configuration to pass the url of the remote API.\r\n\r\nit should be a simple matter of adding the configure() call to the ArtifactReferenceResolverStrategy with a de...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5459", "labels": ["type/enhancement", "priority/normal", "area/serdes", "version/3.x"], "created_at": "2024-11-01T18:02:30Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 5442, "title": "Unify configuration of KafkaSQL storage to a single approach", "body": "There are two ways to configure Kafka security properties. We have some explicit configuration options here:\n\nhttps://github.com/Apicurio/apicurio-registry/blob/main/app/src/main/java/io/apicurio/registry/storage/impl/kafkasql/KafkaSqlFactory.java#L101 \n\n...and there is a general way to configure producers/consumers here:\n\nhttps://github.com/Apicurio/apicurio-registry/blob/main/app/src/main/java/io/apicurio/registry/storage/impl/kafkasql/KafkaSqlFactory.java#L83\n\nThe old operator has been using the second approach, and I think we should remove the specific configuration and instead document ho...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5442", "labels": ["type/enhancement", "priority/high", "area/storage"], "created_at": "2024-10-30T15:00:05Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 5422, "title": "Allow same URL to be usable for both machines-to-machine and users", "body": "### Feature or Problem Description\r\n\r\nThe current UX is that the URL that is used to retrieve an artifact content in an application or CLI (API) is different from the one that is used by a human/user to visit / discover the schema (UI / studio).\r\n\r\nI believe the UX would be better (and enable interesting schema discovery integrations) when the system automatically resolves a user / browser request and redirects the user to the UI / studio while the same URL can be used in applications or CLIs to retrieve the artifact content.\r\n\r\nAn example implementation that has this nice UX is GitHub contain...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5422", "labels": ["type/enhancement", "priority/low"], "created_at": "2024-10-29T12:14:06Z", "topic": "Git / Registry / Reference"}, {"number": 5355, "title": "Cannot add additional properties to schema", "body": "Old:\r\n```\r\n{\r\n \"$id\": \"https://schemas.x.com/x.json\",\r\n \"$schema\": \"http://json-schema.org/draft-07/schema\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"id\": {\r\n \"type\": \"integer\"\r\n }\r\n },\r\n \"required\": [\r\n \"id\"\r\n ]\r\n}\r\n```\r\n\r\nNew:\r\n```\r\n{\r\n \"$id\": \"https://schemas.x.com/x.json\",\r\n \"$schema\": \"http://json-schema.org/draft-07/schema\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"id\": {\r\n \"type\": \"integer\"\r\n },\r\n \"new_prop\": {\r\n \"type\": \"integer\"\r\n }\r\n },\r\n \"required\": [\r\n \"id\"\r\n ]\r\n}\r\n```\r\n\r\nI have Global Rules set as following:\r\n\r\n\r\n\r\nBoth old and new schemas should allow this input (as `new_prop` is...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5355", "labels": ["type/bug", "priority/normal", "area/rules/compatibility", "area/rules"], "created_at": "2024-10-16T16:00:56Z", "topic": "Schema / Type / Compatibility"}, {"number": 5322, "title": "Improve docs to support browser based integrations and overcoming CORS issues", "body": "### Feature or Problem Description\n\nFollowing discussion at: https://gist.github.com/EricWittmann/d0ad855c9f280c2a913c12d83d22baf0\n\n### Proposed Solution\n\n* A blog post outlining a specific use case, eg one in slack discussion\n* A discussion about support level required for this scenario\n* Possible docs updates\n\n### Additional Context\nBlog posts are contributed via a PR to the following repository: https://github.com/Apicurio/apicurio.github.io/", "url": "https://github.com/Apicurio/apicurio-registry/issues/5322", "labels": ["type/task", "priority/normal", "area/documentation"], "created_at": "2024-10-08T17:37:48Z", "topic": "Updates / Operator"}, {"number": 5298, "title": "Improve UI setup and instructions", "body": "Re-building the UI after some time not doing it has shown a few minor dev shortcomings:\r\n\r\n- we don't have a note on having to build typescript-sdk before the UI\r\n- the generation of the local config file always takes a little (to remember/find out)\r\n- the CORS configuration of the Registry server has issues with almost any slightly different setup than localhost:8888 we probably should better document how to fix it\r\n- maybe we should do `npm run lint` as a pre-req for `npm run build`?", "url": "https://github.com/Apicurio/apicurio-registry/issues/5298", "labels": ["type/task", "priority/low", "area/ui"], "created_at": "2024-10-02T17:29:29Z", "topic": "Updates / Operator"}, {"number": 5297, "title": "Branch Transitive Compatibility", "body": "### Feature or Problem Description\r\n\r\nRight now for each compatibility mode you can choose whether it tests only against the immediately prior version of an artifact, or to all prior versions using the *_TRANSITIVE compatibility modes.\r\n\r\nWith the version branches feature now included, would it be possible to have a third type of compatibility that tests against all of the prior version in a given branch? And/or a mode that tests against the latest version of the schema in a given branch / all branches. \n\r\nThis would give us the ability to emulate a mutable registry while retaining immutabilit...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5297", "labels": ["type/enhancement", "priority/normal", "area/rules/compatibility", "area/rules"], "created_at": "2024-10-02T16:23:47Z", "topic": "Schema / Type / Compatibility"}, {"number": 5295, "title": "Kafka storage health check not failing after runtime exception", "body": "## Description\r\n\r\n**Registry\r\nVersion**: 2.5.8.FInal, 2.6.3.Final\r\n**Persistence type**: kafkasql\r\n\r\n### Environment\r\n\r\n- Running in kubernetes, using `apicurio-registry-kafkasql` docker image\r\n- Kafka 3.5.0\r\n- Keycloak 25.0.0\r\n\r\n### Steps to Reproduce\r\nYou need somehow disconnect apicurio from kafka in runtime\r\nAnd i found this in `KafkaSqlRegistryStorage`:\r\n\r\n\r\n#### Disable client authentication in keycloak\r\n1. Set up access token lifespan for client about 1 minute\r\n2. Start apicruio and check that kafka consumer is connected and status is stable\r\n3. Disable client authentication in keycloak...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5295", "labels": ["type/bug", "priority/high", "area/storage", "version/2.6.x", "area/operator"], "created_at": "2024-10-02T12:11:43Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 5236, "title": "Expose or log error response from Registry in serdes", "body": "Since the serdes communicates with Registry via cache, when Registry returns an error response, it is shadowed by an unhelpful cache error, e.g.:\r\n\r\n```\r\nFailed to update cache value for key: {\"type\":\"record\",\"name\":\"Key\",\"namespace\":\"inventory_connector_postgresql1727173403473.inventory.customers\",\"fields\":[{\"name\":\"id\",\"type\":{\"type\":\"int\",\"connect.default\":0},\"default\":0}],\"connect.name\":\"inventory_connector_postgresql1727173403473.inventory.customers.Key\"} [io.apicurio.registry.resolver.ERCache]\r\nio.apicurio.registry.rest.client.exception.RestClientException\r\n\tat io.apicurio.registry.rest....", "url": "https://github.com/Apicurio/apicurio-registry/issues/5236", "labels": ["type/bug", "priority/high", "area/storage", "area/serdes"], "created_at": "2024-09-24T10:40:29Z", "topic": "Uncategorized"}, {"number": 5232, "title": "Support Bulk artifact registration in single transaction, reference deduction", "body": "### Feature or Problem Description\r\n\r\nThis may be an unfeasible idea.\r\n\r\nOur intended typical workflow for using schema registry will involve users uploading their schema documents to an internal github repository, and then through a UI they select which schemas they want to register / update. From their point of view, this is a bulk operation with a single manager's approval. This UI utilizes the `dryRun` version of the register / update commands to provide diagnostic messages prior to them submitting for manager approval. Right now this involves many REST api requests to apicurio.\r\n\r\nWould i...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5232", "labels": ["Beginner Friendly", "priority/normal", "area/rest", "version/3.x"], "created_at": "2024-09-23T14:01:54Z", "topic": "Git / Registry / Reference"}, {"number": 5224, "title": "References missing in REST response", "body": "### Discussed in https://github.com/Apicurio/apicurio-registry/discussions/4876\r\n\r\n\r\n\r\nOriginally posted by **eskhisov** July 10, 2024\r\nI have the following piece of code to add references to the existing AVRO schema:\r\n```\r\nList references = this.client.getArtifactReferencesByGlobalId(globalId);\r\nreferences.add(new ArtifactReference(referenceGroupId, referenceArtifactId, referenceVersion,\r\n this.getArtifactName(referenceArtifactId)));\r\nthis.client.updateArtifact(this.getGroupIdById(artifactId), artifactId,\r\n newVersion, artifact.getName(),\r\n artifact.getDescription(), this.client.getLatestArti...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5224", "labels": ["type/bug", "priority/high", "area/rest", "version/3.x"], "created_at": "2024-09-23T07:38:04Z", "topic": "Uncategorized"}, {"number": 5221, "title": "[UI] Remember user's preferred state of Explore list view:  Groups vs.  Artifacts", "body": "The Explore view always defaults to showing a list of Artifacts. It would be nice if we remembered the user's preferred setting. Or perhaps the **last** setting.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5221", "labels": ["type/enhancement", "priority/normal", "area/ui"], "created_at": "2024-09-20T14:02:50Z", "topic": "Uncategorized"}, {"number": 5175, "title": "Apicurio ui - use without authorization & authentication", "body": "### Feature or Problem Description\r\n\r\ncannot run ui without keycloak\r\n\r\n### Proposed Solution\r\n\r\ndisable authorization", "url": "https://github.com/Apicurio/apicurio-registry/issues/5175", "labels": ["type/discussion", "priority/normal", "area/ui", "area/auth", "version/3.x"], "created_at": "2024-09-16T07:54:21Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 5145, "title": "Add support for API consumer information as artifact metadata", "body": "### Feature Description\r\n\r\nIn my work environments I often face the problem of not knowing which service depends on which API. This then leads to making rounds with development teams or scrolling through outdated confluence documentation. It would be nice to have one central place where I can look up dependencies between the services, so I can know how big of an impact breaking changes would have.\r\n\r\n### Proposed Solution\r\n\r\nAdd a list of consumers as a field on the metadata of an artifact. APIs and dependencies can then be managed in a central place. \n\r\n### Additional Context\r\n\r\nThis could al...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5145", "labels": ["type/enhancement", "priority/normal", "area/references", "version/3.x"], "created_at": "2024-09-10T13:53:14Z", "topic": "Git / Registry / Reference"}, {"number": 5137, "title": "Make sure we support JSON Schema FC with pattern properties", "body": "See the paragraphs related to pattern properties at the end of this blog post https://yokota.blog/2021/03/29/understanding-json-schema-compatibility/ . Make sure we support that use-case for full compatibility checking, and add them as test cases to the testsuite.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5137", "labels": ["type/enhancement", "priority/normal", "area/rules/compatibility"], "created_at": "2024-09-09T09:07:09Z", "topic": "Schema / Type / Compatibility"}, {"number": 5125, "title": "Need authorization without authentication", "body": "### Feature or Problem Description\r\n\r\nIn my enterprise environment, we have Apicurio running behind an API GW. The gateway takes care of authenticating the user in a standardized way (we can choose between different methods and decided for OIDC client credentials) and forwards the authenticated identity (JWT token in http header) to Apicurio.\r\nWhat I want: Apicurio should take that authenticated identity and make authorization decisions based on it, without trying to perform its own authentication.\r\n\r\n### Proposed Solution\r\n\r\nReading the Apicurio docs, it seems like authentication and authoriz...", "url": "https://github.com/Apicurio/apicurio-registry/issues/5125", "labels": ["type/enhancement", "priority/normal", "area/auth"], "created_at": "2024-09-05T07:55:51Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 5088, "title": "Consume dereference blog post to update references documentation", "body": "https://www.apicur.io/blog/2024/05/14/registry-dereference", "url": "https://github.com/Apicurio/apicurio-registry/issues/5088", "labels": ["type/task", "priority/normal", "area/documentation"], "created_at": "2024-08-28T12:52:35Z", "topic": "Updates / Operator"}, {"number": 5075, "title": "Inconsistent source/target Java version with changelog (bug in automatic release notes tooling)", "body": "## Description\r\n\r\n**Registry\r\nVersion**: 2.6.2.Final\r\n\r\nReading from [2.4.3.Final changelog](https://github.com/Apicurio/apicurio-registry/releases/tag/2.4.3.Final), Java target release was supposed to be switched to Java 17.\r\nHowever [its `pom.xml` configuration](https://github.com/Apicurio/apicurio-registry/blob/2.4.3.Final/pom.xml#L145-L146) still shows Java 11.\r\nMoreover, even the latest `2.*`, [`2.6.2.Final`](https://github.com/Apicurio/apicurio-registry/blob/2.6.2.Final/pom.xml#L145-L146) is afflicted by the same problem.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5075", "labels": ["type/bug", "priority/high", "version/2.6.x", "area/documentation"], "created_at": "2024-08-26T12:13:54Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 5066, "title": "Improve error messages for compatibility checking", "body": "### Feature or Problem Description\r\n\r\nCurrently, the error messages are pretty cryptic:\r\n\r\n\r\n\r\nAnd it may be hard to understand why the schemas are not compatible.\r\n\r\n### Proposed Solution\r\n\r\nProvide a better explanation (maybe with an example from the tests) why the specific compatibility rule exists and when it's broken. Also, which direction the issue is (backward, forward, or both).", "url": "https://github.com/Apicurio/apicurio-registry/issues/5066", "labels": ["type/enhancement", "priority/normal", "area/rules/compatibility"], "created_at": "2024-08-22T13:09:27Z", "topic": "Schema / Type / Compatibility"}, {"number": 5035, "title": "Artifact content not shown because Monaco Editor fails to load from CDN on isolated network", "body": "The `@monaco-editor/react` or underlying depends on https://cdn.jsdelivr.net/npm/monaco-editor@0.43.0/min/vs/loader.js \nIf Apicurio Registry is deployed on an isolated network without Internet access, Apicurio Registry only shows \"Loading...\" when navigating to the content of an artifact.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5035", "labels": ["type/bug", "priority/normal", "area/ui", "version/3.x"], "created_at": "2024-08-15T11:39:41Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 5029, "title": "Add workflow to build SerDes classes to native (Quarkus downstream requirement)", "body": "Quarkus uses Apicurio Registry serdes classes in their build. They build everything to native obviously, so we need to make sure that we can build our serdes classes to native successfully. Recently a third party library upgrade broke the Quarkus downstream native build. If we have a CI workflow that tests this we can avoid it in the future.", "url": "https://github.com/Apicurio/apicurio-registry/issues/5029", "labels": ["type/task", "priority/normal", "area/serdes", "version/3.x"], "created_at": "2024-08-14T13:03:56Z", "topic": "Graphql / Federation / Xml"}, {"number": 4981, "title": "[Import] Put registry into read only mode during import/export", "body": "Whenever we import or export, let's put the registry into Read Only mode until the operation is complete.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4981", "labels": ["type/enhancement", "priority/normal", "area/storage"], "created_at": "2024-08-05T14:29:03Z", "topic": "Uncategorized"}, {"number": 4956, "title": "Doc/Blog - Features differences compared to Confluent client libs", "body": "### Feature or Problem Description\r\n\r\nApicurio Registry, when used in Kafka projects, can be accessed with Confluent libraries or with Apicurio's own libraries.\r\nUsing Apicurio's own libraries enables additional features like caching.\r\n\r\n\r\n\r\n### Proposed Solution\r\n\r\nWe should:\r\n- document this\r\n- add it to the FAQs\r\n- consider a dedicated blog post about it", "url": "https://github.com/Apicurio/apicurio-registry/issues/4956", "labels": ["type/enhancement", "type/task", "priority/normal", "area/documentation"], "created_at": "2024-07-31T11:52:10Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4951, "title": "Explore support for the Arazzo spec from OpenAPI", "body": "Arazzo spec: https://spec.openapis.org/arazzo/latest.html#version-1-0-0", "url": "https://github.com/Apicurio/apicurio-registry/issues/4951", "labels": ["type/task", "type/discussion", "priority/low"], "created_at": "2024-07-30T13:38:49Z", "topic": "Uncategorized"}, {"number": 4921, "title": "Create a test for the new SQLStatement KafkaSQL message (Kafka msg to exec arbitrary SQL)", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/4921", "labels": ["type/task", "priority/normal", "area/storage", "area/QE"], "created_at": "2024-07-23T19:48:03Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4916, "title": "Add Form Based Authentication Support for Apicurio Registry", "body": "### Feature or Problem Description\r\n\r\nAdd support for Form Based authentication for Apicurio out of the box through parameters. The main parameters are designed to store credentials on other servers or platforms such as Keycloak. For many software tasks, it is required to be isolated and use only the internal credential database. It would be great to supplement basic auth with form-based authentication.\r\n\r\n[Form Based Authentication](h
