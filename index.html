<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: Roboto Mono;
    color: #000000;
  }
  .container-box {
    margin: 8px 16px 8px 16px;
    padding: 12px;
    border-radius: 16px;
    line-height: 0.95;
    width: fit-content;
    height: fit-content;
    z-index: 2;
    backdrop-filter: blur(3px);
    background: #ffffffaa;
    box-shadow: 2px 3px 10px #aaaaaa44;
    position: relative;
    pointer-events: auto;
  }
  .more-opaque {
    backdrop-filter: blur(6px);
    background-color: #ffffffee;
  }
  #deck-container {
    width: 100vw;
    height: 100vh;  
  }
  #deck-container canvas {
    z-index: 1;
    background: #ffffff;
  }
  .deck-tooltip {
      
            font-size: 0.8em;
            font-family: Roboto Mono;
            font-weight: 300;
            color: #000000 !important;
            background-color: #ffffffee !important;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 2px 3px 10px #aaaaaa44;
            max-width: 25%;
  }
  input {
    margin: 2px;
    padding: 4px;
    border-radius: 8px;
    color: #000000;
    background: #ffffffdd;
    border: 2px inset #77777744;
    transition: 0.5s;
    outline: none;
    box-sizing: border-box;
  }
  input:focus {
    border: 2px inset #555;
  }
  

</style>

function debounce(func, timeout = 250) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => { func.apply(this, args); }, timeout);
  };
}

async function simpleArrowParser(arrow_bytes) {
  const table = await Arrow.tableFromIPC(arrow_bytes);
  const result = {};
  table.schema.fields.forEach((field) => {
    result[field.name] = table.getChild(field.name).toArray();
  });
  return result;
}

function mergeTypedArrays(arrays) {
  let totalLength = arrays.reduce((acc, arr) => acc + arr.length, 0);
  let result = new arrays[0].constructor(totalLength);
  let currentLength = 0;
  for (let arr of arrays) {
    result.set(arr, currentLength);
    currentLength += arr.length;
  }
  return result;
}



function updateProgressBar(id, progress) {
  const progressBar = document.querySelector(`#${id} .datamapplot-progress-bar-fill`);
  const progressText = document.querySelector(`#${id} .datamapplot-progress-bar-text`);
  if (progressBar && progressText) {
    progressBar.style.width = `${progress}%`;
    progressText.textContent = `${id.replace('-progress', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}: ${progress}%`;
  }
}

function checkAllDataLoaded() {
  const progressBars = document.querySelectorAll('.datamapplot-progress-bar-fill');
  const allLoaded = Array.from(progressBars).every(bar => bar.style.width === '100%');
  if (allLoaded) {
    const loadingEl = document.getElementById("loading");
    const progressEl = document.getElementById("progress-container");
    if (loadingEl) loadingEl.style.display = "none";
    if (progressEl) progressEl.style.display = "none";
    // Dispatch unified event for widgets to listen on
    document.dispatchEvent(new CustomEvent('datamapDataLoaded'));
  }
}

// Find a stack container or drawer by location name.
// Supports both corner locations ("top-left", "bottom-right", etc.)
// and drawer locations ("drawer-left", "drawer-right", "drawer-bottom").
function findStackContainer(location) {
  let stack = document.getElementsByClassName("stack " + location)[0];
  if (!stack && location.startsWith("drawer-")) {
    const drawerDirection = location.replace("drawer-", "");
    const drawer = document.querySelector(".drawer-container.drawer-" + drawerDirection);
    if (drawer) {
      stack = drawer;
    }
  }
  return stack;
}

        new DecompressionStream("gzip")
      );
      const arr = await new Response(decompressedStream).arrayBuffer()
      return new Uint8Array(arr);

    async function decodeBase64WithProgress(base64) {
      const totalLength = base64.length;
      const chunkSize = 1024 * 1024; // 1MB chunks
      let decodedArray = new Uint8Array(Math.ceil(totalLength * 3 / 4));
      let offset = 0;

      for (let i = 0; i < totalLength; i += chunkSize) {
        const chunk = base64.slice(i, i + chunkSize);
        const decodedChunk = Uint8Array.from(atob(chunk), c => c.charCodeAt(0));
        decodedArray.set(decodedChunk, offset);
        offset += decodedChunk.length;

        const progress = Math.min(100, Math.round((i + chunkSize) / totalLength * 100));
        self.postMessage({ type: 'progress', progress: progress });

        // Allow other operations to occur
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      return decodedArray.slice(0, offset);
    }
    const decodedData = await decodeBase64WithProgress(encodedData);
    const decompressedData = await DecompressBytes(decodedData);

// =============================================================================
// Density Tile Image Resolver
// =============================================================================

async function resolveDensityTileImages(tilePyramids) {
  // When running inside a Jupyter notebook with file-based data, image URLs
  // point at the Jupyter contents API which returns JSON with base64 content
  // instead of raw image bytes.  Detect this and convert to blob URLs so that
  // deck.gl BitmapLayer can consume them.
  const allTiles = [];
  for (const field of Object.keys(tilePyramids)) {
    for (const level of tilePyramids[field]) {
      for (const tile of level) {
        allTiles.push(tile);
      }
    }
  }
  if (allTiles.length === 0) return;

  // Only need special handling when the URL routes through /api/contents/
  const needsResolve = allTiles[0].image.includes('/api/contents/');
  if (!needsResolve) return;

  const headers = {};
  const densityApiToken = (typeof DENSITY_API_TOKEN !== 'undefined') ? DENSITY_API_TOKEN : null;
  if (densityApiToken) {
    headers['Authorization'] = 'Token ' + densityApiToken;
  }

  await Promise.all(allTiles.map(async (tile) => {
    try {
      const resp = await fetch(tile.image, { headers });
      if (!resp.ok) {
        console.error('Failed to fetch density tile:', tile.image, resp.status);
        return;
      }
      const json = await resp.json();
      const b64 = json.content;  // Jupyter contents API base64 field
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'image/png' });
      tile.image = URL.createObjectURL(blob);
    } catch (e) {
      console.error('Error resolving density tile image:', e);
    }
  }));
}

the registry admin API (`POST /admin/reindex`)\n- Status condition: `SearchIndexDegraded`\n\n### KafkaSQL Snapshot Recovery\n- Detect stale KafkaSQL snapshots (consumer lag combined with snaps...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8086", "labels": ["type/enhancement", "area/storage", "area/operator", "area/observability", "area/converter"], "created_at": "2026-05-26T09:27:43Z", "topic": "Uncategorized"}, {"number": 8085, "title": "Operator: Vertical auto-tuning (JVM, connection pools, thread pools)", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 4 (P3)** — Medium impact, high effort\n\n## Description\n\nDynamically adjust JVM settings, connection pool sizes, and Quarkus thread pool parameters based on observed resource utilization and load patterns.\n\n## Requirements\n\n- Monitor memory pressure and CPU usage from metrics or Kubernetes resource metrics API\n- Auto-adjust `JAVA_OPTS_APPEND` for JVM heap sizing based on container memory limits and observed usage\n- Auto-tune SQL connection pool size based on utilization (requires metrics from Phase 3)\n- Optiona...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8085", "labels": ["type/enhancement", "area/storage", "area/operator", "area/observability", "area/build"], "created_at": "2026-05-26T09:27:41Z", "topic": "Operator / Metrics / High"}, {"number": 8084, "title": "Operator: Metrics-driven status enrichment and capacity reporting", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 3 (P2)** — Medium impact, medium effort\n\n## Description\n\nThe operator should consume key metrics from the registry and surface them as status fields and Kubernetes Events, giving cluster admins visibility without requiring a separate monitoring stack.\n\n## Requirements\n\n- Scrape or query registry metrics endpoint (`/q/metrics`) periodically during reconciliation\n- Key metrics to surface in CR status:\n - API request rate and error rate\n - Storage connection pool utilization\n - KafkaSQL consumer lag (when applic...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8084", "labels": ["type/enhancement", "area/storage", "area/operator", "area/observability", "area/converter"], "created_at": "2026-05-26T09:27:39Z", "topic": "Operator / Metrics / High"}, {"number": 8083, "title": "Operator: Data migration orchestration on version upgrades", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 3 (P2)** — Medium impact, high effort\n\n## Description\n\nWhen the registry image version changes (upgrade), the operator should orchestrate database schema migrations before rolling out the new Deployment, and roll back if migration fails.\n\n## Requirements\n\n- Detect version changes by comparing the current Deployment image tag with the desired one\n- Before updating the Deployment, run a pre-upgrade migration Job:\n - Use the new image with a migration-only entrypoint or Flyway CLI\n - Verify schema version matche...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8083", "labels": ["type/enhancement", "area/storage", "area/operator", "area/storage/sql", "area/CLI", "area/build"], "created_at": "2026-05-26T09:27:37Z", "topic": "Updates / Operator"}, {"number": 8082, "title": "Operator: TLS certificate expiration detection and alerting", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 2 (P1)** — High impact, medium effort\n\n## Description\n\nThe operator should monitor TLS certificates referenced in the CR (keystores, truststores, ingress TLS secrets) and emit warnings before they expire.\n\n## Requirements\n\n- Periodically inspect TLS secrets referenced in `spec.app.tls` and `spec.app.ingress.tls`\n- Parse certificate expiration dates from the secret data\n- Emit Kubernetes Events and update status conditions when certificates are within a configurable warning window (default: 30 days)\n- Configur...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8082", "labels": ["type/enhancement", "area/operator", "area/observability"], "created_at": "2026-05-26T09:27:35Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 8081, "title": "Operator: Backup and Restore CRD for registry data", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 2 (P1)** — High impact, high effort\n\n## Description\n\nIntroduce `RegistryBackup` and `RegistryRestore` custom resources (or subresources of `ApicurioRegistry3`) that allow users to declaratively back up and restore registry data.\n\n## Requirements\n\n### Backup\n- New CRD (`RegistryBackup` or `spec.app.backup` subresource) with fields:\n - `registryRef` — reference to the ApicurioRegistry3 instance\n - `storageType` — inferred from registry or explicit (sql, kafkasql)\n - `destination` — PVC, S3, or similar\n - `sched...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8081", "labels": ["type/enhancement", "area/storage", "area/operator", "area/observability", "area/converter"], "created_at": "2026-05-26T09:27:33Z", "topic": "Operator / Metrics / High"}, {"number": 8080, "title": "Operator: Generate ServiceMonitor/PodMonitor for Prometheus integration", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 1 (P0)** — High impact, low effort\n\n## Description\n\nThe operator should generate `ServiceMonitor` and/or `PodMonitor` resources so that Prometheus (via the Prometheus Operator) can automatically discover and scrape registry metrics endpoints.\n\n## Requirements\n\n- New CRD fields under `spec.app.monitoring`:\n - `enabled` (boolean)\n - `interval` (string, e.g., `30s`)\n - `path` (string, default `/q/metrics`)\n - `labels` (map, for ServiceMonitor label selectors)\n- Operator creates a `ServiceMonitor` targeting the a...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8080", "labels": ["type/enhancement", "area/rest", "area/operator", "area/observability"], "created_at": "2026-05-26T09:27:31Z", "topic": "Operator / Metrics / High"}, {"number": 8079, "title": "Operator: HPA support for app and UI deployments", "body": "## Parent Epic\nPart of #8078 — Operator Auto Pilot capability level\n\n## Phase\n**Phase 1 (P0)** — High impact, medium effort\n\n## Description\n\nAdd support for the operator to create and manage `HorizontalPodAutoscaler` resources for both the app and UI deployments.\n\n## Requirements\n\n- New CRD fields under `spec.app.autoscaling` and `spec.ui.autoscaling`:\n - `enabled` (boolean)\n - `minReplicas` (integer)\n - `maxReplicas` (integer)\n - `targetCPUUtilizationPercentage` (integer)\n - `targetMemoryUtilizationPercentage` (integer)\n- Operator creates/updates/deletes HPA resources as dependent resources i...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8079", "labels": ["type/enhancement", "area/operator", "area/observability", "area/build"], "created_at": "2026-05-26T09:27:29Z", "topic": "Operator / Metrics / High"}, {"number": 8078, "title": "Operator: Reach Auto Pilot capability level (Level 5)", "body": "## Summary\n\nEvolve the Apicurio Registry operator from its current capability level (~Level 2 — Seamless Upgrades, with partial Level 3) to **Level 5 — Auto Pilot** on the [Kubernetes Operator Capability Model](https://sdk.operatorframework.io/docs/overview/operator-capabilities/).\n\nThe operator today handles installation, configuration, basic reconciliation, CR field migration, and status condition reporting. This epic tracks the work needed to close gaps in full lifecycle management, deep insights, and autonomous operation.\n\n---\n\n## Current State\n\n| Level | Name | Status |\n|-------|------|--...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8078", "labels": ["type/enhancement", "area/operator", "type/epic", "area/AI", "area/observability", "area/converter"], "created_at": "2026-05-26T09:23:19Z", "topic": "Operator / Metrics / High"}, {"number": 8059, "title": "[Feature] Per-resource authorization for agent discovery endpoints", "body": "## Parent Epic\nPart of #6991: AI Agent Registry (MCP & A2A Support)\n\n## Background\n\nPR #7927 implements agent visibility filtering using artifact labels (`apicurio.agent.visibility` = public/entitled/private) with post-query filtering in `WellKnownResourceImpl`. This works correctly but has a known limitation: the \"entitled\" visibility level treats all authenticated users equally — any authenticated user can see all entitled agents regardless of which group they belong to.\n\nThe original plan (#7884) envisioned that entitlements would map to group-level read access: an agent in group `dept-it/a...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8059", "labels": ["priority/high", "area/rest", "area/auth", "area/ai-agents"], "created_at": "2026-05-21T05:27:37Z", "topic": "Grants / Access / Permissions"}, {"number": 8058, "title": "[Feature] SQL structured content search for agent discovery filters", "body": "## Parent Epic\nPart of #6991: AI Agent Registry (MCP & A2A Support)\n\n## Background\n\nThe agent discovery endpoints (`GET /.well-known/agents`, `POST /.well-known/agents/search`) support filtering by skills, capabilities, input/output modes, protocol bindings, and tags. These filters use `SearchFilter.ofStructure()` which is only implemented in the Elasticsearch search backend.\n\nOn SQL-based storage variants (PostgreSQL, KafkaSQL, H2, MySQL, MSSQL), structure filters are **silently ignored** — the search returns all matching agents as if no filter was applied.\n\nThis also affects MCP tool search ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8058", "labels": ["priority/normal", "area/storage", "area/AI", "area/storage/sql", "area/ai-agents", "area/search"], "created_at": "2026-05-21T05:26:21Z", "topic": "Search / Query / Count"}, {"number": 8055, "title": "CLI: Add authentication support (Basic auth and OAuth2)", "body": "## Description\n\nAdd `acr login` and `acr logout` commands to authenticate with secured registry instances.\n\n## Auth Types\n\n- **Basic auth** — username/password\n- **OAuth2** — client credentials flow (token endpoint, client ID, client secret)\n\n## Credential Storage\n\nCredentials stored securely in the OS keychain:\n- macOS: Keychain via `security` command\n- Linux: libsecret via `secret-tool` command\n- Fallback: encrypted file if neither available\n\nAuth metadata (username, auth type, token endpoint, client ID) stored in `config.json` per context. Passwords and secrets stored only in the OS keychai...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8055", "labels": ["area/auth", "area/sdk", "area/CLI"], "created_at": "2026-05-20T15:24:23Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 8037, "title": "[Data Contracts] Phase 9: Advanced Rule Executors & Confluent Compatibility", "body": "## Phase 9 — Remaining Data Contracts Work\n\nParent epic: #6192\n\n### Phase 9A: Advanced Rule Executors\n\nField-level CEL evaluation and encryption/decryption transforms.\n\n- [ ] #7361 CEL_FIELD Rule Executor — Field-level CEL expressions applied per-field by tag/path match\n- [ ] #7362 Encryption/Decryption Rule Executors — TRANSFORM-kind executors with KMS integration for field-level encrypt on write / decrypt on read\n\n### Phase 9B: Confluent Schema Registry Compatibility\n\nTranslation layer between Confluent's data contracts model and Apicurio's native model. Partial implementation exists in bran...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8037", "labels": ["type/enhancement", "priority/high", "area/rules", "area/rest/ccompat", "area/converter", "area/rules/validity"], "created_at": "2026-05-19T10:14:03Z", "topic": "Schema / Type / Compatibility"}, {"number": 8030, "title": "CLI: Config class refactor", "body": "## Description\n\nThe current `Config.read()`/`Config.write()` pattern requires callers to read the model, modify the map, and write it back — repeated in many places. Proposed improvements:\n\n- Add convenience methods for reading/writing individual config properties (e.g. `Config.getProperty(key)`, `Config.setProperty(key, value)`)\n- Remove defensive copy in `read()` — cache the deserialized config and add a `flush()` method to persist, called once in `AbstractCommand.call()` finally block\n- Unify `getAcrCurrentHomePath()` to use `envOverrides` instead of a separate `acrCurrentHomePath` setter\n-...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8030", "labels": ["area/CLI"], "created_at": "2026-05-18T22:07:42Z", "topic": "Schema / Type / Compatibility"}, {"number": 8029, "title": "CLI: Auto-update hardening", "body": "## Description\n\nFollow-ups from #7642 to harden the auto-update mechanism:\n\n- **Download integrity verification** — verify SHA-256 checksums of downloaded ZIPs before extracting/installing\n- **HTTP client timeouts** — configure connection/read timeouts and redirect limits on the Vertx HTTP client\n- **Rollback mechanism** — keep the old binary until the new one is verified working, so a failed update can recover\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8029", "labels": ["area/dependencies", "area/sdk"], "created_at": "2026-05-18T22:07:41Z", "topic": "Uncategorized"}, {"number": 8028, "title": "CLI: Dynamic help text via picocli command tree walking", "body": "## Description\n\n`AbstractCommand.applyBranding()` walks the picocli `CommandSpec` tree at runtime and replaces `{{product-name}}` placeholders. This approach could be extended to resolve other dynamic placeholders in help text:\n\n- `{{rule-types}}` — dynamically list valid rule types (VALIDITY, COMPATIBILITY, INTEGRITY)\n- `{{rule-configs}}` — list valid rule configurations per type\n\nThis would eliminate hardcoded enum listings in help text and keep them in sync with the actual supported values.\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8028", "labels": ["area/rules", "area/documentation", "area/CLI"], "created_at": "2026-05-18T22:07:40Z", "topic": "Schema / Type / Compatibility"}, {"number": 8027, "title": "CLI: Verbose logging should print raw request and response details", "body": "## Description\n\nWhen `--verbose` is enabled, the CLI should print raw Registry client request and response details for debugging.\n\n## Expected Behavior\n\n- Print request: method, URL, headers, body\n- Print response: status code, headers, body\n- Only when `--verbose` flag is used\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8027", "labels": ["area/rest", "area/sdk", "area/observability", "area/CLI"], "created_at": "2026-05-18T22:07:39Z", "topic": "Uncategorized"}, {"number": 8025, "title": "CLI: Unify handling of the default group", "body": "## Description\n\nThe default group is not handled consistently:\n\n1. Listing groups does not show the default group name as \"default\" — it shows empty string\n2. `acr group get default` fails with `GroupNotFoundException`\n3. `acr group get \"\"` throws a `NullPointerException`\n\n## Expected Behavior\n\n- Treat the default group name as \"default\" everywhere\n- `acr group get default` should work\n- Group commands (add, delete) for the default group should fail gracefully with clear messages\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8025", "labels": [], "created_at": "2026-05-18T22:07:38Z", "topic": "Uncategorized"}, {"number": 8024, "title": "CLI: Review short property names across all commands", "body": "## Description\n\nShort property names like `-a`, `-b`, `-c` are a limited resource. Review all commands and consider using long names instead of short names for less common properties.\n\nExample: `-n`/`--name` is used for artifact/version name but may conflict with other uses.\n\nSearch commands already had `-d`, `-n`, `-t` short options removed in PR #7973. This issue tracks reviewing the remaining commands.\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8024", "labels": ["area/CLI", "area/build"], "created_at": "2026-05-18T22:07:37Z", "topic": "Agent / Mcp / Registry"}, {"number": 8023, "title": "CLI: Better error when creating artifact without content or type", "body": "## Description\n\nWhen creating an artifact without specifying content or artifact type, the error message is unclear:\n\n```\nError creating artifact: MissingRequiredParameterException: Request is missing a required parameter: body.artifactType\n```\n\n## Expected Behavior\n\n- Show a clear error message when `--type` is missing\n- List supported artifact types when the type is invalid or missing\n- Investigate auto-detection of `--content-type` for JSON and YAML files\n- Consider whether this should be handled server-side\n\n## Parent Epic\n\n- #7162", "url": "https://github.com/Apicurio/apicurio-registry/issues/8023", "labels": ["area/caching", "area/build"], "created_at": "2026-05-18T22:07:36Z", "topic": "Uncategorized"}, {"number": 8022, "title": "CLI: Auto context update — set group/artifact in context after operations", "body": "## Description\n\nWhen a user creates or gets a group/artifact, automatically update the current context with that group/artifact ID. This reduces repetitive `-g` and `-a` flags in subsequent commands.\n\n## Example\n\n```bash\nacr group add test-group\n# Group \"test-group\" is automatically set in the context.\nacr artifact add -f user-v1.avsc test-artifact\n# Instead of: acr artifact add -g test-group -f user-v1.avsc test-artifact\nacr artifact version add -f user-v2.avsc 2\n# Instead of: acr artifact version add -g test-group -a test-artifact -f user-v2.avsc 2\n```\n\n## Acceptance Criteria\n\n- Auto context...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8022", "labels": ["area/build"], "created_at": "2026-05-18T22:07:35Z", "topic": "Uncategorized"}, {"number": 8003, "title": "fix(avro): follow-up improvements for AvroCanonicalHashUpgrader", "body": "## Summary\n\nFollow-up improvements for the Avro canonical hash upgrader introduced in #7550.\n\n## Tasks\n\n### 1. Add test coverage for schemas with artifact references\n\nThe `AvroCanonicalHashUpgrader` has a `resolveReference()` code path that queries the DB for referenced content. This path is currently untested. If reference resolution fails, the error is silently swallowed (logged as warning), leaving stale hashes in place.\n\n**What to do:**\n- Add a test case that creates an Avro schema with artifact references, corrupts its canonical hash, and verifies the upgrader recomputes it correctly\n- Ad...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8003", "labels": ["area/rules", "area/references", "area/rules/integrity", "area/avro", "area/caching"], "created_at": "2026-05-14T17:40:36Z", "topic": "Uncategorized"}, {"number": 8002, "title": "Search API: inconsistent matching behavior across name fields", "body": "## Description\n\nThe search API has inconsistent matching behavior across different entity types:\n\n- **Artifact `name`**: searches both the `name` field and `artifactId` field. User must use `*` wildcard as prefix/suffix for partial matching, otherwise matches exactly.\n- **Version `name`**: searches as a substring match, and treats `*` literally (not as a wildcard).\n- **`description`**: matches as a substring for all entity types.\n- **Labels**: matched exactly, supporting `key`, `key:`, or `key:value` formats.\n- **Other fields**: matched exactly.\n\n## Expected behavior\n\nThe matching behavior for...", "url": "https://github.com/Apicurio/apicurio-registry/issues/8002", "labels": ["area/CLI", "area/search"], "created_at": "2026-05-13T15:29:43Z", "topic": "Search / Query / Count"}, {"number": 7992, "title": "feat(ci): AI-based PR classification for test group selection", "body": "## Summary\n\nExtend the existing AI-based issue classification (PR #7915, merged) to also classify PRs. Use the classification to automatically select which test groups to run based on the areas affected by the PR.\n\n## Context\n\nThe issue classifier uses sentence embeddings (all-MiniLM-L6-v2) and cosine similarity to assign `area/*` labels. The same approach can be applied to PRs to:\n\n1. Auto-assign `area/*` labels to PRs based on title, description, and changed files\n2. Use the classification to inform the `decide` job in the Verify workflow, selecting only relevant test phases\n3. Reduce CI dur...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7992", "labels": ["area/QE", "area/examples", "area/CI"], "created_at": "2026-05-11T11:45:00Z", "topic": "Uncategorized"}, {"number": 7964, "title": "[Feature] Usage Telemetry Enhancements — Webhooks, Impact Analysis, Auto-Sunset", "body": "## Parent\nFollow-up to #7000 - API Lifecycle Governance (Usage Telemetry)\n\n## Context\n\nThe core usage telemetry feature was implemented in #7881 with:\n- Server-side tracking via headers (async, buffered, deduped)\n- Active/Stale/Dead classification with reference liveness propagation\n- Consumer version heatmap with drift alerts\n- Deprecation readiness reports\n- SUNSET state in version lifecycle\n- Dashboard widget, version badges, Usage tab in UI\n- OTel metrics export\n- Data retention cleanup\n\n## Remaining Enhancements\n\n### 1. Webhook Notifications on Deprecation\nFire a webhook to registered URL...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7964", "labels": ["type/enhancement", "area/operator", "area/observability", "area/search", "area/caching"], "created_at": "2026-05-07T21:04:38Z", "topic": "Operator / Metrics / High"}, {"number": 7955, "title": "PR Lifecycle Orchestrator Improvements", "body": "This issue tracks improvements to the CI that handles PRs and issues:\n\n- `/merge` currently fails if the PR requires rebase. Should it rebase automatically, and switch on `/auto-merge` since the intent is clear? Same with `/auto-merge`\n- Task type is not assigned to issues\n- `removeLabel` in `pr-lifecycle.js` crashes with 403 on fork PRs. The `pull_request_review` event gives a read-only `GITHUB_TOKEN` for fork PRs, so label mutations fail. Currently only 404 is caught (line 150), but 403 should also be handled gracefully (log a warning instead of crashing). Same issue likely affects `addLabel...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7955", "labels": ["area/sdk", "area/CI"], "created_at": "2026-05-07T12:38:19Z", "topic": "Uncategorized"}, {"number": 7902, "title": "Write a blog post introducing the Apicurio Registry CLI", "body": "## Description\n\nWrite a blog post introducing the Apicurio Registry CLI — its features, usage examples, and how to get started.\n\n## Details\n\n- Blog: https://www.apicur.io/blog/\n- Blog posts are added via PRs to [apicurio.github.io](https://github.com/Apicurio/apicurio.github.io)\n- Example blog PR: https://github.com/Apicurio/apicurio.github.io/pull/112\n\n## Topics to Cover\n\n- What the CLI is and why it exists\n- Installation and setup\n- Key features: group/artifact/version management, rules (global, group, artifact), version comments, search\n- Usage examples with sample commands\n- Context manage...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7902", "labels": ["type/enhancement", "area/CLI"], "created_at": "2026-05-01T01:02:17Z", "topic": "Uncategorized"}, {"number": 7892, "title": "Use JUnit 5 conditional execution for deployment-mode-dependent operator IT tests", "body": "## Summary\n\nSeveral operator integration tests skip execution when running in local deployment mode using `log.warn()` + early `return`. This causes skipped tests to be reported as **passed** rather than **skipped**, hiding gaps in test coverage.\n\n## Affected tests\n\n- `RestrictedNamespaceITTest`\n- `OperatorConfigITTest`\n- `LeaderElectionITTest` (from PR #7870)\n\n## Proposed approach\n\nUse JUnit 5's `@DisabledIf` annotation with a shared condition method in `ITBase`, so tests that require a remote operator deployment are declaratively skipped and correctly reported by JUnit. This avoids duplicati...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7892", "labels": ["type/quality", "priority/low", "area/QE", "area/operator"], "created_at": "2026-04-30T14:22:38Z", "topic": "Updates / Operator"}, {"number": 7891, "title": "Consider removing operator ConfigMap-based configuration in favor of OLM Subscription env vars", "body": "## Summary\n\nConsider removing the feature where the operator reads configuration from a well-known ConfigMap. This was added as a workaround for configuring the operator in OLM-managed deployments, where users cannot directly edit the operator Deployment.\n\n## Rationale\n\nOLM's [Subscription `spec.config`](https://github.com/operator-framework/operator-lifecycle-manager/blob/master/doc/design/subscription-config.md) supports setting environment variables (`env`, `envFrom`) on operator pods, and these overrides survive operator upgrades. This covers the same use case the ConfigMap feature was bui...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7891", "labels": ["type/enhancement", "priority/low", "area/operator"], "created_at": "2026-04-30T14:22:35Z", "topic": "Updates / Operator"}, {"number": 7890, "title": "Support high availability (HA) for the Apicurio Registry Operator", "body": "## Summary\n\nEnable production-grade high availability for the Apicurio Registry Operator by supporting multiple replicas with leader election, pod anti-affinity, and PodDisruptionBudgets. Currently the operator runs as a single replica — if the pod is evicted or the node goes down, no reconciliation happens until Kubernetes reschedules it.\n\n## Motivation\n\nIn production environments, operator downtime means custom resources are not reconciled, which can delay recovery of the registry itself. Running multiple operator replicas with leader election provides automatic failover in seconds rather th...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7890", "labels": ["type/enhancement", "impacts/documentation", "priority/normal", "area/operator"], "created_at": "2026-04-30T14:22:15Z", "topic": "Operator / Metrics / High"}, {"number": 7885, "title": "[Feature] Agent Catalog UI", "body": "## Parent Epic\nPart of #6991: AI Agent Registry (MCP & A2A Support)\n\n## Background\n\nThe [A2A community Agent Registry proposal](https://github.com/a2aproject/A2A/discussions/741) includes mockups for an agent catalog UI — a browsable, searchable interface for discovering agents. Apicurio Registry has basic artifact management UI but no dedicated agent catalog experience.\n\n## Problem Statement\n\n- No dedicated \"Agent Catalog\" view — agents are mixed with all other artifact types\n- No card-based browsable layout for agents\n- No visual indicators for agent capabilities, skills, or visibility\n- No ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7885", "labels": ["type/enhancement", "priority/high", "area/ui", "area/ai-agents"], "created_at": "2026-04-29T13:16:32Z", "topic": "Agent / Mcp / Registry"}, {"number": 7884, "title": "[Feature] Agent Visibility & Entitlement Model", "body": "## Parent Epic\nPart of #6991: AI Agent Registry (MCP & A2A Support)\n\n## Background\n\nThe [A2A community Agent Registry proposal](https://github.com/a2aproject/A2A/discussions/741) defines an entitlement model where clients are granted access to specific agents. Rather than building a custom entitlement service, this maps naturally to Apicurio's existing RBAC and group-based access control.\n\n## Problem Statement\n\nCurrently all authenticated users see all Agent Card artifacts. There's no concept of:\n- Public vs private agent visibility\n- Scoped agent access per client/team\n- Visibility levels tha...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7884", "labels": ["priority/normal", "area/auth", "area/ai-agents"], "created_at": "2026-04-29T13:16:05Z", "topic": "Uncategorized"}, {"number": 7883, "title": "[Feature] Agent Discovery & Entitlement Endpoints", "body": "## Parent Epic\nPart of #6991: AI Agent Registry (MCP & A2A Support)\n\n## Background\n\nThe [A2A community Agent Registry proposal](https://github.com/a2aproject/A2A/discussions/741) defines three tiers of agent discovery: open (public), entitled (scoped), and search-based. Apicurio Registry already has `/.well-known/agents` with basic filtering, but lacks the tiered discovery model needed for enterprise agent catalogs.\n\n## Problem Statement\n\nCurrent limitations:\n- No distinction between public and authenticated agent discovery\n- No entitlement-aware filtering (all authenticated users see all agen...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7883", "labels": ["type/enhancement", "priority/high", "area/rest", "area/auth", "area/ai-agents"], "created_at": "2026-04-29T13:15:36Z", "topic": "Agent / Mcp / Registry"}, {"number": 7882, "title": "AI-Native CLI: Runtime Introspection, Dynamic Skills, and CLI/MCP Consolidation", "body": "## Overview\n\nMake the Apicurio Registry CLI the primary interface for LLM/AI agent interaction with the\nregistry, by adding runtime schema introspection, dynamic skill generation, and consolidating\nshared logic between the CLI and MCP server modules.\n\nResearch shows CLI tools are 10-32x cheaper on tokens than MCP servers, with ~100% reliability\nvs MCP's ~72%. The CLI should become the canonical LLM interface, with the MCP server eventually\nembedded as `acr ai mcp`.\n\n## Parent Epics\n\n- #6991 — AI Agent Registry (MCP & A2A Support)\n- #7162 — CLI Standard Features\n\n## Related Issues\n\n- #7229 — Ag...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7882", "labels": ["impacts/documentation", "priority/normal", "type/epic", "area/AI/MCP", "area/ai-agents", "area/CLI"], "created_at": "2026-04-29T12:59:11Z", "topic": "Agent / Mcp / Registry"}, {"number": 7879, "title": "feat: Field-level data classification with authorization-scoped schema views", "body": "## Description\n\nSchema registries serve the full schema to any authenticated consumer — including fields the consumer should not see (PII, restricted data). The schema itself reveals data structure even when payload data is encrypted.\n\nThe workaround (separate schemas per audience) causes N×M proliferation and synchronization burden.\n\n## Proposed Feature\n\nAllow fields to carry data classification annotations. When a consumer fetches a schema, the registry returns a **view** containing only fields at or below the consumer's clearance level.\n\n### Classification Levels\n\nConfigurable hierarchy (de...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7879", "labels": ["type/enhancement", "priority/normal", "area/rules", "area/auth"], "created_at": "2026-04-29T11:03:08Z", "topic": "Schema / Type / Compatibility"}, {"number": 7878, "title": "feat: Cross-registry schema promotion (Dev → Stage → Prod)", "body": "## Description\n\nOrganizations run separate registry instances per environment. Promoting a schema from dev to prod is manual: export, import, hope versions align. No diff visibility, no approval workflow, no rollback.\n\nConfluent has Schema Linking (async replication) — but that's mirroring, not governed promotion.\n\n## Proposed Feature\n\nGoverned promotion pipeline with diff visibility, approval gates, and rollback.\n\n### Promotion Flow\n\n```\nDEV Registry ──[promote]──► STAGING Registry ──[promote]──► PROD Registry\n v5 v3 v2\n\nPromotion request: DEV v5 → STAGING\n Diff: v3 → v5 (2 versions)\n + field...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7878", "labels": ["type/enhancement", "priority/normal", "area/ui", "area/rest", "area/auth"], "created_at": "2026-04-29T11:02:49Z", "topic": "Schema / Type / Compatibility"}, {"number": 7877, "title": "feat: Semantic schema diff visualization in UI", "body": "## Description\n\nThe registry UI shows raw schema content for each version. Comparing versions requires manually diffing JSON/Protobuf/YAML text and mentally classifying each change as breaking or non-breaking.\n\n## Proposed Feature\n\nSide-by-side semantic diff with compatibility annotations:\n\n```\nUserEvent v2 → v3\n\n ADDED (compatible)\n + field 'email' : string (default: \"\") ← green\n\n REMOVED (breaking for BACKWARD)\n - field 'legacyId' : int ← red\n\n CHANGED (compatible)\n ~ field 'score' : int → long (widening) ← yellow\n\n UNCHANGED\n = field 'userId' : string\n = field 'action' : string\n```\n\nEach ch...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7877", "labels": ["type/enhancement", "priority/normal", "area/ui", "area/rest"], "created_at": "2026-04-29T11:02:30Z", "topic": "Schema / Type / Compatibility"}, {"number": 7876, "title": "feat: Configurable schema linting rules (naming, documentation, PII detection)", "body": "## Description\n\nCompatibility rules ensure schemas don't break consumers. But they don't ensure schemas are *good*: well-named, documented, consistent, free of PII exposure risks. Teams enforce these conventions through code review — manual, inconsistent, and late in the cycle.\n\nTools like `buf lint` (Protobuf) and Spectral (OpenAPI) exist as CLI tools but are not integrated into schema registries and can't enforce at registration time.\n\n## Proposed Feature\n\nPluggable lint rules evaluated at schema registration time, alongside compatibility rules.\n\n### Rule Categories\n\n**Naming:**\n- `field-nam...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7876", "labels": ["type/enhancement", "impacts/documentation", "priority/high", "area/rules", "area/avro"], "created_at": "2026-04-29T11:02:14Z", "topic": "Schema / Type / Compatibility"}, {"number": 7875, "title": "feat: Transitive compatibility impact analysis via reference graph", "body": "## Description\n\nCompatibility checks are pairwise: \"is PaymentInfo v2 compatible with v1?\" But schemas reference each other in a DAG. A compatible change to `PaymentInfo` can silently break `OrderEvent` or `UserEvent` which reference it — and the pairwise check doesn't warn about this.\n\nNo schema registry evaluates compatibility transitively across the reference graph.\n\n## Proposed Feature\n\nA `/compatibility/impact` endpoint that, given a proposed schema change, reports the full blast radius.\n\n### API\n\n```\nPOST /apis/registry/v3/compatibility/impact\n\n{\n \"groupId\": \"com.example\",\n \"artifactId\":...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7875", "labels": ["type/enhancement", "priority/high", "area/rules/compatibility", "area/rest", "area/references"], "created_at": "2026-04-29T11:01:53Z", "topic": "Schema / Type / Compatibility"}, {"number": 7874, "title": "feat: Compatibility fix suggestions — tell users how to fix incompatible schema changes", "body": "## Description\n\nWhen a schema change fails compatibility, the registry currently returns only the violation type (e.g., `READER_FIELD_MISSING_DEFAULT_VALUE`). It does not tell the user **how to fix it**.\n\nThis is the #1 friction point in schema governance adoption — teams disable compatibility rules rather than learn how to satisfy them.\n\n## Proposed Feature\n\nReturn structured fix suggestions alongside compatibility errors:\n\n```json\n{\n \"compatible\": false,\n \"rule\": \"BACKWARD\",\n \"violations\": [\n {\n \"type\": \"READER_FIELD_MISSING_DEFAULT_VALUE\",\n \"field\": \"email\",\n \"message\": \"New field 'email' h...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7874", "labels": ["type/enhancement", "priority/high", "area/rules/compatibility", "area/rest/ccompat"], "created_at": "2026-04-29T11:01:31Z", "topic": "Schema / Type / Compatibility"}, {"number": 7871, "title": "[Artifact Versions] sorting by version is not respecting semantic version", "body": "## Description\n\n**Registry\nVersion**: 3.2.x\n**Persistence type**: gitops\n\n### Environment\n\ndoes not matter\n\n### Steps to Reproduce\n\nNavigate on UI to Artifact Versions and click on version header sorting\n\n### Expected vs Actual Behaviour\n\nActual Behaviour:\nWhen I sort by version in table, i get \n\n- 1.0.0\n- 1.0.1\n- 1.0.10\n- 1.0.11\n- 1.0.2\n- ...\n\nExpected Behaviour:\nWhen I sort by version in table, i want get \n\n- 1.0.0\n- 1.0.1\n- 1.0.2\n- ...\n- 1.0.10\n- 1.0.11\n\n### Logs\n\nnot relevant here", "url": "https://github.com/Apicurio/apicurio-registry/issues/7871", "labels": [], "created_at": "2026-04-28T14:55:28Z", "topic": "Schema / Type / Compatibility"}, {"number": 7869, "title": "feat(ci): PR lifecycle orchestrator — remaining tasks and improvements", "body": "## Context\n\nPR #7868 introduces the initial PR lifecycle orchestrator. This issue tracks remaining work to stabilize, improve, and fully roll out the feature.\n\n## Rollout\n\n- [ ] Test with `orchestrator/enabled` on a few real PRs\n- [ ] Validate `issue_comment` handlers work from main branch\n- [ ] Validate `workflow_run` handler correctly detects test pass/fail\n- [ ] Validate stale detection cron\n- [ ] Remove opt-in gate and make orchestrator default for all PRs\n- [ ] Remove `DO NOT MERGE` label and its backward compatibility logic\n\n## Improvements\n\n- [ ] **PR validation on open** — Reject PRs t...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7869", "labels": ["type/task", "priority/normal", "area/CI"], "created_at": "2026-04-28T14:08:30Z", "topic": "Updates / Operator"}, {"number": 7867, "title": "feat(auth): add permissions endpoint for UI per-resource access hints", "body": "## Summary\n\nExpose per-resource permissions to the UI so it can show/hide edit, delete, and create buttons based on the user's actual permissions.\n\n## Proposed approach: permissions in search response metadata\n\nInstead of a separate permissions endpoint, include the allowed operations in each search/list result item:\n\n```json\n{\n \"artifacts\": [\n {\n \"groupId\": \"team-a\",\n \"artifactId\": \"user-events\",\n \"artifactType\": \"AVRO\",\n \"permissions\": [\"read\", \"write\"]\n },\n {\n \"groupId\": \"shared\",\n \"artifactId\": \"common-types\",\n \"permissions\": [\"read\"]\n }\n ]\n}\n```\n\nThe OpenAPI spec already defines the `perm...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7867", "labels": ["type/enhancement", "area/ui", "area/rest", "area/auth", "area/CLI"], "created_at": "2026-04-28T14:07:14Z", "topic": "Grants / Access / Permissions"}, {"number": 7866, "title": "fix(auth): getGroupById uses AuthorizedStyle.GroupAndArtifact but only has one parameter", "body": "## Bug\n\n`GroupsResourceImpl.getGroupById(String groupId)` is annotated with `@Authorized(style = AuthorizedStyle.GroupAndArtifact, level = AuthorizedLevel.Read)` but the method only takes a single `groupId` parameter.\n\n`AuthorizedStyle.GroupAndArtifact` expects two parameters (`groupId` at index 0, `artifactId` at index 1). With only one parameter, any access controller that reads the second parameter gets an `ArrayIndexOutOfBoundsException`.\n\n## Expected\n\nThe annotation should be `@Authorized(style = AuthorizedStyle.GroupOnly, level = AuthorizedLevel.Read)`.\n\n## Found during\n\nPer-resource aut...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7866", "labels": ["type/bug", "priority/high", "area/auth"], "created_at": "2026-04-28T14:00:58Z", "topic": "Grants / Access / Permissions"}, {"number": 7820, "title": "Refactor RulesService: simplify overloaded applyRules methods", "body": "## Summary\n\n`RulesService` and `RulesServiceImpl` have accumulated multiple overloaded `applyRules` methods with similar signatures that are hard to distinguish at a glance.\n\n## Current state\n\nThe interface has 4 `applyRules` overloads and 1 `applyRule`:\n\n1. `applyRules(groupId, artifactId, artifactType, content, ruleApplicationType, references, resolvedReferences)` — standard REST flow\n2. `applyRules(storage, groupId, artifactId, artifactType, content, ruleApplicationType, references, resolvedReferences)` — GitOps: custom storage\n3. `applyRules(storage, groupId, artifactId, artifactType, cont...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7820", "labels": ["type/task", "priority/normal", "area/rules"], "created_at": "2026-04-22T16:37:49Z", "topic": "Uncategorized"}, {"number": 7815, "title": "Refactor content type and artifact type handling", "body": "## Summary\n\nThe content/artifact type handling has evolved organically and could benefit from a cleanup pass. Several areas have redundancy, incorrect assumptions, or missing abstractions.\n\n## Areas to review\n\n### Content type representation\n- Content type is passed as a raw `String` everywhere. A dedicated type (e.g., `ContentType` enum or class) would provide type safety and a natural home for detection/conversion logic.\n- `TypedContent` is a thin wrapper over `ContentHandle` + content type string. Consider whether it should carry artifact type and/or references, since `TypedContent` + `List...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7815", "labels": ["type/task", "priority/low", "area/storage", "area/rules"], "created_at": "2026-04-22T12:57:48Z", "topic": "Uncategorized"}, {"number": 7771, "title": "GitOps tests with different @TestProfile can leak H2 state across profiles", "body": "## Description\n\nWhen multiple `@QuarkusTest` classes with different `@TestProfile`s (e.g., `GitopsTestProfile` and `GitopsMultiRepoTestProfile`) run in the same Maven Surefire JVM fork, H2 in-memory databases from the previous profile's test can leak into the next one.\n\n## Root Cause\n\nH2 in-memory databases (e.g., `jdbc:h2:mem:registry_blue`) are JVM-scoped. When Quarkus \"restarts\" within the same JVM for a different test profile, the H2 databases from the previous profile may still exist in memory. The new storage instance sees leftover data.\n\n## Impact\n\n- `GitOpsSmokeTest` fails its \"initial...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7771", "labels": ["type/bug", "priority/low", "area/storage/gitops"], "created_at": "2026-04-15T23:55:50Z", "topic": "Uncategorized"}, {"number": 7768, "title": "research and possibly remove surplus adoc file", "body": "https://github.com/Apicurio/apicurio-registry/blob/main/docs/modules/ROOT/partials/getting-started/ref-registry-all-configs.template\n\n@eameh", "url": "https://github.com/Apicurio/apicurio-registry/issues/7768", "labels": ["type/task", "priority/low", "area/documentation"], "created_at": "2026-04-15T11:00:49Z", "topic": "Updates / Operator"}, {"number": 7763, "title": "[Feature] Implement the official MCP Registry API", "body": "## Parent Epic\nPart of #6991: AI Agent Registry\n\n## Background\n\nThe Model Context Protocol project has published an [official MCP Registry API specification](https://github.com/modelcontextprotocol/registry/blob/main/docs/reference/api/generic-registry-api.md) (v0.1, currently frozen) for discovering and managing MCP server definitions. There is also a [reference implementation](https://github.com/modelcontextprotocol/registry) (Go + PostgreSQL) deployed at `registry.modelcontextprotocol.io`, and an [OpenAPI spec](https://github.com/modelcontextprotocol/registry/blob/main/docs/reference/api/op...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7763", "labels": ["area/ai-agents"], "created_at": "2026-04-14T10:40:00Z", "topic": "Agent / Mcp / Registry"}, {"number": 7742, "title": "Support multiple OLM release channels for the operator (3.2.x and 3.3.x)", "body": "## Summary\n\nCurrently the operator release process uses a single OLM channel (`3.x`) with a linear upgrade path from 3.0.7 through the latest version. Going forward, we need to support releasing to **multiple channels** (starting with `3.2.x` and `3.3.x`) so that users can subscribe to a specific minor version stream and only receive patch updates within that stream.\n\n## Current State\n\n- **Single channel**: `3.x` hardcoded in `operator/Makefile` (`CHANNELS ?= 3.x`) and `catalog.template.yaml`\n- **Linear upgrade chain**: all versions (3.0.7 → 3.0.8 → ... → 3.2.1 → current) are in one channel\n- ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7742", "labels": ["type/enhancement", "impacts/operator", "priority/normal", "area/operator"], "created_at": "2026-04-10T11:10:36Z", "topic": "Updates / Operator"}, {"number": 7739, "title": "Integrate schema-validation library into serdes modules", "body": "## Summary\n\nNow that the `schema-validation` library has been merged into the monorepo (#7734), the serdes (serializers/deserializers) modules could benefit from integrating it as an optional validation step during serialize/deserialize operations.\n\n## Current State\n\n- **serdes/** handles serialization/deserialization for Kafka, NATS, and Pulsar. It uses `SchemaResolver` and `SchemaParser` from `schema-resolver`.\n- **schema-validation/** provides comprehensive schema validation with structured error reporting (`ValidationResult` + `ValidationError`) for JSON Schema, Avro, and Protobuf.\n- Both ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7739", "labels": ["type/enhancement", "priority/normal", "area/serdes", "resolution/fixed"], "created_at": "2026-04-10T09:59:31Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7735, "title": "Transfer community-operators forks to CNCF org", "body": "## Description\n\nAs part of the move of Apicurio Registry to CNCF, the following forked repositories need to be transferred to the CNCF GitHub org (or re-forked under it):\n\n- **community-operators** — fork from [k8s-operatorhub/community-operators](https://github.com/k8s-operatorhub/community-operators)\n - Source: https://github.com/Apicurio/community-operators\n- **community-operators-prod** — fork from [redhat-openshift-ecosystem/community-operators-prod](https://github.com/redhat-openshift-ecosystem/community-operators-prod)\n - Source: https://github.com/Apicurio/community-operators-prod\n\n## ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7735", "labels": ["type/task", "priority/normal", "area/operator"], "created_at": "2026-04-10T07:57:49Z", "topic": "Updates / Operator"}, {"number": 7724, "title": "Fine-grained per-resource authorization (resource-level ACLs)", "body": "## Summary\n\nFine-grained, per-resource authorization for Apicurio Registry — enabling policies like \"Alice can read artifacts in group team-a but not team-b,\" independent of her global RBAC role.\n\n## Problem\n\nToday, Registry supports:\n- **RBAC** — global roles (`sr-readonly`, `sr-developer`, `sr-admin`) that apply to *all* resources equally\n- **OBAC** — owner-based access control, where only the artifact/group creator can modify it\n\nNeither supports per-resource visibility or access rules. A developer with `sr-developer` can read and write every artifact in every group. There is no way to expr...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7724", "labels": ["type/enhancement", "impacts/documentation", "priority/normal", "area/rest", "area/storage", "area/auth"], "created_at": "2026-04-09T10:54:30Z", "topic": "Grants / Access / Permissions"}, {"number": 7670, "title": "Iceberg REST Catalog: Multi-table transactions", "body": "## Parent Epic\nPart of #7261 - Iceberg REST Catalog: Advanced features (Phase 4)\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nSupport atomic operations across multiple tables, enabling transactional consistency for complex data pipeline operations.\n\n## Scope\n\n### New Endpoints\n- `POST /v1/{prefix}/transactions/commit` — Commit a multi-table transaction\n- Atomic commit across tables within a namespace\n- Rollback all changes on any single table failure\n\n### Implementation\n\n#### API Layer\n- Add transaction endpoints to OpenAPI spec\n- Accept a list of table commit requests (reu...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7670", "labels": ["type/enhancement", "area/rest", "area/storage", "area/lakehouse"], "created_at": "2026-03-30T11:40:47Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7669, "title": "Iceberg REST Catalog: Credentials vending", "body": "## Parent Epic\nPart of #7261 - Iceberg REST Catalog: Advanced features (Phase 4)\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nProvide temporary credentials for accessing data files in object storage, enabling Iceberg clients to read/write data files directly.\n\n## Scope\n\n### Endpoints\n- Support `X-Iceberg-Access-Delegation: vended-credentials` header (already in OpenAPI spec)\n- Return credentials in `LoadTableResponse.config` field (plumbing exists, not yet implemented)\n\n### Cloud Provider Support\n- **AWS STS** — Temporary credentials via AssumeRole for S3 access\n- **GCS** —...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7669", "labels": ["type/enhancement", "priority/normal", "area/auth", "area/lakehouse"], "created_at": "2026-03-30T11:40:46Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7668, "title": "Iceberg REST Catalog: Scan planning endpoint", "body": "## Parent Epic\nPart of #7261 - Iceberg REST Catalog: Advanced features (Phase 4)\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nImplement the scan planning endpoint to enable query engines to plan table scans efficiently by returning file manifests and partition information.\n\n## Scope\n\n### New Endpoint\n- `POST /v1/{prefix}/namespaces/{namespace}/tables/{table}/scan` — Plan a table scan\n- Returns file manifests and partition information for query optimization\n- Support filter pushdown and partition pruning\n\n### Implementation\n- Add endpoint to OpenAPI spec (`iceberg/v1/openapi...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7668", "labels": ["type/enhancement", "area/rest", "area/lakehouse"], "created_at": "2026-03-30T11:40:44Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7667, "title": "Iceberg REST Catalog: OAuth2/OIDC integration", "body": "## Parent Epic\nPart of #7261 - Iceberg REST Catalog: Advanced features (Phase 4)\nPart of #6482 - Apache Iceberg REST Catalog Support\n\n## Overview\nSecure the Iceberg REST API with standard OAuth2/OIDC authentication, integrating with the existing Registry auth infrastructure.\n\n## Scope\n\n### 1. Expose Auth Configuration to Iceberg Clients\n- Return OAuth2/OIDC server URL and client configuration via the Iceberg config endpoint\n- Allow Iceberg clients (Spark, Trino, etc.) to discover auth settings automatically\n\n### 2. Iceberg-Specific Role/Scope Mapping\n- Map OIDC roles/scopes to Iceberg-level pe...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7667", "labels": ["type/enhancement", "area/auth", "area/lakehouse"], "created_at": "2026-03-30T11:40:42Z", "topic": "Iceberg / Catalog / Table"}, {"number": 7665, "title": "Publish arm64 images for apicurio-registry-3-operator", "body": "### Feature or Problem Description\n\nCurrently, there don't appear to be any published `arm64` images of `apicurio-registry-3-operator` even though such images are available for both `apicurio-registry` and `apicurio-registry-ui`.\n\n```\n$ docker system info --format '{{.OSType}}/{{.Architecture}}'\nlinux/aarch64\n```\n\n```\n$ docker pull quay.io/apicurio/apicurio-registry:3.2.1\n...\n$ docker inspect quay.io/apicurio/apicurio-registry:3.2.1 | jq '.[] | .Architecture' \n\"arm64\"\n\n$ docker pull quay.io/apicurio/apicurio-registry-ui:3.2.1\n...\n$ docker inspect quay.io/apicurio/apicurio-registry-ui:3.2.1 | j...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7665", "labels": ["type/enhancement", "area/operator", "area/build"], "created_at": "2026-03-28T16:03:40Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 7661, "title": "Review and consolidate integration test infrastructure", "body": "## Problem\n\nThe integration test infrastructure has grown organically and could benefit from a review and consolidation. Currently:\n\n- Most test groups use Docker containers for infrastructure (Kafka, PostgreSQL, MySQL, Keycloak, Debezium, Elasticsearch)\n- Some test groups require a Kubernetes cluster (kubernetesopsit)\n- The `RegistryDeploymentManager` handles infrastructure deployment but the logic for what to deploy is split between Maven profiles and Java code\n- The `utils/extra-tests` module exists separately from `integration-tests` with its own test infrastructure patterns\n- Examples are...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7661", "labels": ["type/task", "priority/normal", "area/QE", "area/examples", "area/CI", "area/build"], "created_at": "2026-03-27T18:16:26Z", "topic": "Operator / Metrics / High"}, {"number": 7636, "title": "Improve compatibility rule documentation with detailed allowed/disallowed changes per schema type", "body": "## Description\n\nThe current documentation for compatibility rules provides high-level descriptions of each mode (BACKWARD, FORWARD, FULL, etc.), but lacks detailed information about **what specific schema changes are allowed or disallowed** under each compatibility level.\n\nUsers need to understand, for each compatibility mode, which concrete changes will pass or fail the compatibility check. For example:\n\n- Can optional properties be added or removed?\n- Can required properties be added or removed?\n- Can property types be changed?\n- Can enum values be added or removed?\n- Can default values be c...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7636", "labels": ["type/enhancement", "priority/normal", "area/rules/compatibility", "area/documentation"], "created_at": "2026-03-25T10:52:15Z", "topic": "Schema / Type / Compatibility"}, {"number": 7635, "title": "Add spec.version field to ApicurioRegistry CR for independent operator/registry upgrades", "body": "## Description\n\nCurrently, the Apicurio Registry version is managed automatically by the operator — the registry version is tightly coupled to the operator version. This means upgrading the operator also upgrades the registry in a single step, which increases risk during upgrades.\n\n## Proposal\n\nAdd a `spec.version` field to the `ApicurioRegistry` custom resource that allows users to explicitly control which version of the registry is deployed, independently of the operator version.\n\nThis enables a **staged upgrade process** that minimizes risk:\n\n1. **Before upgrade**: Operator 3.0.3 running Re...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7635", "labels": ["type/enhancement", "impacts/operator", "priority/normal", "area/operator"], "created_at": "2026-03-25T10:47:51Z", "topic": "Uncategorized"}, {"number": 7634, "title": "Add API endpoints to list valid enumeration values for rule types", "body": "## Description\n\nCurrently, there are no API endpoints to retrieve the valid/allowed values for configuration options such as validity rules or compatibility rules. Clients must hardcode or guess these values.\n\nThis feature request proposes adding API endpoints that return the valid enumeration values for each rule type. For example, an endpoint that lists all valid compatibility levels (e.g. `NONE`, `BACKWARD`, `BACKWARD_TRANSITIVE`, `FORWARD`, `FORWARD_TRANSITIVE`, `FULL`, `FULL_TRANSITIVE`) or all valid validity levels.\n\n## Use Case\n\n- **UI and tooling**: Clients building UIs or CLI tools on...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7634", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/rules"], "created_at": "2026-03-25T10:41:27Z", "topic": "Schema / Type / Compatibility"}, {"number": 7633, "title": "Preserve original $ref information in dereferenced JSON schemas", "body": "## Description\n\nWhen using the Apicurio Registry API to query JSON schemas with reference dereferencing enabled, all `$ref` references are resolved and replaced with the actual referenced schema content. While this is functionally correct, the original reference information is lost in the process.\n\nIt would be useful to have an option to **preserve the original reference metadata** in the dereferenced output for diagnostic and tracking purposes. Since these references would be informational only (not functional), they could be encoded using a comment-like or custom property that does not viola...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7633", "labels": ["type/enhancement", "priority/normal", "area/references"], "created_at": "2026-03-25T10:38:56Z", "topic": "Git / Registry / Reference"}, {"number": 7585, "title": "Static sequenceCounters in SqlSequenceRepository can cause ID collisions with multiple H2 storages", "body": "## Description\n\n`SqlSequenceRepository` uses a `static` map of `AtomicLong` counters for generating sequential IDs (globalId, contentId, commentId) on H2 in-memory databases:\n\n```java\nprivate static final Map sequenceCounters = new HashMap<>();\n```\n\nWhen multiple storage instances share the same JVM (e.g., blue/green in polling storage), `initializeSequenceCounters()` on one instance overwrites the shared static counters, potentially causing primary key collisions in the other instance.\n\n## Steps to reproduce\n\n1. Blue storage initializes → sets static counters to e.g. `globalId=5`\n2. Green sto...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7585", "labels": ["type/bug", "priority/low", "area/storage/sql"], "created_at": "2026-03-19T09:05:27Z", "topic": "Uncategorized"}, {"number": 7549, "title": "[Feature] Schema validation at application startup (health check pattern)", "body": "## Background\n\nProduction users have reported experiencing production incidents where schemas in application code did not match schemas registered in the registry. To prevent this, they built mandatory startup checks — a pattern worth supporting officially.\n\n## Problem Statement\n\nWhen applications produce or consume events with Avro schemas, there is no built-in mechanism to verify at startup that:\n\n1. All schemas referenced in the application code are actually registered in the registry\n2. The registered schemas are compatible with what the application expects\n3. No schema drift has occurred ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7549", "labels": ["type/enhancement", "impacts/documentation", "priority/normal", "area/serdes"], "created_at": "2026-03-13T13:03:56Z", "topic": "Uncategorized"}, {"number": 7548, "title": "[Feature] General-purpose CLI tool for schema management", "body": "## Background\n\nProduction users are building their own internal tooling to manage schemas across environments using the Apicurio REST API. This signals a gap in Apicurio's built-in tooling that the project should own.\n\n## Problem Statement\n\nUsers need CLI-based tooling to:\n\n- **Host schemas centrally** in a source repository and push them to the registry\n- **Validate compatibility** of local schemas against existing schemas in the registry\n- **Deploy schemas** across environments (dev, staging, production)\n- **Disable/deprecate schemas** as part of lifecycle management\n- **Check schema status*...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7548", "labels": ["type/enhancement", "impacts/documentation", "priority/normal", "area/CLI"], "created_at": "2026-03-13T13:03:18Z", "topic": "Git / Registry / Reference"}, {"number": 7547, "title": "[Docs] Create Schema Lifecycle Best Practices Guide", "body": "## Background\n\nBased on feedback from production users, there is a significant documentation gap around schema lifecycle management. Users building event-driven architectures with Apicurio Registry and Avro schemas cannot find battle-tested answers to common questions.\n\n## Problem Statement\n\nThe following questions come up repeatedly for teams adopting Apicurio Registry, and there is no official documentation addressing them:\n\n1. **Shared schema references** — Is it common best practice to use shared schema references for repeated types (e.g., monetary amounts with BigDecimal + currency code)?...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7547", "labels": [], "created_at": "2026-03-13T13:03:11Z", "topic": "Git / Registry / Reference"}, {"number": 7546, "title": "Support GUID-based schema identification and schema IDs in Kafka headers", "body": "### Feature or Problem Description\n\nThe Kafka ecosystem is moving toward storing schema identifiers in **Kafka record headers** rather than embedding them as a payload prefix (the traditional magic byte + numeric ID wire format). This trend addresses several real-world pain points:\n\n1. **Adoption friction**: Organizations with existing Kafka topics that use schemas outside a registry cannot adopt schema governance without modifying message payloads, which breaks legacy consumers.\n2. **Big-bang migrations**: Moving schema metadata into/out of payloads forces synchronized producer/consumer upgra...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7546", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/serdes"], "created_at": "2026-03-13T11:09:05Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7533, "title": "Declarative authorization via Kubernetes resource configuration", "body": "Part of #7530\n\n## Summary\n\nEnable application-managed authorization roles where Access Control List (ACL) declarations are\nstored alongside artifacts in Kubernetes storage and GitOps storage. Authorization — which users\nhave which roles — is declared via Kubernetes resource configuration, making it fully\nGitOps-compatible, auditable, and declarative.\n\n## Motivation\n\nToday, Registry's authorization configuration requires either manual API calls or external\nidentity provider role mappings. For IT departments managing Registry as a Kubernetes-native\nservice, authorization should be:\n\n- **Declarat...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7533", "labels": ["type/enhancement", "impacts/documentation", "priority/high", "area/storage", "area/auth", "area/operator", "area/storage/gitops"], "created_at": "2026-03-11T13:00:57Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 7532, "title": "Kubernetes-native authentication support", "body": "Part of #7530\n\n## Summary\n\nAdd a new authentication handler that integrates with Kubernetes/OpenShift authentication\nmechanisms, allowing Registry to authenticate users via Kubernetes ServiceAccount tokens\nvalidated through the TokenReview API. This eliminates the requirement for an external OIDC\nprovider (e.g. Keycloak) when running Registry on Kubernetes.\n\n## Motivation\n\nOrganizations running Registry on Kubernetes already have an identity layer — Kubernetes\nServiceAccounts. Requiring an external OIDC provider adds infrastructure overhead and complexity.\nBy supporting Kubernetes-native authe...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7532", "labels": ["type/enhancement", "impacts/operator", "impacts/documentation", "priority/high", "area/auth", "area/operator"], "created_at": "2026-03-11T13:00:33Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 7530, "title": "EPIC: Kubernetes-Native Registry as a Service", "body": "## Summary\n\nEnable Apicurio Registry to be run as an internal IT service on Kubernetes, where an IT department\ncan declaratively provision data-isolated Registry instances for internal customers using\nKubernetes-native mechanisms — without requiring an external OIDC provider or manual configuration.\n\n## Motivation\n\nOrganizations running Kubernetes/OpenShift want to offer Apicurio Registry as an internal service.\nToday this requires:\n\n- **An external OIDC provider** (e.g. Keycloak) for authentication — adding infrastructure overhead\n and complexity for teams that already have Kubernetes Service...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7530", "labels": ["type/enhancement", "impacts/operator", "priority/high", "area/storage", "area/auth", "area/operator", "type/epic"], "created_at": "2026-03-11T12:20:59Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 7480, "title": "Production-ready GitOps storage for Apicurio Registry", "body": "# GitOps Storage for Apicurio Registry - Design Document\n\n## Table of Contents\n\n- [1. Introduction](#1-introduction)\n- [2. GitOps Approaches](#2-gitops-approaches)\n- [3. Use Cases](#3-use-cases)\n- [4. Current Status](#4-current-status)\n- [5. High-Level Architecture](#5-high-level-architecture)\n - [5.1 One-Way Synchronization](#51-one-way-synchronization)\n - [5.2 Sidecar Architecture](#52-sidecar-architecture)\n - [5.3 Pull and Push Models](#53-pull-and-push-models)\n - [5.4 Blue-Green Loading](#54-blue-green-loading)\n - [5.5 Multi-Repository Aggregation](#55-multi-repository-aggregation)\n- [6. D...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7480", "labels": ["impacts/operator", "impacts/documentation", "priority/high", "area/storage", "type/epic", "area/storage/gitops"], "created_at": "2026-03-03T17:20:13Z", "topic": "Git / Registry / Reference"}, {"number": 7478, "title": "Default topics from previous version were created with enforced defaults with kafkasql datasources for schema registries", "body": "## Description\n\n**Registry\nVersion**: 3.1.7\n**Persistence type**: kafkasql\n\nWhen upgrading from version 3.0.15 to version 3.1.7 of the schema registry app container, there is a new verification of the retention period on the topic for kafkasql backend for the schema registry, from [here](https://github.com/Apicurio/apicurio-registry/commit/85e0ec6d1664510d5338cd6eb87e6c760850dff3).\n\nSince this is being enforced, when the topic is created in the case where we are letting apicurio setup the default topic for kafkasql, let's set \"retention.ms\" and \"retention.bytes\" to -1 be default in that case.\n...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7478", "labels": ["type/bug", "priority/high", "area/documentation", "area/operator", "area/storage/kafkasql"], "created_at": "2026-03-03T15:43:08Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 7453, "title": "xRegistry: Conformance testing and documentation", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 8)\n\n## Summary\n\nValidate xRegistry specification compliance through conformance testing, comprehensive integration tests, and user-facing documentation.\n\n## Scope\n\n### 1. Conformance Testing\n\n- Investigate and run the [xRegistry conformance test suite](https://github.com/xregistry/spec) if available\n- Validate all MUST/SHOULD/MAY requirements from the specification\n- Create compliance matrix documenting supported vs. unsupported features\n- Test interoperability with other xRegistry implementations (if any exist)\n\n### ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7453", "labels": ["type/enhancement", "impacts/documentation", "priority/normal", "area/rest", "area/documentation", "area/QE"], "created_at": "2026-02-27T09:29:39Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7452, "title": "xRegistry: Advanced API features (PATCH, bulk ops, pagination, filtering)", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 7)\n\n## Summary\n\nImplement advanced xRegistry API features required for full specification compliance: PATCH support, bulk operations, Link header pagination, query parameters, and epoch-based concurrency control.\n\n## Features\n\n### 1. PATCH Support (JSON Merge Patch)\n\nxRegistry requires PATCH for partial updates using [JSON Merge Patch (RFC 7396)](https://tools.ietf.org/html/rfc7396).\n\n**Affected endpoints:**\n- `PATCH /` — Partial update registry root\n- `PATCH /` — Bulk partial update groups\n- `PATCH //{gid}` — Partial...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7452", "labels": ["type/enhancement", "priority/normal", "area/rest"], "created_at": "2026-02-27T09:29:09Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7451, "title": "xRegistry: Endpoint Registry extension", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 6)\n\n## Summary\n\nImplement the xRegistry Endpoint Registry extension, which provides a standardized way to describe network endpoints for asynchronous messaging. Endpoints can be abstract templates or concrete deployed instances.\n\n## Endpoint Structure\n\n```\n/endpoints — List/create endpoint groups\n/endpoints/{endpointId} — Get/update/delete endpoint group\n/endpoints/{endpointId}/definitions — List/create endpoint definitions\n/endpoints/{endpointId}/definitions/{defId} — Get/update/delete definition\n/endpoints/{endpoint...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7451", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/references"], "created_at": "2026-02-27T09:28:33Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7450, "title": "xRegistry: Message Definitions Registry extension", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 5)\n\n## Summary\n\nImplement the xRegistry Message Definitions Registry extension, which provides a standardized way to catalog asynchronous message definitions across protocols (AMQP, MQTT, HTTP, Kafka, NATS).\n\n## Endpoint Structure\n\n```\n/messagegroups — List/create message groups\n/messagegroups/{groupId} — Get/update/delete message group\n/messagegroups/{groupId}/messages — List/create messages\n/messagegroups/{groupId}/messages/{messageId} — Get/update/delete message\n/messagegroups/{groupId}/messages/{messageId}$details...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7450", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/storage", "area/references"], "created_at": "2026-02-27T09:27:54Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7449, "title": "xRegistry: Model Definition and Capabilities API", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 4)\n\n## Summary\n\nImplement the xRegistry model definition system and capabilities discovery API. The model is xRegistry's extensibility mechanism — it defines what group types, resource types, and custom attributes exist in the registry.\n\n## Endpoints\n\n```\nGET /capabilities — Feature discovery (supported features, flags, version modes)\nPUT /capabilities — Update capabilities (if mutable)\nGET /model — Full model definition (read-only, computed)\nGET /modelsource — Client-provided model customizations\nPUT /modelsource — U...", "url": "https://github.com/Apicurio/apicurio-registry/issues/7449", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/storage"], "created_at": "2026-02-27T09:19:45Z", "topic": "Xregistry / Model / Epoch"}, {"number": 7448, "title": "xRegistry: $details routing and xRegistry-* HTTP headers", "body": "## Parent Epic\n\nPart of #7445 — EPIC: xRegistry Specification Support (Phase 3)\n\n## Summary\n\nImplement the xRegistry dual-access pattern (`$details` suffix) and `xRegistry-*` HTTP response headers. This is a core xRegistry convention where:\n\n- `GET /schemagroups/g1/schemas/s1` → returns **raw document** (schema bytes) with metadata in HTTP headers\n- `GET /schemagroups/g1/schemas/s1$details` → returns **JSON metadata** about the schema\n\n## Th
