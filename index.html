ttps://quarkus.io/guides/security-authentication-mechanisms#form-auth) is a type of authentication mechanism where users log in through a web form rather than a ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4916", "labels": ["type/enhancement", "Beginner Friendly", "priority/low", "area/ui", "area/storage"], "created_at": "2024-07-23T10:10:33Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 4909, "title": "consolidate the doc attributes to avoid issues with versioning", "body": "review https://github.com/Apicurio/apicurio-registry/commit/b626efa67a00097e0f15638f8fb86a47e79a91d4\r\nfor opportunities to simplify\r\n\r\nconsolidate, eg `:ServiceRegistryURLVersion: {registry-version}`", "url": "https://github.com/Apicurio/apicurio-registry/issues/4909", "labels": ["area/documentation"], "created_at": "2024-07-18T13:38:18Z", "topic": "Updates / Operator"}, {"number": 4901, "title": "Support Confluent's Data Contracts features", "body": "https://docs.confluent.io/platform/7.6/schema-registry/fundamentals/data-contracts.html#\n\n```\nConfluent Schema Registry adds support for tags, metadata, and rules, which together support the\nconcept of a Data Contract. As a part of a Stream Governance solution, data contracts play a key role\nin ensuring data quality, data consistency, interoperability, and compatibility when sharing\ninformation across different systems or organizations.\n```", "url": "https://github.com/Apicurio/apicurio-registry/issues/4901", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/rest/ccompat", "version/3.x"], "created_at": "2024-07-16T14:25:31Z", "topic": "Schema / Type / Compatibility"}, {"number": 4893, "title": "Use SASL/PLAIN to log in to KafkaSQL storage backend", "body": "## Description\r\n\r\n**Registry\r\nVersion**: 2.5.8.Final\r\n**Persistence type**: kafkasql\r\n\r\nWe're trying to use our Kafka cluster as a persistence backend. Login to the cluster requires SASL/PLAIN via SSL. We try to set everything via env vars in the Pod that apicurio-registry is running in.\r\n\r\n### Environment\r\n\r\nRunning on Kubernetes 1.29.4\r\n\r\n### Steps to Reproduce\r\n\r\nWe set the following env vars:\r\n\r\n```\r\n - name: ENABLE_KAFKA_SASL\r\n value: \"true\"\r\n - name: REGISTRY_KAFKASQL_TOPIC\r\n value: \"apicurio-registry-kafkasql-journal\"\r\n - name: REGISTRY_KAFKASQL_TOPIC_AUTO_CREATE\r\n value: \"false\"\r\n - na...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4893", "labels": ["type/bug", "priority/normal", "area/storage", "version/3.x"], "created_at": "2024-07-16T13:07:16Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4877, "title": "Unmapped reference error for google import in protobuf schema ", "body": "## Description\r\nWhen adding a protobuf schema artifact with integrity check `ALL_REFS_MAPPED` enabled I get an \"unmapped reference\" violation exception because this reference is not specified. However the de-/serializers actually don't need that reference because they are importing the google referenced by themselves.\r\n\r\n\r\n### Environment\r\n**Registry Version**: 2.5.5\r\n**Persistence type**: kafkasql\r\n\r\nRegistry is running with the Apicurio Operator in Openshift 4.14 / K8s v1.27.13\r\n\r\n### Steps to Reproduce\r\n\r\n1. Create protobuf schema with a google import\r\n```\r\nsyntax = \"proto3\";\r\n\r\nimport \"goo...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4877", "labels": ["type/bug", "priority/normal", "area/rules"], "created_at": "2024-07-11T05:38:40Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 4866, "title": "Create a BOM for projects dependent on Registry", "body": "See https://redhat-internal.slack.com/archives/C06AM3MTS8J/p1720513016429909", "url": "https://github.com/Apicurio/apicurio-registry/issues/4866", "labels": ["type/enhancement", "version/3.x", "version/2.6.x"], "created_at": "2024-07-09T10:17:48Z", "topic": "Uncategorized"}, {"number": 4859, "title": "GH release notes for 2.6.x contain old issues", "body": "Generation of GH release notes does not seem to work properly on 2.6.x, investigate.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4859", "labels": ["type/bug", "version/2.6.x"], "created_at": "2024-07-08T10:41:48Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 4837, "title": "Add option to supply oauth scopes for kafka auth", "body": "### Feature or Problem Description\r\n\r\nYou are currently only able to supply client id, client secret and token endpoint when using sasl mechanism OAUTHBEARER.\r\nHowever many identity providers requires you to supply a specific set of scopes to get a token with the desired claims.\r\n\r\n### Proposed Solution\r\n\r\nA \"apicurio.kafkasql.security.sasl.scope\" config parameter in https://github.com/Apicurio/apicurio-registry/blob/main/app/src/main/java/io/apicurio/registry/storage/impl/kafkasql/KafkaSqlFactory.java \nAnd possibly other configurations which can be used in the LoginCallbackHandler. For refere...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4837", "labels": ["type/enhancement", "priority/normal", "area/storage", "version/3.x"], "created_at": "2024-07-01T12:51:10Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 4828, "title": "Run npm audit fix / npm audit fix --force in a GH workflow", "body": "Run npm audit fix / npm audit fix --force in a GH workflow to automatically attempt to address vulnerabilities.\r\n\r\nCC @EricWittmann", "url": "https://github.com/Apicurio/apicurio-registry/issues/4828", "labels": ["type/enhancement", "area/ui"], "created_at": "2024-06-27T10:09:46Z", "topic": "Uncategorized"}, {"number": 4801, "title": "Update SDK generation documentation for v3", "body": "Currently, navigate to 'Version metadata' and generate.\r\n\r\nChange flow to choose version and then 'Generate'.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4801", "labels": ["type/task", "priority/normal", "area/documentation"], "created_at": "2024-06-18T16:34:09Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 4787, "title": "New REST API endpoint:  `/system/diagnostics`", "body": "This endpoint would return information useful in a support \"must gather\" tool.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4787", "labels": ["area/rest"], "created_at": "2024-06-17T14:03:49Z", "topic": "Uncategorized"}, {"number": 4784, "title": "Create \"virtual artifact\" feature, allowing redirects/linking functionality", "body": "This feature is to allow users to create a virtual artifact or version that links to an actual artifact/version. The main use-case is to recover from deleted content. When deleting a version (for example) the content at a given globalId will be gone from the registry. If kafka messages exist that refer to that globalId, they will be impossible to consume because the schema at the globalId will be missing.\n\nThis feature will allow users to fix the problem by re-registering the missing schema and then creating a virtual link from the old globalId to the new one.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4784", "labels": ["priority/normal", "area/storage", "version/3.x"], "created_at": "2024-06-17T13:55:29Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4758, "title": "Test update artifact /groups/{groupId}/artifacts/{artifactId}/test fails when artifact is using references that are not urls", "body": "## Description\r\n\r\n**Registry\r\nVersion**: Release\r\n**Persistence type**: SQL\r\n\r\n\r\n\r\n### Environment\r\n\r\nIts running in an Azure App Service which is pulling the image from apicurio/apicurio-registry-sql:latest-release\r\n\r\n### Steps to Reproduce\r\n\r\nUsing JSON schemas\r\n\r\nI created a schema following the instructions on this page https://github.com/Apicurio/apicurio-registry/blob/fe0d5d59fb16b5ea15c15d1390c681c3346a2b05/docs/modules/ROOT/partials/getting-started/proc-managing-artifact-references-using-rest-api.adoc#L109\r\n\r\nWhen I try the Test with a JSON schema which contains a reference I get the e...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4758", "labels": ["type/bug", "area/rules/compatibility", "area/rest", "area/storage", "area/rules"], "created_at": "2024-06-10T17:59:01Z", "topic": "Schema / Type / Compatibility"}, {"number": 4724, "title": "Authentication with schema registry using Strimzi-Generated scram-sha-512 credentials", "body": "### Feature or Problem Description\r\n\r\nA schema registry is a common companion to a Kafka deployment. [Strimzi](https://strimzi.io/) is a project that provides a set of operators for running Kafka on Kubernetes. One of the nice features offered by Strimzi is the ability to provision Kafka users using the `KafkaUser` custom resource. One way to authenticate with Kafka would be using SCRAM-SHA-512 credentials (username and password). Strimzi generates these credentials and places them in a secret. It would be nice if we could re-use these credentials to also authenticate with the schema registry....", "url": "https://github.com/Apicurio/apicurio-registry/issues/4724", "labels": ["type/enhancement", "priority/normal", "area/auth"], "created_at": "2024-05-31T15:09:36Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 4723, "title": "Search API count query takes a lot of db time", "body": "## Description\r\n\r\n**Registry\r\nVersion**: 2.5.7\r\n**Persistence type**: sql - postgres 13\r\n\r\nWe have noticed during review of db query metrics that one particular query which accounts for about 10% of all queries is taking over 95% of the database's time - the count query in searchArtifacts()\r\n\r\nhttps://github.com/Apicurio/apicurio-registry/blob/1b63b543fdff174c1f1e9c20c4840c2c957c77e4/app/src/main/java/io/apicurio/registry/storage/impl/sql/AbstractSqlRegistryStorage.java#L1397\r\n\r\n\r\n\r\n\r\n\r\n\r\nWe are not even using the outcome of this \"count\" query, only the results themselves. If the query can't b...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4723", "labels": ["type/bug", "priority/high", "area/storage"], "created_at": "2024-05-31T13:21:18Z", "topic": "Search / Query / Count"}, {"number": 4708, "title": "Unable to connect to AWS MSK with IAM auth ", "body": "## Description\r\n\r\nUsing the docker image apicurio/apicurio-registry-kafkasql:2.5.10.Final\r\n\r\n I'm trying to connect to the amazon msk with IAM authentication enabled\r\n \n \n Docker command\r\n ```\r\ndocker run -it -d \\\r\n --env KAFKA_BOOTSTRAP_SERVERS= \\\r\n --env\r\nREGISTRY_KAFKA_COMMON_SASL_CLIENT_CALLBACK_HANDLER_CLASS=software.amazon.msk.auth.iam.IAMClientCallbackHandler \\\r\n --env REGISTRY_KAFKA_COMMON_SASL_MECHANISM=AWS_MSK_IAM \\\r\n --env REGISTRY_KAFKA_COMMON_SECURITY_PROTOCOL=SASL_SSL \\\r\n --env REGISTRY_KAFKA_COMMON_SASL_JAAS_CONFIG=\"software.amazon.msk.auth.iam.IAMLoginModule required;\" \\\r\n \n```...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4708", "labels": ["type/bug", "area/rules/compatibility", "area/rest", "area/storage"], "created_at": "2024-05-28T11:54:58Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4707, "title": "Make kafka connect converters compatible with `ServiceLoad` mode of `plugin.discovery`", "body": "### Feature or Problem Description\r\n\r\nMake kafka connect [converters](https://github.com/Apicurio/apicurio-registry/tree/main/utils/converter/src/main/java/io/apicurio/registry/utils/converter) (and in general components) compatible with `ServiceLoad` mode of `plugin.discovery`. \n\r\n### Proposed Solution\r\n\r\n[Here](https://kafka.apache.org/documentation.html#connect_plugindiscovery_migratesource) is describe how to migrate to support `ServiceLoad` mode. In a nut shell a specific descriptor file must be added to `META-INF/services/` folder of the released jar.\r\n\r\n### Additional Context\r\n\r\nHere is...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4707", "labels": ["type/enhancement", "area/serdes", "version/3.x"], "created_at": "2024-05-28T10:33:05Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4499, "title": "Evaluate Enhancements for FIPS Compatibility", "body": "We are exploring enhancements to align with FIPS standards, reflecting the growing emphasis on compliance within middleware products.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4499", "labels": ["version/3.x"], "created_at": "2024-03-28T16:09:52Z", "topic": "Schema / Type / Compatibility"}, {"number": 4446, "title": "Some api methods are not authorized behind https reverse proxy", "body": "## Description\r\nWhen behind https reverse proxy, GET request are autorized, all other methods are not.\r\n\r\n**Registry\r\nVersion**: 2.5.8.Final \n**Persistence type**: sql \n\r\n\r\n\r\n### Environment\r\nJAVA_HOME=/usr/lib/jvm/java-17\r\nKEYCLOAK_URL=https://keycloak.xxx.xxx/auth\r\nKEYCLOAK_REALM=registry\r\nREGISTRY_APIS_V2_DATE_FORMAT=yyyy-MM-dd'T'HH:mm:ss'Z'\r\nREGISTRY_UI_CONFIG_APIURL=https://apicurio.xxx.xxx:443/apis/registry\r\nREGISTRY_UI_CONFIG_UIURL=https://apicurio.xxx.xxx:443/ui\r\nREGISTRY_LOG_LEVEL=DEBUG\r\nREGISTRY_URL_OVERRIDE_PORT=443\r\nREGISTRY_URL_OVERRIDE_HOST=apicurio.xxx.xxx\r\nREGISTRY_AUTH_ENABLED...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4446", "labels": ["type/bug", "area/rules/compatibility", "area/rest", "area/storage", "area/rules"], "created_at": "2024-03-15T09:25:51Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 4289, "title": "Command Line tool to create kafkasql topic dump", "body": "We need a standardized way of getting topic dumps for reproducing issues.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4289", "labels": ["type/enhancement", "area/storage"], "created_at": "2024-02-01T15:36:56Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4238, "title": "UI shows edit operations when it shouldn't when Owner Only access control is enabled", "body": "## Description\r\n\r\n**Registry Version**: All\r\n**Persistence Type**: All\r\n\r\nWhen owner-only access is enabled, the UI doesn't properly hide edit operations from users who shouldn't have access to those operations. The `IfAuth` UI guard should be checking whether owner-only access is enabled and doing a slightly different check in the impl when it is. Currently it doesn't, so users with Dev access will see edit operations for artifacts they don't own. Those operations will FAIL if they try them (good) but the UI should know enough to hide them.\r\n\r\n### Environment\r\nAll\r\n\r\n### Steps to Reproduce\r\n1...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4238", "labels": ["type/bug", "priority/low", "area/ui", "area/auth"], "created_at": "2024-01-22T20:14:49Z", "topic": "Grants / Access / Permissions"}, {"number": 4203, "title": "Enhance of search engine", "body": "### Feature or Problem Description\r\n\r\nCurrently, managing and filtering through a large number of schemas, specifically when dealing with over 10,000 schemas, can be quite challenging due to the limitations of the existing search feature. At the moment only searches by name, labels, group, description, globalId, contentId. You need to search for the exact case sensitive text value, without the possibility of hints, whispers, or wildcard searches.\r\n\r\n### Proposed Solution\r\n\r\nEnhance search with wildcard search, add case-insensitive search. Ideally implement full-text search.\r\nJoint search. If w...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4203", "labels": ["type/enhancement", "priority/normal", "area/rest", "area/storage"], "created_at": "2024-01-12T11:15:11Z", "topic": "Search / Query / Count"}, {"number": 4137, "title": "Create step for building the project in CI workflows and share the artifacts across jobs.", "body": "Currently, when a project build is required, we're building the project over and over and over (like in the Python sdk job or the new Go sdk job). We must start considering having a job that build the project and sharing the artifacts across all the jobs.", "url": "https://github.com/Apicurio/apicurio-registry/issues/4137", "labels": ["type/enhancement", "area/ui"], "created_at": "2023-12-18T08:18:16Z", "topic": "Git / Registry / Reference"}, {"number": 4136, "title": "Content of an AVRO schema is shown wrong in the UI", "body": "Somehow the AVRO schema is modified when shown on the UI. This leads to problems when a consumer copies the schema content from the UI and uses it with Confluents `SpecificAvroDeserializer` (No artifact with ID 'test-topic-value' in group 'null' found 40401).\r\n\r\n### Steps to Reproduce\r\n1. Create artifact test-topic-value in group default:\r\n```\r\n{\r\n \"type\": \"record\",\r\n \"name\": \"TestSchema\",\r\n \"namespace\": \"com.test\",\r\n \"fields\": [\r\n {\r\n \"name\": \"test\",\r\n \"type\": \"double\",\r\n \"example\": 1.0\r\n }\r\n ]\r\n}\r\n```\r\n\r\n2. Check the content in the UI -> `.0` in the example is missing:\r\n```\r\n{\r\n \"type\": \"rec...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4136", "labels": ["type/bug", "area/ui"], "created_at": "2023-12-18T06:26:28Z", "topic": "Schema / Type / Compatibility"}, {"number": 4121, "title": "Kafka Deserializer that can consume messages produced by e.g. ExtJsonConverter", "body": "### Feature or Problem Description\r\nWhen using Debezium + Registry, the converter/connector produces messages on the Kafka topic in a specific format. This format includes the schemaId and the payload, both wrapped in a JSON envelope. We can consume that message in the context of the converter, but we don't have a standard Kafka deserializer that can do it. Our current deserializers only handle formats produced by our serializers (for obvious reasons).\r\n\r\n### Proposed Solution\r\nCreate a new (or enhance an existing) deserializer that can consume a kafka message when formatted by our DBZ connect...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4121", "labels": ["type/enhancement", "area/serdes"], "created_at": "2023-12-13T13:53:10Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 4111, "title": "export StorageMetricsStore as prometheus metrics", "body": "### Feature or Problem Description\r\n\r\nwe want to provide usage metrics to our tenants of schema registry - we are planning on using groups as the tenancy unit.\r\n\r\nright now we are having to scrape the rest api at intervals to publish metrics about # of artifacts, # of artifact versions, size of artifacts per group. this seems pretty wasteful and will be scale linearly when we have a large number of groups onboard.\r\n\r\nIn io.apicurio.registry.storage.metrics.StorageMetricsStore these figures are being collected and used for quota enforcement. Can these also be exported into the prometheus metric...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4111", "labels": ["type/enhancement", "area/rest", "area/storage"], "created_at": "2023-12-08T15:00:30Z", "topic": "Git / Registry / Reference"}, {"number": 4087, "title": "Registry 3.0: Restore data migration tests", "body": "The data migration tests have been disabled temporarily. The reason is that we will not support automated data migration from 2.x to 3.0. Those tests are designed to test the automatic database upgrades. So we need to re-enable them once we have a version of 3.0 that can be used as the \"base\" for those tests.\r\n\r\nThe two tests in question are:\r\n\r\n* DoNotPreserveIdsImportIT\r\n* DataMigrationIT", "url": "https://github.com/Apicurio/apicurio-registry/issues/4087", "labels": ["area/storage"], "created_at": "2023-12-05T12:10:40Z", "topic": "Updates / Operator"}, {"number": 4076, "title": "Compatibility not set when using the CCOMPAT API ", "body": "## Description\r\n\r\nConfiguring the schema compatibility via ccompat/v6 API seems not to be working.\r\n\r\n**Registry\r\nVersion**: 2.4.14. Final\r\n**Persistence type**: kafkasql\r\n\r\n\r\n### Environment\r\nopenshift_container_platform v4.11\r\nKubernetes v1.24.12+ceaf338\r\n\r\n### Steps to Reproduce\r\n\r\n\r\n1. set compatability using the ccompat REST API {APICURIO_REGISTRY_URL}/apis/ccompat/v6/config/{schema_name} -> set to compatibility NONE\r\n2. check the compatibility via ccompat REST API using curl-> it will show the set compatibility (in my case NONE)\r\n3. check the compatbility via the apicurio UI and the comp...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4076", "labels": ["type/bug", "area/rules/compatibility", "area/rest", "area/storage"], "created_at": "2023-12-01T09:21:04Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 4043, "title": "Automated formatting and comment cleanup", "body": "- Add automated code formatter\r\n- Remove @author JavaDoc comments, since they are used inconsistently and attribution is already recorded in git\r\n- Remove copyright comments, the license in in the repo", "url": "https://github.com/Apicurio/apicurio-registry/issues/4043", "labels": ["Beginner Friendly", "version/3.x"], "created_at": "2023-11-27T19:05:10Z", "topic": "Uncategorized"}, {"number": 4025, "title": "Allow user to specify Avro namespace in conversion", "body": "### Feature or Problem Description\r\n\r\nTher namespave is hard coded in AvroData.java \n`public static final String NAMESPACE = \"io.confluent.connect.avro\";`\r\n\r\nThis means that all the content has a namespace with the above or that followed by a number\r\n\r\n### Proposed Solution\r\n\r\nAllow the user to override the namespace in configuration - maybe to use the ways of naming specific to their organisation \n\r\n### Additional Context", "url": "https://github.com/Apicurio/apicurio-registry/issues/4025", "labels": ["type/enhancement", "Beginner Friendly", "area/serdes"], "created_at": "2023-11-22T17:03:23Z", "topic": "Avro / Schema / Java"}, {"number": 4017, "title": "Restrict cipher suites and TLS protocol versions", "body": "### Feature or Problem Description\r\n\r\nWhen running Apicurio in my enterprise environment, it needs to pass a pentest. They will check that no SSL/TLS versions are used which are considered insecure, so anything below TLSv1.2 is out.\r\n\r\n### Proposed Solution\r\n\r\nI would like to have the option to configure Apicurio so that only TLSv1.2 and TLSv1.3 are offered to clients connecting to either API or GUI.\r\nAdditionally, I would like to restrict the available cipher suites, analagously to the Kafka setting `ssl.cipher.suites`.\r\n\r\nI didn't find anything in the docs, so I assume that this is not possi...", "url": "https://github.com/Apicurio/apicurio-registry/issues/4017", "labels": ["type/enhancement", "Beginner Friendly", "area/ui"], "created_at": "2023-11-21T14:35:43Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 3967, "title": "Cross OpenAPI schema validation and processing", "body": "### Feature or Problem Description\r\n\r\nI'm investigating if Apicurio can have capabilities across multiple artifacts.\r\n\r\nFor example, I have Service A and Service B. \nEach has different lifecycles and are updated separately.\r\n\r\nI would like to have a way to:\r\n\r\n- Validate both OpenAPI (check if paths aren't overriding each other)\r\n- Produce Gateway Schema based on the Service A and Service B \n - Based on the updates on Service A and Service B I would like to produce a new gateway schema.\r\n\r\nSo far I do not see any way to do this apart from building another layer on top of Apicurio (catching pre...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3967", "labels": ["type/enhancement"], "created_at": "2023-11-13T11:23:48Z", "topic": "Uncategorized"}, {"number": 3910, "title": "Allow comparison between embedded java schemas vs apicurio schemas without java specific attributes (avro.java.string)", "body": "### Feature or Problem Description\r\n\r\nThis feature is related to #1592 .\r\nIn our case we are using Kafka together with Apicurio but I believe more cases apply.\r\n\r\nWhen generating java classes from Avro schemas there will be a schema(represented as a string) embedded in the class.\r\nIf you generated your java classes using\r\n\r\n```\r\n \n org.apache.avro\r\n avro-maven-plugin\r\n ${avro.version}\r\n \n \n generate-sources\r\n \n schema\r\n \n \n ${project.basedir}/src/main/resources/schemas\r\n \n **/*.avsc\r\n \n ${project.build.directory}/generated-sources/schemas\r\n String\r\n \n \n \n \n```\r\n\r\nThe schema in the generated cl...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3910", "labels": ["type/enhancement", "area/serdes"], "created_at": "2023-11-01T20:55:59Z", "topic": "Avro / Schema / Java"}, {"number": 3810, "title": "Using Apicurio AvroConverter with Kafka Connect does not support BACKWARD compatibility", "body": "## Description\r\n\r\n**Registry\r\nVersion**: 2.4.7\r\n**Persistence type**: sql\r\n\r\n\r\n\r\n### Environment\r\n\r\nTrying to replace Confluent Schema Registry with Apicurio in a setup with [with Confluent's Amazon S3 Sink Connector Plugin](https://docs.confluent.io/kafka-connectors/s3-sink/current/overview.html), in an environment where multiple versions of the same Avro schema will appear on the Kafka topic. \n\r\nIn order to cope with this, we set the following S3 Connector property\r\n\r\n```\r\nschema.compatibility=BACKWARD\r\n```\r\n\r\nWith [this setting](https://docs.confluent.io/kafka-connectors/s3-sink/current/ove...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3810", "labels": ["type/bug", "area/rules/compatibility", "area/storage"], "created_at": "2023-10-12T19:20:13Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 3762, "title": "Protobuf external references breaking inside docker container", "body": "## Description\r\n\r\n**Registry Version**: 2.4.11.Final and 2.4.12.Final\r\n**Persistence type**: Tested in both `kafkasql` and `mysql`\r\n\r\nI am trying to take advantage of schema references for my protobuf schemas using the `/apis/registry/v2/groups/{groupId}/artifacts?ifExists=RETURN_OR_UPDATE` resource, and am getting back a 409 \"unable to find\" for the schemas references inside of the docker container. As expected, I am registering the child references first. Oddly, I went to debug this with the jar, using the same build tag and the schemas register fine with the same requests. I have verified t...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3762", "labels": ["type/bug", "area/rules/compatibility", "area/storage", "area/rules", "area/references"], "created_at": "2023-10-04T16:29:43Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 3691, "title": "Overwriting of ClusterRoleBinding When Deploying apicurio-registry-operator in Multiple Namespaces", "body": "When deploying a second instance of `apicurio-registry-operator` into a new `namespace`, the associated `ClusterRoleBinding` gets overwritten rather than being additive. That is to say, the `ServiceAccounts` in the `ClusterRoleBinding` are replaced rather than being additionally appended.\r\n\r\nExample:\r\n\r\nAfter deploying in `NAMESPACE1`, the state of the `ClusterRoleBinding` is:\r\n\r\n```\r\nNAME ROLE AGE USERS GROUPS SERVICEACCOUNTS\r\napicurio-registry-operator-rolebinding ClusterRole/apicurio-registry-operator-role NAMESPACE1/apicurio-registry-operator\r\n```\r\n\r\nSubsequently, when deployed in `NAMESPA...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3691", "labels": ["type/bug"], "created_at": "2023-09-26T13:48:28Z", "topic": "Updates / Operator"}, {"number": 3662, "title": "Apicurio registry 2.4.3 and 2.4.4 causes endless rebalance loop on Kafka", "body": "Apicurio version: 2.4.3 and 2.4.4\r\nOpenshift version: 4.12\r\nKafka version: 3.4.0, 3.5.0\r\nPersistent type: kafkasql\r\nConvertor: SerdeAvro\r\n\r\nThe issue is reproducible when running the Debezium test suite against openshift 4.12. The test suite uses installation via OLM so you have to make the necessary changes that would allow you to install the operator via operator bundle to hit the issue.\r\n\r\nOnce tests connect the consumer to the plain listener on Kafka (the same one that Apicurio uses) the consumer falls into an endless rebalance loop. We have tried version 2.3.0, 2.4.0, 2.4.1, 2.4.2, 2.4.3,...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3662", "labels": ["type/bug", "priority/high", "priority/blocker", "area/storage", "version/3.x"], "created_at": "2023-09-15T11:07:47Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 3602, "title": "Java Client Lib unable to fetch existing schema from registry when producing a message", "body": "**Registry Version**: 2.3.1 | Same observed in 2.4.1\r\n\r\n### Steps to Reproduce\r\nSome producer specifics:\r\napicurio.registry.as-confluent = true\r\napicurio.registry.headers.enabled = false\r\napicurio.registry.artifact-resolver-strategy = \"io.apicurio.registry.serde.strategy.TopicIdStrategy\"\r\napicurio.registry.use-id = \"globalId\"\r\nI'm not sure if this has any effect but we're also using custom partitioner.class\r\nThis Topic is also using another schema as a key. \n\r\n1. Define schema with child record:\r\n```json\r\n{\r\n \"type\": \"record\",\r\n \"name\": \"TestAvro\",\r\n \"namespace\": \"test.avro\",\r\n \"fields\": [\r\n {...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3602", "labels": ["type/bug", "area/serdes"], "created_at": "2023-08-25T12:50:14Z", "topic": "Uncategorized"}, {"number": 3523, "title": "Implement integration tests for the Kiota client generation", "body": "### Feature or Problem Description\r\n\r\nThe \"client generation\" feature relies on compiling Kiota with wasm as a compilation target.\r\nSo far we have been relying on the fact that the upstream Blazor integration would have caught issues early.\r\nAccording to [this conversation](https://github.com/microsoft/kiota/issues/2152#issuecomment-1645927873) this part of the code has been removed from the project and we should have some sort of E2E test to verify that client code generation still works.\r\nNice to have: the update to the latest Kiota versions should be automated.\r\n\r\n### Proposed Solution\r\n\r\nI...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3523", "labels": ["type/enhancement", "type/task", "priority/low", "area/ui"], "created_at": "2023-07-21T16:57:18Z", "topic": "Graphql / Federation / Xml"}, {"number": 3485, "title": "Gradle plugin with functionality equivalent to the Maven plugin", "body": "### Feature or Problem Description\r\nThere is a community gradle plugin here: https://github.com/croz-ltd/apicurio-registry-gradle-plugin\r\n\r\nPerhaps it's worth asking for a contribution and taking on long term maintenance to make it official.\r\n\r\n### Additional Context\r\nNot sure if the author is interested in contributing it. We originally found out about it from this context:\r\n\r\n* https://github.com/croz-ltd/apicurio-registry-gradle-plugin/pull/16\r\n\r\n### Implementation details\r\nIt may be possible to publish a Gradle plugin out of a maven build:\r\n\r\nhttps://github.com/fabric8io/kubernetes-client/...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3485", "labels": ["type/enhancement", "priority/normal", "area/ui"], "created_at": "2023-07-03T18:01:06Z", "topic": "Uncategorized"}, {"number": 3399, "title": "exploration - 0 downtime rolling restarts and how to find them", "body": "### Feature or Problem Description\r\n\r\nWe should explore how to configure Registry to support 0 downtime rolling restarts without downtime.\r\n\r\nQuarkus handles [graceful terminations](https://quarkus.io/guides/lifecycle#graceful-shutdown) but we should ensure how this behaves with the Kafka client as well.", "url": "https://github.com/Apicurio/apicurio-registry/issues/3399", "labels": ["type/enhancement", "priority/normal"], "created_at": "2023-05-30T14:35:16Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 3369, "title": "Documentation tab makes unauthenticated requests for referenced schemas", "body": "## Description\r\n\r\n**Registry Version**: 2.4.2.Final\r\n**Persistence type**: sql\r\n\r\n\r\n\r\n### Environment\r\n\r\nRunning Apicurion in Kubernetes behind ingress controller. Apicurio configured with oidc authentication with Keycloak as IdP. Relevant environment vars:\r\n\r\n### Steps to Reproduce\r\n\r\n1. Upload Avro Artifact to test-ref group. I used this example artifact:\r\n\r\n```json\r\n{\r\n \"type\": \"record\",\r\n \"name\": \"SomeRecord\",\r\n \"namespace\": \"com.example\",\r\n \"doc\": \"Yaba, daba, doo\",\r\n \"fields\": [\r\n {\r\n \"name\": \"field\",\r\n \"type\": \"string\",\r\n \"doc\": \"A string field\"\r\n }\r\n ]\r\n}\r\n```\r\n\r\n2. Upload AsyncAPI art...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3369", "labels": ["type/bug", "area/ui", "area/storage"], "created_at": "2023-05-24T12:20:31Z", "topic": "Uncategorized"}, {"number": 3303, "title": "ccompat: support mode per subject", "body": "### Feature or Problem Description\r\nCurrently ccompat doesn't support POST/DELETE/GET of mode per subject. Confluent schema registry API: https://docs.confluent.io/platform/current/schema-registry/develop/api.html#get--mode-(string-%20subject)\r\nMode is only supported for the whole registry.\r\n\r\n### Proposed Solution\r\n\r\nImplement POST/DELETE/GET per subject for ccompat.\r\n\r\n### Additional Context\r\n\r\nI use Apicurio together with Quarkus in dev/test mode. It would be nice if I could run tests locally against Apicurio and don't need to set up my own confluent schema registry.", "url": "https://github.com/Apicurio/apicurio-registry/issues/3303", "labels": ["type/enhancement", "priority/normal", "area/rest/ccompat"], "created_at": "2023-05-01T11:31:11Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 3196, "title": "Registry should fail to start up in kafkasql mode if the topic is mis-configured", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/3196", "labels": ["priority/normal", "area/storage"], "created_at": "2023-03-15T13:59:30Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 3115, "title": "Enable documentation tab for GraphQL and Avro", "body": "### Feature or Problem Description\r\n\r\nEnable a documentation tab for all types of APIs. When an OpenAPI API is registered, the external_docs information block is examined and a documentation tab is added that displays the external content. When another API is registered, the documentation tab is not displayed and there doesn't appear to be an API to add it.\r\n\r\n### Proposed Solution\r\n\r\nMost users have documentation about their APIs already created somewhere (Confluence, Sharepoint) that would add value to their Apicurio repository by clarifying the design and intended use of that API. The docum...", "url": "https://github.com/Apicurio/apicurio-registry/issues/3115", "labels": ["type/enhancement", "priority/low", "area/ui"], "created_at": "2023-01-30T23:07:42Z", "topic": "Git / Registry / Reference"}, {"number": 3085, "title": "Add generated information about authorization to the API schema and docs.", "body": "Process authorization annotations e.g. https://github.com/Apicurio/apicurio-registry/blob/main/app/src/main/java/io/apicurio/registry/rest/v2/GroupsResourceImpl.java#L167 to create a table equivalent to this https://www.apicur.io/registry/docs/apicurio-registry/2.3.x/getting-started/assembly-configuring-the-registry.html#all-registry-configs_registry .", "url": "https://github.com/Apicurio/apicurio-registry/issues/3085", "labels": ["type/enhancement", "priority/normal", "area/documentation"], "created_at": "2023-01-16T14:09:33Z", "topic": "Grants / Access / Permissions"}, {"number": 3061, "title": "Protobuf Converter support", "body": "For Kafka Connect, Confluent provides a `ProtobufConverter`. Could we be seeing something similar for Apicurio?", "url": "https://github.com/Apicurio/apicurio-registry/issues/3061", "labels": ["type/enhancement", "Beginner Friendly", "priority/normal", "area/serdes"], "created_at": "2022-12-24T11:21:52Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 2796, "title": "Apicurio 2.0.3 : ccompat/v6 bad version return", "body": "Hi guys, \n\r\nI have a question about the version management inside the apicurio registry. Inside the `\"version\":` field, we are free to set any alphanumeric character. As you can see below, we have the version 1 and 3 which are a string. \n\r\n```bash\r\ncurl http://dev.company.com/apis/registry/v2/groups/default/artifacts/com.compagny.movie/versions | jq\r\n{\r\n \"count\": 2,\r\n \"versions\": [\r\n {\r\n \"name\": \"company-movie\",\r\n \"description\": \"super movie avro\",\r\n \"createdOn\": \"2022-09-14T13:29:20+0000\",\r\n \"createdBy\": \"\",\r\n \"type\": \"AVRO\",\r\n \"labels\": [\r\n \"avro\",\r\n \"kafka\"\r\n ],\r\n \"state\": \"ENABLED\",\r\n \"glo...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2796", "labels": ["priority/high", "area/rest"], "created_at": "2022-09-15T07:08:35Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 2760, "title": "Change how owner-only auth works when group owner and artifact owner differ", "body": "It is possible (especially with the new Change Owner feature) that an artifact owned by User A may exist inside a group owned by User B. In that case, we need to clarify the rules around editing and deleting the artifact.\r\n\r\nWe've decided that, in this use case, the group owner will have full permissions on the artifact, including Read, Write, and Delete.\r\n\r\nThe artifact owner will have permission to Read, Write, but **not** Delete.", "url": "https://github.com/Apicurio/apicurio-registry/issues/2760", "labels": ["impacts/documentation", "priority/normal", "area/rules", "area/auth"], "created_at": "2022-09-07T13:27:09Z", "topic": "Grants / Access / Permissions"}, {"number": 2736, "title": "Improve artifact search to allow filtering by owner", "body": "We should allow filtering artifacts by ownership (aka `created_by` or `createdBy`).\r\n\r\nThis would enable a CLI tool to be able to find all artifacts owned by one user and transfer ownership to another user. Useful as a solution to the \"Chris got hit by a bus\" scenario (or less gruesomely known as the \"Chris just quit to work for Apple\" scenario) when also using the \"Owner only authorization\" feature.", "url": "https://github.com/Apicurio/apicurio-registry/issues/2736", "labels": ["type/enhancement", "priority/normal", "area/ui", "area/storage"], "created_at": "2022-08-29T16:34:50Z", "topic": "Grants / Access / Permissions"}, {"number": 2720, "title": "Metadata attribute configurable by Admin as mandatory", "body": "I'm trying to come up with some governance process for artifact creation and maintenance in Registry.\r\nNow this attribute metadata is very good option to capture additional metadata details. That will help for search and adoption.\r\nNow as this feature is free for all developer role to update hence we've to keep a review option before any upload to enforce and ensure certain properties (like Dept name, product id ,channel detail etc) are added by teams.This way all artifacts will be consistant.\r\n \nIt would be much better if we have options so that Admin can create and add few properties (making...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2720", "labels": ["type/discussion", "area/rest", "area/rules"], "created_at": "2022-08-24T15:12:23Z", "topic": "Git / Registry / Reference"}, {"number": 2675, "title": "Schema converter support", "body": "It is time-consuming because we have to deal with json-schema for open api spec, Avro for Kafka, and another schema for Prptbuf. \nI wonder if it would be possible to add a function to be able to convert each schema information.", "url": "https://github.com/Apicurio/apicurio-registry/issues/2675", "labels": ["type/enhancement", "priority/normal"], "created_at": "2022-08-04T01:29:55Z", "topic": "Uncategorized"}, {"number": 2657, "title": "Document the development workflow for making changes to the API", "body": "This project is using Apicurio Studio to generate Java code from the OpenApi specification.\r\nTo help new contributors on board in the project we might consider describing the development workflow in the `CONTRIBUTING.md` file.\r\n\r\nI miss some context for doing it myself:\r\n- should we use a \"fixed\" version of Apicurio Studio?\r\n- should we provide a link to one of the publicly available instances online?\r\n- should we provide steps for local development too? (e.g. spinning the Studio locally)", "url": "https://github.com/Apicurio/apicurio-registry/issues/2657", "labels": ["type/task", "priority/normal"], "created_at": "2022-07-27T11:41:14Z", "topic": "Git / Registry / Reference"}, {"number": 2601, "title": "Unable to add Optional fields when we enable Full compatibility for JSON Schema ", "body": "Hi Team,\r\n\r\nPlease find the below steps to reproduce the issue.\r\n1. Upload below JSON Schema.\r\n```json\r\n{\r\n \"$id\": \"https://test.com/obj_test.schema.json\",\r\n \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r\n \"$ref\": \"#/definitions/obj_test\",\r\n \"definitions\": {\r\n \"obj_test\": {\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"id\": {\r\n \"type\": \"string\"\r\n },\r\n \"attnOf\": {\r\n \"description\" : \"Attention of\",\r\n \"type\": \"string\"\r\n },\r\n \"recVersion\": {\r\n \"type\": \"integer\"\r\n }\r\n }\r\n }\r\n }\r\n}\r\n```\r\n2. Enable Full Compatibility. \n3. Try to upload the below new version. \n```json\r\n{\r\n \"$id\": \"https://test.com/...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2601", "labels": ["type/question", "priority/normal"], "created_at": "2022-06-30T15:04:33Z", "topic": "Schema / Type / Compatibility"}, {"number": 2689, "title": "Support for JSON schema draft 2020-12, 2019-09", "body": "Hi apicurio team\r\n\r\ni tried to create/upload an artifact with following JSON schema\r\n```\r\n\r\n{\r\n \"$id\": \"https://lalal.com/v2.test.json\",\r\n \"$schema\": \"https://json-schema.org/draft/2019-09/schema\",\r\n \"description\": \"A representation of a person, company, organization, or place\",\r\n \"type\": \"object\"\r\n}\r\n\r\n```\r\nand got the error:\r\n`Caused by: com.networknt.schema.JsonSchemaException: Unknown MetaSchema: https://json-schema.org/draft/2019-09/schema`\r\nso i guess 2020-12, 2019-09 is not supported.\r\n\r\nAre there any plans to support them soon?\r\n\r\nBest & Thx\r\nMarcel", "url": "https://github.com/Apicurio/apicurio-registry/issues/2689", "labels": ["type/bug", "priority/high"], "created_at": "2022-06-10T06:30:48Z", "topic": "Schema / Type / Compatibility"}, {"number": 2493, "title": "Consider input validation on group and artifactId inputs", "body": "This would be to further limit the possibility of some kind of JS injection attack on the UI.\r\n\r\nImplementation of this should probably happen in both the UI and at the REST layer.", "url": "https://github.com/Apicurio/apicurio-registry/issues/2493", "labels": ["type/enhancement", "priority/low", "area/ui"], "created_at": "2022-05-10T11:06:32Z", "topic": "Version / Ui / Api"}, {"number": 2479, "title": "Improve API input validation and the resulting errors", "body": "When creating an artifact with a very long group name, the issue is caught in the database as a constrain violation, and the resulting HTTP code is 500. We should validate inputs at a higher level, before the request is being processed. In the control plane, we use `javax.validation` annotations on the DTOs i.e. https://github.com/bf2fc6cc711aee1a0c2a/srs-fleet-manager/blob/main/core/src/main/java/org/bf2/srs/fleetmanager/rest/service/model/RegistryCreateDto.java#L36 , and `quarkus-hibernate-validator` extension. In Registry, we could do the same if there are suitable DTOs, or validate on REST...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2479", "labels": ["type/quality", "priority/normal"], "created_at": "2022-05-03T12:15:59Z", "topic": "Version / Ui / Api"}, {"number": 2473, "title": "Expose canonicalization endpoints", "body": "We have a use case where it would be useful to be able to compare a version of a JSON schema that our producer uses, to the version that has been registered in Apicurio. While there are a couple of endpoints that indicate it uses a canonicalized/protocol specific version of the schema, there is no endpoint that allows me to `GET` the canonicalized schema from an arbitrarily provided schema.\r\n\r\nCan this be considered as an enhancement?", "url": "https://github.com/Apicurio/apicurio-registry/issues/2473", "labels": ["type/enhancement", "priority/normal"], "created_at": "2022-04-29T01:40:00Z", "topic": "Schema / Type / Compatibility"}, {"number": 2412, "title": "Add missing X-Content-Type-Options: nosniff header", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/2412", "labels": ["priority/normal"], "created_at": "2022-04-07T17:07:14Z", "topic": "Version / Ui / Api"}, {"number": 2411, "title": "Add missing HSTS headers to error pages", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/2411", "labels": ["priority/normal"], "created_at": "2022-04-07T17:06:38Z", "topic": "Version / Ui / Api"}, {"number": 2369, "title": "Apicurio registry OpenAPi schema incorporating multiple authentication methods.", "body": "## Definition of the problem\r\n\r\nWhen generating client codebase from current apicurio registry code clients will ignore every authentication provider we use. \nThis means that users using SDK providing username and password will not authenticate properly.\r\n\r\nKey challenge here is that upstream APicurio-registry is agnostic of authentication and there is no way to provide optional authentication schemes as for now: https://github.com/OAI/OpenAPI-Specification/issues/14\r\n\r\nOpenAPI spec provides number of authentication providers that can be selected but we would not know which one to use as this ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2369", "labels": ["type/discussion", "priority/normal"], "created_at": "2022-03-24T10:20:28Z", "topic": "Authentication / Kubernetes / Authorization"}, {"number": 2303, "title": "Support avro single object encoding / resolve schema by fingerprint", "body": "Avro supports [single object encoding](https://avro.apache.org/docs/current/spec.html#single_object_encoding), where the payload is stored in a bytearray which is prefixed with a fingerprint id. This allows very little overhead but still keeps the schema information on the serialized bytes. The fingerprint is a long id that is derived directly from the schema using a hash (that changes with every schema update).\r\n\r\nWhen you deserialize such a bytearray, you need to read the fingerprintId and use a SchemaStore (aka the registry) to load the exact schema version that was used to write the data. ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/2303", "labels": ["type/enhancement", "priority/normal"], "created_at": "2022-03-01T19:43:48Z", "topic": "Avro / Schema / Java"}, {"number": 2267, "title": "Improve discoverability of Rule config in REST API", "body": "Each rule has its own configuration. We should try to improve the OpenAPI so that the allowed values for each rule are more discoverable. Or we should add an API call to discover the possible configuration values.", "url": "https://github.com/Apicurio/apicurio-registry/issues/2267", "labels": ["type/enhancement", "priority/normal"], "created_at": "2022-02-15T11:45:18Z", "topic": "Schema / Type / Compatibility"}, {"number": 2256, "title": "Add links from dynamic properties in the Settings UI to online Docs", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/2256", "labels": ["type/enhancement", "priority/normal", "area/ui"], "created_at": "2022-02-11T16:14:34Z", "topic": "Git / Registry / Reference"}, {"number": 2229, "title": "Error when trying to upload json schema 2020-12", "body": "Hello.\r\nI'm trying to upload json schemas and I'm running into a problem. When I try to specify json schema 2020-12, I get an error.\r\nHere is my the json schema:\r\n```\r\n{\r\n \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\r\n \"title\": \"myTitle\"\r\n}\r\n```\r\nHowever, if I just change the json schema version to draft-07, it uploads just fine.\r\n```\r\n{\r\n \"$schema\": \"https://json-schema.org/draft-07/schema#\",\r\n \"title\": \"myTitle\"\r\n}\r\n```\r\nI didn't find any indication in the documentation which version of the json schema is supported. What are the rules for json schemas really?", "url": "https://github.com/Apicurio/apicurio-registry/issues/2229", "labels": ["type/bug", "priority/high"], "created_at": "2022-02-01T14:42:39Z", "topic": "Schema / Type / Compatibility"}, {"number": 1929, "title": "[3.0] REST API : Return more specific error codes to users", "body": "Error codes that are returned are currently very generic - 404 is generic argument missing. \nIt will be better if errors contain information about specifics - like - missing group, artifact doesn't exist. wrong type etc.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1929", "labels": ["type/enhancement"], "created_at": "2021-10-11T13:15:38Z", "topic": "Version / Ui / Api"}, {"number": 1854, "title": "Document structure of the input file for the Import operation", "body": "Use case:\r\n\r\nBatch import data that does not come from an export operation.\r\n\r\nTodo:\r\n\r\nDocument the structure of the `.zip` file that the `import` endpoint expects in input, so that external integrator could produce it offline and feed it to a SR instance.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1854", "labels": ["type/task"], "created_at": "2021-09-17T09:31:07Z", "topic": "Uncategorized"}, {"number": 1821, "title": "Feat: Add i18n to apicurio registry", "body": "Add i18n to apicruio registry to support multiple languages.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1821", "labels": [], "created_at": "2021-09-08T16:13:03Z", "topic": "Updates / Operator"}, {"number": 1794, "title": "Allow searching for artifacts by globalId", "body": "It would be nice, in the UI, to have some way to navigate to an artifact version by globalId. We probably don't want to support searching for artifacts by globalId in the main search area. Perhaps a separate user interaction - some action like \"Lookup by GlobalId\" or some such.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1794", "labels": ["type/enhancement", "version/2.1.x"], "created_at": "2021-08-27T14:53:08Z", "topic": "Uncategorized"}, {"number": 1788, "title": "Use the attribute `version` of the specification to register an artifact by UI", "body": "Many API specifications includes a `version` property (e.g. OpenAPI, AsyncAPI). That property helps to identify the API version to others and it helps to identify changes between versions.\r\n\r\nAsyncAPI Sample:\r\n\r\n```yaml\r\nasyncapi: 2.1.0\r\ninfo:\r\n title: Hello world application\r\n version: '0.1.0'\r\n```\r\n\r\nOpenApi Sample\r\n\r\n```yaml\r\nopenapi: 3.0.2\r\ninfo:\r\n title: Hello World API\r\n version: 1.0.0\r\n```\r\n\r\nIt could be a great feature to use that property from the API spec to define the version of the artifact when it is uploaded using the UI, as similar with the auto-detect feature, then use auto-ver...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1788", "labels": ["type/enhancement", "Beginner Friendly"], "created_at": "2021-08-27T08:06:28Z", "topic": "Version / Ui / Api"}, {"number": 1783, "title": "Spark schema support", "body": "Hello,\r\n\r\nAre there any plans to support Spark schemas?\r\n\r\nCheers", "url": "https://github.com/Apicurio/apicurio-registry/issues/1783", "labels": ["type/enhancement"], "created_at": "2021-08-24T20:31:54Z", "topic": "Iceberg / Catalog / Table"}, {"number": 1782, "title": "Add another admin-override option: regexp to match principal", "body": "It might be useful to have another admin-override feature in the auth layer that allows the configuration of a Regular Expression to match the name of a principal. For example, the admin override could be a regular express like `admin(.*)` which would cause any user with a principal name starting with `admin` to be give admin privileges.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1782", "labels": ["type/enhancement"], "created_at": "2021-08-24T18:45:19Z", "topic": "Schema / Type / Compatibility"}, {"number": 1759, "title": "Missing rules / bugs with Protobuf schema compatibility module", "body": "Looking at the Protobuf documentation of updating a schema for [proto2](https://developers.google.com/protocol-buffers/docs/proto#updating) and [proto3](https://developers.google.com/protocol-buffers/docs/proto3#updating), I notice that the following rules are missing for Protobuf schema compatibility module:\r\n\r\n| Rule | Description |\r\n| ----------- | ----------- |\r\n| Adding non-required field(s) is compatible | For proto2, new fields should be `optional` or `repeated`. For proto3, any new field can be added. |\r\n| Removing non-required field(s) is compatible, as long as the field number is not...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1759", "labels": [], "created_at": "2021-08-11T19:20:05Z", "topic": "Uncategorized"}, {"number": 1711, "title": "Jsonschema compatibility errors list support for allOf", "body": "a while ago I was handling #712 by adding #958 and it doesn't support list of compatibility errors if my schema properties is defined with allOf.\r\nlet's say this is my schema:\r\n\r\n```\r\n{\r\n \"title\": \"Person\",\r\n \"type\": \"object\",\r\n \"allOf\": [\r\n {\r\n \"properties\": {\r\n \"authId\": {\r\n \"type\": \"string\",\r\n \"description\": \"PK of the person from identity table\",\r\n \"@classification\": \"RESTRICTED\"\r\n }\r\n }\r\n }\r\n ]\r\n}\r\n```\r\n\r\nand I'm changing the `authId` field name to `authId2` which is an incompatible change. \n\r\nthis is the error message I get:\r\n\r\n`{causes: [{description: \"COMBINED_TYPE_SUBSCHEMA_NOT_COMPAT...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1711", "labels": [], "created_at": "2021-07-26T11:10:58Z", "topic": "Schema / Type / Compatibility"}, {"number": 1686, "title": "Allow to upload new version of artifact with compatibility rules enabled.", "body": "Hello folks,\r\n\r\nI have version 1 of Artifact (JsonSchema) without **timestamp** field. Whenever I activate any compatibility rule and try uploading new version with optional **timestamp** I got exception: \n\r\n```\r\norg.everit.json.schema.SchemaException: #: could not determine version\r\n\tat org.everit.json.schema.loader.SchemaLoader.(SchemaLoader.java:338)\r\n\tat org.everit.json.schema.loader.SchemaLoader$SchemaLoaderBuilder.build(SchemaLoader.java:149)\r\n\tat io.apicurio.registry.rules.compatibility.jsonschema.JsonSchemaDiffLibrary.findDifferences(JsonSchemaDiffLibrary.java:54)\r\n\tat io.apicurio.regi...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1686", "labels": ["type/bug", "priority/high", "area/rules/compatibility"], "created_at": "2021-07-17T14:06:31Z", "topic": "Schema / Type / Compatibility"}, {"number": 1486, "title": "Duplicate schemas caused by different line endings", "body": "The same schema is registered duplicately if uploaded via maven plugin from file with CR+LF line endings (e.g. from windows workstation) and then from file with LF line endings (e.g. from jenkins pipeline). Serialization of a message with such schema then fails - rest client cannot find such schema in schema registry. \n\r\nWorkaround is to set line endings to LF manually on each file but it is very uncomfortable for developers and error prone.\r\n\r\nCould you change registration so that it does not register duplicate schema if it differs only in line endings? Or make duplicate schema lookup not fai...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1486", "labels": ["type/enhancement", "type/discussion"], "created_at": "2021-05-06T09:52:18Z", "topic": "Schema / Type / Compatibility"}, {"number": 1444, "title": "JSON schema compatibility rule bug: Remove an optional field should be backward compatible not full compatible", "body": "It is tested with the code in at this [commit](https://github.com/Apicurio/apicurio-registry/commit/c8c510ed7fd0ca47ef27d55554d8ecfdc84252dd).\r\n\r\n```\r\n\"original\": {\r\n \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"postal_code\": {\r\n \"type\": \"number\"\r\n },\r\n \"street\": {\r\n \"type\": \"string\"\r\n }\r\n }\r\n},\r\n\"updated\": {\r\n \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"street\": {\r\n \"type\": \"string\"\r\n }\r\n }\r\n}\r\n```", "url": "https://github.com/Apicurio/apicurio-registry/issues/1444", "labels": [], "created_at": "2021-04-19T18:41:56Z", "topic": "Schema / Type / Compatibility"}, {"number": 1441, "title": "Expose more details on JSON subschema compability violation DiffType", "body": "Currently, if a subschema change of a combined schema is backward incompatible, the DiffType is [`COMBINED_TYPE_SUBSCHEMA_NOT_COMPATIBLE`](https://github.com/Apicurio/apicurio-registry/blob/master/schema-compatibility/json/src/main/java/io/apicurio/registry/rules/compatibility/jsonschema/diff/CombinedSchemaDiffVisitor.java#L134). \n\r\nIt is not very helpful to diagnose which part of the subschema change is incompatible. For my own use case, I want to understand whether the subschema change is in a specific category of DiffType and branch the logic in later process.\r\n\r\nCan it emit the exact DiffT...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1441", "labels": [], "created_at": "2021-04-19T14:51:04Z", "topic": "Schema / Type / Compatibility"}, {"number": 1375, "title": "Add a way to enable relaxed compatibility rules", "body": "Related to #1334 \n\r\nCurrently, compatibility rules are only an on/off functionality. If the rule implementation is too strict or unable to cover some cases (e.g. regexp pattern in JSON schema), users have no way to tell the system they want to override the rule or relax some requirements.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1375", "labels": ["type/enhancement"], "created_at": "2021-03-24T14:22:37Z", "topic": "Schema / Type / Compatibility"}, {"number": 1368, "title": "JSON compatibility check for conditional schema", "body": "Hello,\r\n\r\nI am testing the JSON compatibility check for conditional schema. There are some cases that seem incorrect.\r\n\r\nLet me know what do you think!\r\n\r\nFor example:\r\nif added; and vice versa for if removed\r\n(a) full compatible\r\n```\r\n\"original\": {\r\n \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"case\": {\"enum\": [\"lower\", \"upper\"]},\r\n \"data\": {\"type\": \"string\"}\r\n }\r\n},\r\n\"updated\": {\r\n \"$schema\": \"http://json-schema.org/draft-07/schema#\",\r\n \"type\": \"object\",\r\n \"properties\": {\r\n \"case\": {\"enum\": [\"lower\", \"upper\"]},\r\n \"data\": {\"type\": \"string\"}\r\n ...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1368", "labels": ["type/bug"], "created_at": "2021-03-22T20:56:43Z", "topic": "Schema / Type / Compatibility"}, {"number": 1334, "title": "Protobuf backwards compatibility check issue?", "body": "Hello, thank you for sharing the Apicurio Registry, it's a great service. I have a question about whether the logic for protobuf backwards compatibility is conforming to what protobufs actually consider backwards compatible. Particularly, with regards to the `checkNoChangingFieldNames` method.\r\n\r\nIf I create a v1 message like this: \n```\r\nsyntax = \"proto3\";\r\n\r\nmessage FooMessage {\r\n string foo = 1;\r\n int32 page_number = 2;\r\n}\r\n```\r\n\r\nAnd then attempt to create a v2 message in which I remove a field:\r\n```\r\nsyntax = \"proto3\";\r\n\r\nmessage FooMessage {\r\n reserved \"foo\";\r\n reserved 1;\r\n int32 page_nu...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1334", "labels": ["type/question"], "created_at": "2021-03-11T20:32:28Z", "topic": "Uncategorized"}, {"number": 1196, "title": "V2 search API - exact or LIKE search by groupId", "body": "From PR #1189 . \nThis issue will be the follow up for the discussion about how the searchApi at the storage level should behave when searching by groupId.\r\n\r\nJust to move on we decided to make the search by groupId exact, but in the future we may explore other options.", "url": "https://github.com/Apicurio/apicurio-registry/issues/1196", "labels": ["type/discussion"], "created_at": "2021-02-08T13:38:19Z", "topic": "Search / Query / Count"}, {"number": 1181, "title": "Add support for gRPC", "body": "We already have protobuf support, so adding support for grpc shouldn't be too hard!", "url": "https://github.com/Apicurio/apicurio-registry/issues/1181", "labels": ["type/enhancement"], "created_at": "2021-02-01T12:23:46Z", "topic": "Api / Apicurioregistry1 / Protobuf"}, {"number": 1144, "title": "Create annotation to exclude a method from liveness checking", "body": "We have annotations to enable liveness checking for certain CDI beans: `@PersistenceExceptionLivenessApply`\r\n\r\nThis is nice but sometimes we may have internal methods within a class annotated with this annotation that we do **not** want to trigger a liveness failure. For example, the `withHandle()` method in `AbstractSqlRegistryStorage` can throw an exception which will be either caught or re-thrown by some other method in the `AbstractSqlRegistryStorage` class. It would be good to have another annotation we can put on that method so that the Liveness checker ignores any exceptions thrown from...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1144", "labels": [], "created_at": "2021-01-14T18:19:52Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 1122, "title": "[Feature] Github/Git integration using post hooks", "body": "APIcurio registry gives developers a lot of features and benefits over schemas in the code, however, one can argue that keeping schemas in the repository and utilizing git versioning/PR building capabilities can replicate some of the capabilities. \n\r\nTo bridge this and convince developers (especially non-Java ones) to use APIcurio across the entire organization, git repository storage could be possibly introduced. \n\r\nContent bellow is outdatdd\r\nSee:\r\nhttps://github.com/Apicurio/apicurio-registry/issues/1122#issuecomment-756155876\r\n\r\n## Challenges \n\r\n1. Schema storage metadata and human readabl...", "url": "https://github.com/Apicurio/apicurio-registry/issues/1122", "labels": ["type/enhancement"], "created_at": "2021-01-06T10:48:31Z", "topic": "Git / Registry / Reference"}, {"number": 974, "title": "REST API - return artifactId , version and globalId in headers ", "body": "It could be useful to return artifactId, artifact version and globalId in the response headers of all endpoints that return an artifact content. \n\r\nThis way the number of requests neede by clients could be reduced...\r\n\r\nIn order to take advantage of this feature RegistryRestClient should gather those headers\r\n\r\nExample:\r\n```\r\n$http :8080/api/artifacts/io.famartin.new-order\r\nHTTP/1.1 200 OK\r\nCache-control: public, max-age=31536000\r\nContent-Length: 245\r\nContent-Type: application/json\r\nDate: Mon, 02 Nov 2020 12:13:42 GMT\r\nExpires: Tue, 02 Nov 2021 12:13:42 GMT\r\nX-Registry-ArtifactId:io.famartin.n...", "url": "https://github.com/Apicurio/apicurio-registry/issues/974", "labels": ["type/enhancement", "version/2.0.x"], "created_at": "2020-11-02T12:19:58Z", "topic": "Git / Registry / Reference"}, {"number": 956, "title": "Add support for FlatBuffers artifact type", "body": "https://google.github.io/flatbuffers/", "url": "https://github.com/Apicurio/apicurio-registry/issues/956", "labels": ["type/enhancement"], "created_at": "2020-10-26T14:29:56Z", "topic": "Uncategorized"}, {"number": 807, "title": "Add support for the Thrift format", "body": "Able to auto-detect and upload Thrift format schema\r\n\r\nThrift schema definition https://thrift.apache.org/docs/idl\r\nThrift tutorial https://thrift.apache.org/tutorial/\r\nExample file https://raw.githubusercontent.com/apache/thrift/master/contrib/fb303/if/fb303.thrift", "url": "https://github.com/Apicurio/apicurio-registry/issues/807", "labels": ["type/enhancement", "priority/normal"], "created_at": "2020-09-07T09:49:05Z", "topic": "Uncategorized"}, {"number": 716, "title": "Support \"usages\" as a data-driven way to document how to consume an artifact for a user", "body": "A nice feature in the UI would be a section for \"Usage\" - similar to what API documentation generators and maven central provide:\r\n\r\n\r\n\r\n\r\n\r\nOriginally I was thinking we should do something similar just in the UI, but it might be more powerful to make it data-driven and user defined. We could have a new collection in the Registry API like:\r\n\r\n`/usages`\r\n\r\nThis would be a collection of templates that could be managed by admins of the registry. The UI could pull these templates in order to display customized \"usage\" information for each artifact. Some possible default \"usage\" templates might be:...", "url": "https://github.com/Apicurio/apicurio-registry/issues/716", "labels": ["type/enhancement", "type/discussion"], "created_at": "2020-07-28T12:09:57Z", "topic": "Git / Registry / Reference"}, {"number": 656, "title": "Add UI support for \"testing\" potential artifact content update", "body": "There is a \"test\" operation in the REST api that allows a user to upload a new version of an artifact to check whether the new version passes all enabled/configured rules active for the artifact. It doesn't ever actually add the content, it just answers the question \"would this be allowed if I were to upload it?\". We need a UI action to perform this test.", "url": "https://github.com/Apicurio/apicurio-registry/issues/656", "labels": ["type/enhancement", "area/ui", "version/3.x"], "created_at": "2020-06-24T17:29:43Z", "topic": "Version / Ui / Api"}, {"number": 634, "title": "Add basic skinning/branding capability in UI", "body": "It would be useful if the UI could be configured with different logos and favicons so that deployers of the application can brand the UI without rebuilding it.", "url": "https://github.com/Apicurio/apicurio-registry/issues/634", "labels": ["type/enhancement", "priority/low", "area/ui"], "created_at": "2020-06-17T12:11:15Z", "topic": "Git / Registry / Reference"}, {"number": 633, "title": "Improve HTTP cache headers", "body": "## Summary\n\nCurrently we are very simplistic in our approach to the HTTP headers for caching. We basically disable caching for everything other than UI resources (css, js, etc). Instead, we should consider if there are better caching strategies for `/api` resources.\n\n---\n\n## Current State\n\nThe `ResourceCacheControlFilter` explicitly disables caching for all `/apis/` endpoints:\n\n```java\nif (requestURI.contains(\"/apis/\")) {\n disableCaching = true;\n}\n```\n\nHeaders set for API responses:\n```http\nExpires: [yesterday]\nPragma: no-cache\nCache-control: no-cache, no-store, must-revalidate\n```\n\n**Location...", "url": "https://github.com/Apicurio/apicurio-registry/issues/633", "labels": ["type/task"], "created_at": "2020-06-17T12:09:50Z", "topic": "Uncategorized"}, {"number": 365, "title": "Run quality inspection tools at build time", "body": "Use [code quality tools](https://github.com/gregswindle/maven-code-quality-pom/blob/master/README.md) and maven plugins, such as FindBugs or PMD\r\n\r\nSee also #359", "url": "https://github.com/Apicurio/apicurio-registry/issues/365", "labels": ["type/quality"], "created_at": "2020-04-08T15:50:05Z", "topic": "Graphql / Federation / Xml"}, {"number": 360, "title": "Improve rule configuration", "body": "Rule configuration should not be a single string - the options that rules require should be explicitly defined, multi-valued and possibly type-checked.\r\n\r\nSee also #359", "url": "https://github.com/Apicurio/apicurio-registry/issues/360", "labels": ["type/enhancement"], "created_at": "2020-04-08T15:36:37Z", "topic": "Schema / Type / Compatibility"}, {"number": 218, "title": "Compatibility Rule: Kafka Connect Schema", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/218", "labels": [], "created_at": "2020-01-14T16:51:32Z", "topic": "Kafka / Schema / Kafkasql"}, {"number": 217, "title": "Compatibility Rule: GraphQL", "body": "", "url": "https://github.com/Apicurio/apicurio-registry/issues/217", "labels": [], "created_at": "2020-01-14T16:51:14Z", "topic": "Uncategorized"}, {"number": 16, "title": "Compatibility Rule: AsyncAPI", "body": "Implement the compatibility rule for AsyncAPI schemas. We'll need to really analyze the avro version to implement similar logic for AsyncAPI.", "url": "https://github.com/Apicurio/apicurio-registry/issues/16", "labels": ["type/enhancement"], "created_at": "2019-07-30T17:25:26Z", "topic": "Uncategorized"}];
  var issueByIndex = {};
  ISSUE_DATA.forEach(function(d, i) { issueByIndex[i] = d; });

  var card = document.getElementById('issue-card');
  var backdrop = document.getElementById('issue-card-backdrop');
  var cardTitle = document.getElementById('card-title');
  var cardTopic = document.getElementById('card-topic');
  var cardBody = document.getElementById('card-body');
  var cardLabels = document.getElementById('card-labels');
  var cardDate = document.getElementById('card-date');
  var cardLink = document.getElementById('card-link');
  var cardClose = document.getElementById('card-close');
  var cardHeader = document.getElementById('card-header');

  // --- Drag support ---
  var isDragging = false, dragOffsetX = 0, dragOffsetY = 0;

  cardHeader.addEventListener('mousedown', function(e) {
    if (e.button !== 0 || e.target === cardClose) return;
    isDragging = true;
    document.body.classList.add('card-dragging');
    var rect = card.getBoundingClientRect();
    card.style.transform = 'none';
    card.style.top = rect.top + 'px';
    card.style.left = rect.left + 'px';
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    card.style.left = (e.clientX - dragOffsetX) + 'px';
    card.style.top = (e.clientY - dragOffsetY) + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      document.body.classList.remove('card-dragging');
    }
  });

  // --- Lightweight markdown renderer ---
  function renderMarkdown(text) {
    if (!text) return '(no description)';
    var h = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    h = h.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
    h = h.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
    h = h.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
    h = h.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
    h = h.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
    h = h.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/__(.+?)__/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
    h = h.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
    h = h.replace(/\n\n+/g, '</p><p>');
    h = h.replace(/\n/g, '<br>');
    h = h.replace(/<\/li><br>/g, '<\/li>');
    h = h.replace(/<br><li>/g, '<li>');
    h = h.replace(/<br>(<h[1-6]>)/g, '$1');
    h = h.replace(/<\/h[1-6]><br>/g, function(m) { return m.replace('<br>', ''); });
    return '<p>' + h.replace(/<p>\s*<\/p>/g, '') + '</p>';
  }

  function showCard(issue) {
    cardTitle.innerHTML = '<span id="card-number">#' + issue.number + '</span> ' +
      issue.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    cardTopic.textContent = issue.topic || '';
    cardBody.innerHTML = renderMarkdown(issue.body);
    cardLabels.innerHTML = '';
    (issue.labels || []).forEach(function(label) {
      var pill = document.createElement('span');
      pill.className = 'card-label-pill';
      pill.textContent = label;
      cardLabels.appendChild(pill);
    });
    cardDate.textContent = issue.created_at ? issue.created_at.substring(0, 10) : '';
    cardLink.href = issue.url || '#';
    backdrop.style.display = 'block';
    card.style.display = 'block';
  }

  function hideCard() {
    card.style.display = 'none';
    backdrop.style.display = 'none';
    card.style.top = '50%';
    card.style.left = '50%';
    card.style.transform = 'translate(-50%, -50%)';
  }

  cardClose.addEventListener('click', hideCard);
  backdrop.addEventListener('click', hideCard);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideCard();
  });

  // Hook into deck.gl's onClick via the DataMap instance.
  // DataMapPlot creates a global `datamap` variable with a `.deckgl` DeckGL instance.
  function hookDeckClick() {
    if (window.datamap && window.datamap.deckgl) {
      window.datamap.deckgl.setProps({
        controller: {scrollZoom: {speed: 0.05, smooth: true}},
        onClick: function(info) {
          if (info && info.picked && info.index != null) {
            var issue = issueByIndex[info.index];
            if (issue) { showCard(issue); return true; }
          }
        }
      });
      // Remove CSS transition on canvas that causes sluggish repaints
      var canvas = document.querySelector('canvas');
      if (canvas) canvas.style.transition = 'none';
    }
  }

  // Retry until DataMap is initialized (data loads asynchronously)
  var attempts = 0;
  var timer = setInterval(function() {
    attempts++;
    if (window.datamap && window.datamap.deckgl) {
      clearInterval(timer);
      hookDeckClick();
    } else if (attempts > 30) {
      clearInterval(timer);
    }
  }, 500);
})();
</script>
