"url": "https://github.com/Apicurio/apicurio-registry/issues/656", "label": "Version / Ui / Api"}, {"x": 0.11679, "y": 0.40403, "z": 0.41786, "topic_id": 3, "number": 634, "title": "Add basic skinning/branding capability in UI", "url": "https://github.com/Apicurio/apicurio-registry/issues/634", "label": "Git / Registry / Reference"}, {"x": 0.39068, "y": -0.27881, "z": 0.51534, "topic_id": -1, "number": 633, "title": "Improve HTTP cache headers", "url": "https://github.com/Apicurio/apicurio-registry/issues/633", "label": "Uncategorized"}, {"x": -0.10303, "y": -0.31097, "z": -0.0999, "topic_id": 12, "number": 365, "title": "Run quality inspection tools at build time", "url": "https://github.com/Apicurio/apicurio-registry/issues/365", "label": "Graphql / Federation / Xml"}, {"x": -0.78569, "y": 0.10578, "z": 0.7175, "topic_id": 0, "number": 360, "title": "Improve rule configuration", "url": "https://github.com/Apicurio/apicurio-registry/issues/360", "label": "Schema / Type / Compatibility"}, {"x": -0.65101, "y": 0.09076, "z": -0.4266, "topic_id": 1, "number": 218, "title": "Compatibility Rule: Kafka Connect Schema", "url": "https://github.com/Apicurio/apicurio-registry/issues/218", "label": "Kafka / Schema / Kafkasql"}, {"x": -0.44676, "y": 0.22222, "z": -0.01577, "topic_id": -1, "number": 217, "title": "Compatibility Rule: GraphQL", "url": "https://github.com/Apicurio/apicurio-registry/issues/217", "label": "Uncategorized"}, {"x": -0.46407, "y": -0.02206, "z": -0.11734, "topic_id": -1, "number": 16, "title": "Compatibility Rule: AsyncAPI", "url": "https://github.com/Apicurio/apicurio-registry/issues/16", "label": "Uncategorized"}];
const TOPIC_COLORS = {"-1": "#555555", "0": "#e6194b", "1": "#3cb44b", "2": "#ffe119", "3": "#4363d8", "4": "#f58231", "5": "#911eb4", "6": "#42d4f4", "7": "#f032e6", "8": "#bfef45", "9": "#fabed4", "10": "#469990", "11": "#dcbeff", "12": "#9a6324", "13": "#fffac8", "14": "#800000"};
const LEGEND_ENTRIES = [{"topic_id": -1, "label": "Uncategorized", "color": "#555555"}, {"topic_id": 0, "label": "Schema / Type / Compatibility", "color": "#e6194b"}, {"topic_id": 1, "label": "Kafka / Schema / Kafkasql", "color": "#3cb44b"}, {"topic_id": 2, "label": "Updates / Operator", "color": "#ffe119"}, {"topic_id": 3, "label": "Git / Registry / Reference", "color": "#4363d8"}, {"topic_id": 4, "label": "Api / Apicurioregistry1 / Protobuf", "color": "#f58231"}, {"topic_id": 5, "label": "Agent / Mcp / Registry", "color": "#911eb4"}, {"topic_id": 6, "label": "Authentication / Kubernetes / Authorization", "color": "#42d4f4"}, {"topic_id": 7, "label": "Operator / Metrics / High", "color": "#f032e6"}, {"topic_id": 8, "label": "Iceberg / Catalog / Table", "color": "#bfef45"}, {"topic_id": 9, "label": "Search / Query / Count", "color": "#fabed4"}, {"topic_id": 10, "label": "Grants / Access / Permissions", "color": "#469990"}, {"topic_id": 11, "label": "Xregistry / Model / Epoch", "color": "#dcbeff"}, {"topic_id": 12, "label": "Graphql / Federation / Xml", "color": "#9a6324"}, {"topic_id": 13, "label": "Version / Ui / Api", "color": "#fffac8"}, {"topic_id": 14, "label": "Avro / Schema / Java", "color": "#800000"}];

// ── Scene setup ────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.01, 100
);
camera.position.set(1.8, 1.2, 1.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── Controls ───────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.autoRotate     = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance    = 0.5;
controls.maxDistance    = 8;

// ── Build point cloud ──────────────────────────────────────
const count = DATA_POINTS.length;
const positions = new Float32Array(count * 3);
const colors    = new Float32Array(count * 3);
const sizes     = new Float32Array(count);
const BASE_SIZE = 0.15;

for (let i = 0; i < count; i++) {
  const p = DATA_POINTS[i];
  positions[i * 3]     = p.x;
  positions[i * 3 + 1] = p.y;
  positions[i * 3 + 2] = p.z;

  const hex = TOPIC_COLORS[String(p.topic_id)] || "#555555";
  const c = new THREE.Color(hex);
  colors[i * 3]     = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;

  sizes[i] = BASE_SIZE;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("color",    new THREE.BufferAttribute(colors, 3));
geometry.setAttribute("size",     new THREE.BufferAttribute(sizes, 1));

// Custom shader so we can control per-point size
const material = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (200.0 / -mvPosition.z);
      gl_Position  = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.35, 0.5, d);
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
});

const pointCloud = new THREE.Points(geometry, material);
scene.add(pointCloud);

// Subtle ambient light (not strictly needed for points but nice for feel)
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// ── Raycaster / interaction ────────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.06;
const mouse = new THREE.Vector2();
const tooltipEl = document.getElementById("tooltip");

let hoveredIndex = -1;

function onPointerMove(event) {
  mouse.x =  (event.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(pointCloud);

  const sizeAttr = geometry.getAttribute("size");

  // Reset previous highlight
  if (hoveredIndex >= 0) {
    sizeAttr.setX(hoveredIndex, BASE_SIZE);
    sizeAttr.needsUpdate = true;
  }

  if (intersects.length > 0) {
    const idx = intersects[0].index;
    hoveredIndex = idx;
    sizeAttr.setX(idx, BASE_SIZE * 2.5);
    sizeAttr.needsUpdate = true;

    const p = DATA_POINTS[idx];
    tooltipEl.innerHTML =
      '<span class="tt-number">#' + p.number + '</span> ' +
      p.title.replace(/</g, "&lt;") +
      '<div class="tt-label">' + p.label.replace(/</g, "&lt;") + '</div>';
    tooltipEl.style.display = "block";
    tooltipEl.style.left = (event.clientX + 14) + "px";
    tooltipEl.style.top  = (event.clientY + 14) + "px";

    // Keep tooltip on screen
    const rect = tooltipEl.getBoundingClientRect();
    if (rect.right > window.innerWidth) {
      tooltipEl.style.left = (event.clientX - rect.width - 14) + "px";
    }
    if (rect.bottom > window.innerHeight) {
      tooltipEl.style.top = (event.clientY - rect.height - 14) + "px";
    }

    renderer.domElement.style.cursor = "pointer";
  } else {
    hoveredIndex = -1;
    tooltipEl.style.display = "none";
    renderer.domElement.style.cursor = "default";
  }
}

function onClick(event) {
  if (hoveredIndex >= 0) {
    const url = DATA_POINTS[hoveredIndex].url;
    if (url) window.open(url, "_blank", "noopener");
  }
}

window.addEventListener("pointermove", onPointerMove, false);
window.addEventListener("click", onClick, false);

// ── Legend ─────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
let legendHTML = "<h3>Topics</h3>";
for (const entry of LEGEND_ENTRIES) {
  legendHTML += '<div class="legend-item">' +
    '<span class="legend-swatch" style="background:' + entry.color + '"></span>' +
    entry.label.replace(/</g, "&lt;") +
    '</div>';
}
legendEl.innerHTML = legendHTML;

// ── Resize handling ────────────────────────────────────────
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
